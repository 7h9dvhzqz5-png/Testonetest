[267,326,"S. McGowan","IND","RB",78,12,13,4,59,24.7,2,0,0,"committee",1,0,""],
[268,244,"DJ Giddens","IND","RB",79,12,13,4,-24,30.7,1.1,-0.9,0,"committee",1,0,""],
[269,233,"S. Perine","CIN","RB",80,12,6,2,-36,41.7,4.1,2.1,0,"committee",1,0,""],
[270,270,"K. Miller","NO","RB",81,12,8,3,0,34.4,4.0,2.0,0,"committee",1,0,""],
[271,242,"J. Bech","LV","WR",96,12,13,2,-29,25.6,1.4,-3.1,0,"rotational",1,0,""],
[272,283,"M. Mims Jr.","DEN","WR",97,12,10,2,11,28.9,3.5,-1.0,0,"rotational",1,0,""],
[273,215,"T. Thornton","KC","WR",98,12,5,2,-58,36.3,4.4,-0.1,0,"rotational",1,1,"Tyquan Thornton re-signed with the Chiefs on a two-year deal worth $11 million. This is notable given that only Xavier Worthy and Jalen Royals were the other Chiefs WRs under contract for the 2027 season. The speedy wide receiver had his most productive season in the NFL last year, catching 19 passes for 438 yards and three touchdowns (on nearly 1,000 air yards and 23 deep targets). He stepped up at the start of the year due to Worthy’s injury and Rashee Rice’s suspension. Over the first 5 weeks of the year, Thornton averaged 10.3 fantasy points per game. His 2025 yardage and touchdown totals set new career-highs, and he averaged 23.1 yards per reception (first in the NFL). Also had zero recorded drops."],
[274,231,"M. Fields","NYG","WR",99,12,8,4,-43,33.1,2,-2.5,0,"rotational",1,1,"Malachi Fields lands in an intriguing spot with the Giants after being selected in the third round of the 2026 NFL Draft. The 6-foot-5 receiver brings size and downfield ability to New York’s offense, flashing strong ball skills and separation ability throughout the pre-draft process despite a disappointing Combine 40 time. Fields profiles as a strong fit alongside Jaxson Dart given his vertical play style, and Malik Nabers’ injury could open the door for early-season opportunities. He’s an intriguing rookie stash with upside if he earns immediate snaps during training camp."],
[275,265,"M. Taylor","NYJ","TE",34,12,13,4,-10,27.1,3.5,2.0,0,"starter",1,0,""],
[276,338,"I. Davis","NYJ","RB",82,12,13,3,62,23.8,3.1,1.1,0,"committee",1,0,""],
[277,277,"ATL DST","ATL","DST",17,12,11,4,0,26.8,2.3,0.8,0,"starter",1,0,"Atlanta starts the year at Pittsburgh and at home versus the Panthers. Decent spot for an underrated unit that was a fringe top 12 unit in 2025. Just need more clarity on second-year EDGE rusher James Pearce Jr. and his availability for the upcoming season. Because otherwise, the projections love Atlanta as an underrated unit (second in projected sacks) after finishing last year second in that category."],
[278,286,"K. Williams","NE","WR",100,12,11,2,8,37.8,2.2,-2.3,0,"rotational",1,0,""],
[279,213,"G. Holani","SEA","RB",83,12,11,4,-66,31.2,1.9,-0.1,0,"committee",1,0,""],
[280,234,"M. Penix Jr.","ATL","QB",31,12,11,4,-46,31.3,13.7,1.8,0,"starter",1,0,""],
[281,221,"C. Brazzell II","CAR","WR",101,12,5,2,-60,28.4,2,-2.5,0,"rotational",1,1,"Chris Brazzell gives Carolina’s young offense a much-needed vertical element after the Panthers added the explosive former Tennessee receiver in Round 3. At 6-foot-4 with legit speed, Brazzell profiles as a field stretcher capable of creating splash plays immediately, even if week-to-week consistency takes time. His path to fantasy relevance likely depends on carving out a specialized deep-threat role early while developing the rest of his game. The profile carries some risk given Tennessee receivers’ mixed NFL track record, but the athleticism and early-career production make him an intriguing long-term bet."],
[282,282,"W. Lutz","DEN","K",16,12,10,1,0,29.3,7.9,-2.1,0,"starter",1,0,"Will Lutz has been steady in his three seasons with the Broncos, making 89.0% of his field goals and 98.3% of his extra points over that span. Unfortunately, Lutz has not been awash in field goal opportunities since coming to Denver, with the Broncos ranking 14th, 16th and 19th in FG attempts the last three seasons. Lutz has finished 22nd, eighth and 16th in fantasy scoring among kickers over that span."],
[283,179,"G. Dulcich","MIA","TE",35,12,6,5,-104,49.9,3.7,2.2,0,"starter",1,0,"Injuries and inconsistent usage have thus far kept four-year veteran Greg Dulcich from establishing a firm foothold in the NFL, but in 2026 he’ll have a chance to be a prominent contributor to a Dolphins offense that lacks proven pass-catching talent. Hamstring injuries limited Dulcich to 10 games as a rookie with the Broncos in 2022 and two games in his second season. Dulcich played four games for Denver in 2024, was released in November, then played five late-season games for the Giants. Dulcich signed with Miami midway through the 2025 season and had 26 catches for 335 yards and a touchdown in 10 games. The Dolphins re-signed Dulcich to another one-year deal in the offseason, and he now sits atop their depth chart at tight end. Miami selected three wise receivers in this year’s draft, and none of the veteran receivers on the roster have ever had more than 610 receiving yards in a season. Although Miami isn’t expected to have a high-powered passing attack with the inexperienced Malik Willis taking over as the starting quarterback, Dulcich could be a sneaky-good fantasy option this year."],
[284,284,"W. Reichard","MIN","K",17,12,6,2,0,30.9,9.4,-0.6,0,"starter",1,0,"Will Reichard had a strong showing for the Vikings in his second NFL season, finishing sixth in fantasy scoring among kickers and averaging 9.4 fantasy points per game. Reichard missed only two kicks all season, converting 33-of-35 field goals and 31-of-31 extra points. Both of the misses came from 50 yards or longer. The Vikings offense could be more potent this season is the team gets better quarterbacking, and that seems like a given considering how problematic the QB position was for Minnesota in 2025. Reichard also gets to play his home games in a dome, which is a bonus. Reichard could be a sneaky-good fantasy option."],

(function dedupeADP(){
 // Name collisions: two "J. Taylor" (Jonathan, IND) and a deep JAC namesake both matched the same
 // market row, giving a 2.6-point player an elite ADP. Park any duplicate name+pos whose projection
 // is far below the one it was matched to, so it cannot pollute the board or the survival model.
 const byKey={};
 PLAYERS.forEach(p=>{const k=p.fullName+"|"+p.pos;(byKey[k]=byKey[k]||[]).push(p);});
 Object.values(byKey).forEach(g=>{
   if(g.length<2)return;
   g.sort((a,b)=>b.proj-a.proj);
   for(let i=1;i<g.length;i++){
     if(g[i].proj < g[0].proj*0.5){
       g[i].adp=Math.max(g[i].adp, 260+i);
       g[i].adpEff=g[i].adp;
     }
   }
 });
})();

function botValuePick(t){
 // Sharp/sharks value model: pick the best VOR player that fits a real roster need,
 // mirroring how the engine itself evaluates — so these bots build LEGAL, competitive teams.
 const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
 PLAYERS.forEach(p=>{if(S.teamOf[p.id]===t&&c[p.pos]!=null)c[p.pos]++;});
 const left=rosterCap()-(c.QB+c.RB+c.WR+c.TE+c.K+c.DST), rd=roundOf(S.pick);
 const REQ2={QB:1,RB:2,WR:2,TE:1,K:1,DST:1};
 // still-needed REQUIRED starters (incl K/DST)
 const stillNeed=Object.keys(REQ2).reduce((a,p)=>a+Math.max(0,REQ2[p]-c[p]),0);
 // HARD ENDGAME: if remaining picks == required starters still missing, ONLY draft a missing-need pos.
 const mustFill=left<=stillNeed;
 let best=null,bv=-1e9;let seen=0;
 for(const p of available()){seen++;if(seen>44)break;
   const need=c[p.pos]<(REQ2[p.pos]||0);
   if(mustFill&&!need)continue;                              // no luxury picks when out of slack
   const rep=replFor(p.pos); let v=(p.proj-rep);
   const useful={RB:5,WR:5,TE:2,QB:2,K:1,DST:1}[p.pos]||2;
   if(need)v+=14; else if(c[p.pos]>=useful)v-=22; else v-=3;
   // K/DST: don't take early, but DO take them once we're at/after the streaming window
   if(p.pos==="K"||p.pos==="DST"){
     if(rd<13&&!mustFill)v-=200;                             // too early
     else v+=20;                                             // it's time — prioritise filling the slot
   }
   v*=Math.max(0.2,mgrBoost(t,p,rd));                        // never let boost flip a sign oddly
   if(v>bv){bv=v;best=p;}
 }
 // absolute fallback: if somehow nothing chosen but a required pos is open, grab best available there
 if(!best){for(const pos of ["K","DST","TE","QB","RB","WR"]){if(c[pos]<(REQ2[pos]||0)){best=available().filter(p=>p.pos===pos)[0];if(best)break;}}}
 if(!best)best=available()[0];
 return best;
}
function botCandidates(t,pk,rndFn){
 // Shared realistic rival model used by practice bots AND (mirrored) by survival sims.
 const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
 PLAYERS.forEach(p=>{if(S.teamOf[p.id]===t&&c[p.pos]!=null)c[p.pos]++;});
 const left=rosterCap()-(c.QB+c.RB+c.WR+c.TE+c.K+c.DST);
 const rd=roundOf(pk), w=posW(t,c,left,rd), sharp=mgrSharp(t);
 const cands=[];let seen=0;
 for(const p of available()){seen++;if(seen>32)break;
   // STEEP ADP gravity: being past a player's ADP pulls hard; elite ADPs barely slip.
   const d=pk-p.adp;                               // >0 = he's lasted past expected
   let adpF;
   if(d<=-8) adpF=0.04;                            // way earlier than ADP — rarely reached
   else if(d<=-3) adpF=0.35;                       // a bit early
   else adpF=Math.min(3.2, Math.exp(d/6));         // at/after ADP → gravity ramps fast (overdue = very likely)
   // ELITE STICKINESS: top ~24 ADP players are "best available" magnets regardless of need
   let elite=1;
   if(p.adp<=6) elite=6.5;
   else if(p.adp<=12) elite=4.2;
   else if(p.adp<=24) elite=2.3;
   else if(p.adp<=40) elite=1.4;
   // need weight matters more in mid/late rounds; early rounds are talent-driven
   const needW=(w[p.pos]||0.25);
   let talentVsNeed = rd<=4 ? (0.35+0.65*needW) : needW;   // early: don't let need suppress elites
   const _n=(typeof diffTuning==="function"?diffTuning().noise:1);
   const slop=sharp?(0.92+rndFn()*0.16*_n):(0.78+rndFn()*0.44*_n); // sharp = tighter; difficulty scales noise
   let wt=talentVsNeed*elite*adpF*mgrBoost(t,p,rd)*slop;
   // ── roster legality guards (mirror the engine's own lockout so bots field legal teams) ──
   const REQb={QB:1,RB:2,WR:2,TE:1,K:1,DST:1};
   const needB=c[p.pos]<(REQb[p.pos]||0);
   const stillB=Object.keys(REQb).reduce((a,q)=>a+Math.max(0,REQb[q]-c[q]),0);
   const slackB=left-stillB;
   // luxury caps: never a 2nd QB / 3rd TE / 7th RB / 7th WR on a bot (wastes a roster spot)
   if((p.pos==="QB"&&c.QB>=1)||(p.pos==="TE"&&c.TE>=2)||(p.pos==="RB"&&c.RB>=6)||(p.pos==="WR"&&c.WR>=6)){ if(!needB)wt*=0.02; }
   // endgame: once spare picks run out, only need-filling picks survive
   if(slackB<=0&&!needB)wt*=0.005;
   // K/DST: suppressed early, but FORCED in the streaming window / when needed
   if(p.pos==="K"||p.pos==="DST"){
     if(needB&&(left<=3||rd>=13))wt=Math.max(wt,4.0)*(0.8+rndFn()*0.4); // it's time — make them real candidates
     else wt*=0.008;                                                     // otherwise not yet
   }
   cands.push({p,wt});
 }
 // striker injection (signature QB/TE moves) if that pos is absent from the window
 const sp=strikePos(t,rd,c);
 if(sp&&!cands.some(x=>x.p.pos===sp)){
   const bp=available().filter(p=>p.pos===sp).sort((a,b)=>a.ovr-b.ovr)[0];
   // Even a manager who loves an early QB or TE does not take him 20 picks before the market
   // does. Scale the signature strike by the same ADP gravity everyone else obeys, or the
   // model has Josh Allen (highest raw projection on the board) going 1st overall.
   if(bp){
     const sd=pk-bp.adp;
     const sf = sd<=-16 ? 0.05 : sd<=-8 ? 0.30 : sd<=-3 ? 0.75 : 1;
     cands.push({p:bp,wt:3.0*sf*(0.8+rndFn()*0.4),strike:true});
   }
 }
 return {cands,sp};
}

function myFollowingPick(){ // the pick that falls to me AFTER my next turn ("what survives to my pick after this one?")

let _nextAvail=null, _phase="early";
function rawVal(p){return (300-p.ovr)*0.6+(p.proj-replFor(p.pos))*4*0.4;}
function rivalNeeds(team){ // what does this rival still need? returns weights per pos
 const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
 PLAYERS.forEach(p=>{if(S.teamOf[p.id]===team&&c[p.pos]!=null)c[p.pos]++;});
 const n=rosterCap()-(c.QB+c.RB+c.WR+c.TE+c.K+c.DST);

 // higher weight = more likely to draft that pos next
 w.RB=c.RB<2?1.6:(c.RB<4?0.8:0.3);
 w.WR=c.WR<2?1.6:(c.WR<4?0.8:0.3);
 w.TE=c.TE<1?1.0:0.15;

}
function predictGone(uptoPick){
 // Simulate picks S.pick..uptoPick-1: each rival takes the player maximizing (adpValue * needWeight).
 // Returns a Set of player ids likely gone. Deterministic, fast, opponent-aware.
 const gone=new Set();
 const _DR=marketDrift();                       // same room calibration as the survival model
 const pool=available().filter(p=>!gone.has(p.id)).sort((a,b)=>a.adp-b.adp);
 // work on a lightweight cloned availability
 const taken=new Set();
 for(let pk=S.pick;pk<uptoPick;pk++){
   const t=teamOnClock(pk);
   if(t===seatIdx())continue;               // skip my own picks
   const cc={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
   PLAYERS.forEach(p=>{if(S.teamOf[p.id]===t&&cc[p.pos]!=null)cc[p.pos]++;});
   const w=posW(t,cc,rosterCap()-(cc.QB+cc.RB+cc.WR+cc.TE+cc.K+cc.DST),roundOf(pk));
   // candidate = best by (ADP proximity + need). Consider top ~25 by ADP for speed.
   let best=null,bestScore=-Infinity;
   let seen=0;
   for(const p of pool){
     if(taken.has(p.id))continue;
     seen++; if(seen>30)break;               // rivals pick near ADP; top 30 is plenty
     const _ea=(p.adpEff!=null?p.adpEff:p.adp)+(_DR.rel[p.pos]||0);   // market position, momentum-adjusted
     const adpPull=Math.max(0,60-(_ea-(pk)));    // closer to going = more likely
     const need=(w[p.pos]||0.3)*mgrBoost(t,p,roundOf(pk));
     const sc=need*10+adpPull*0.4-(_ea-pk)*0.15;
     if(sc>bestScore){bestScore=sc;best=p;}
   }
   const spd=strikePos(t,roundOf(pk),cc);
   if(spd&&(!best||best.pos!==spd)){
     const bp=pool.find(p=>p.pos===spd&&!taken.has(p.id));
     if(bp)best=bp;
   }
   if(best){taken.add(best.id);gone.add(best.id);}
 }

}

 if(sig===_naSig&&_nextAvail)return;   // memoized — board unchanged since last compute
 _naSig=sig;

   gone=predictGone(follow);                 // OPPONENT-NEED-WEIGHTED survival (elite VONA)

function vonaOf(p){ // how much better p is than the best same-position player I'd get next time

function scoreOf(p){

 const boardVal=(300-p.ovr);                       // curated ECR spine

 if(S.live&&!S.done&&clockTeam()===seatIdx()){
   const plan=planSequence(3);
   if(plan&&plan.first&&ranked.length){
     const idx=ranked.findIndex(x=>x.p.id===plan.first.id);
     if(idx>0){
       const cand=ranked[idx], best=ranked[0], rd=roundOf(S.pick);
       const cp=cand.p;
       // ── RESEARCH-BACKED REACH RULE (expert consensus, 2026 draft guides) ──
       // A GOOD reach is justified only by: (a) tier protection — he's the last of a tier before a real
       // cliff; (b) scarcity — he won't survive to my next pick (high VONA); or (c) a genuine starter need.
       // A WILD reach = early-round, no justification, or K/DST. Tolerance scales UP by round (cheap to be
       // wrong late, catastrophic to be wrong early) and reaches must clear a reason gate.
       const c2=myPosCount(), REQ2={QB:1,RB:2,WR:2,TE:1,K:1,DST:1};
       const fillsNeed = c2[cp.pos] < (REQ2[cp.pos]||0);
       const tierProtect = (typeof tierLeft==="function") && tierLeft(cp)<=2 && cp.cliff>=3;   // last of a tier before a drop
       const scarce = ((typeof vonaOf==="function") && vonaOf(cp) >= 12)
                   || ((typeof survivalOf==="function") && survivalOf(cp) <= 0.35);   // VONA or Monte-Carlo: he won't be back
       const wait=Math.max(1,(typeof myFollowingPick==="function"?myFollowingPick():S.pick+8)-S.pick);
       // ADP-survival: negative means the market takes him before my next turn comes back round
       const surviveRisk=cp.adp-(S.pick+wait);

       // spending a pick ahead of better flex-eligible depth.
       const redundantQB = cp.pos==="QB" && myPosCount().QB>=1;
       const justified = !redundantQB && (fillsNeed || tierProtect || scarce || (surviveRisk<=-2 && (typeof tierLeft!=="function"||tierLeft(cp)<=3)));
       // never promote K/DST via the planner (experts: never reach on K/DST)
       const isKD = cp.pos==="K" || cp.pos==="DST";
       // round-scaled score tolerance (how many pts below the greedy best we'll accept for a justified reach)
       // Upside signal for late rounds: a player whose ceiling ('spike'/'unsettled' role) or ADP-vs-rank
       // suggests boom potential — this is the expert-endorsed reason to swing late.
       const upside = !redundantQB && ((cp.spike||cp.unsettled) || (cp.adp - cp.ovr <= -12) || cp.split);
       let tol;
       if(rd<=3)      tol = justified ? 3 : 1;        // rounds 1-3: essentially no reach — anchor with the best player
       else if(rd<=7) tol = justified ? 12 : 3;       // rounds 4-7: moderate, only with a real reason
       else           tol = justified ? 22 : (upside ? 12 : 3);  // rounds 8+: generous for JUSTIFIED or clear-upside swings; blind reaches still blocked
       // rank-gap guard also scales: keeps a late upside dart legal but blocks a first-3-rounds cliff-dive
       tol *= wait<=2 ? 0.55 : wait>=11 ? 1.3 : 1;   // snake-wait: back-to-back turn ⇒ no reach needed; long wait ⇒ braver
       const maxRankGap = rd<=3 ? 6 : rd<=7 ? 14 : 30;
       const gap = best.s - cand.s;
       const rankGap = cp.ovr - best.p.ovr;
       if(!isKD && gap<=tol && rankGap<=maxRankGap){
         const[pick]=ranked.splice(idx,1);ranked.unshift(pick);
       }
     }
   }
 }
 // ── SURVIVAL ARBITRAGE ──
 // Measured across 80 drafts: the ranking could top-line a player near-certain to still be here
 // while a genuinely better one was about to vanish. That loses both. If someone materially
 // better is far more endangered, take him first — the safe one is very likely still there.
 try{
   if(S.live&&!S.done&&clockTeam()===seatIdx()&&roundOf(S.pick)<=13&&ranked.length>1&&typeof survivalOf==="function"){
     const head=ranked[0];
     if(head.p.pos!=="K"&&head.p.pos!=="DST"){
       const sHead=survivalOf(head.p);
       if(sHead>=0.80){
         const hraw=scoreOf(head.p);
         for(let i=1;i<Math.min(ranked.length,8);i++){
           const cand=ranked[i];
           if(cand.p.pos==="K"||cand.p.pos==="DST")continue;
           if(cand.p.pos==="QB"&&myPosCount().QB>=1)continue;   // a second QB is never the arbitrage
           // nor is a quarterback who is not on my shortlist while one of mine is still there
           if(cand.p.pos==="QB"&&QB_TARGETS.indexOf(cand.p.id)<0&&QB_TARGETS.some(id=>BYID[id]&&!S.status[id]))continue;
           if(scoreOf(cand.p)>hraw+1 && sHead-survivalOf(cand.p)>0.35){
             const[sw]=ranked.splice(i,1);ranked.unshift(sw);
             break;
           }
         }
       }
     }
   }
 }catch(e){}

}

function draftPulse(){
 const logged=S.history.length;
 if(!S.live||logged<3)return null;
 let reachSum=0,cnt=0;const posGone={QB:0,RB:0,WR:0,TE:0};
 S.history.forEach(h=>{const p=BYID[h.id];if(!p)return;reachSum+=(p.adp-h.pick);cnt++;if(posGone[p.pos]!=null)posGone[p.pos]++;});
 const drift=cnt?reachSum/cnt:0;
 let hotPos=null,hotRatio=0;
 ["RB","WR","QB","TE"].forEach(pos=>{
   const gone=posGone[pos];const poolTop=PLAYERS.filter(p=>p.pos===pos&&!S.status[p.id]&&p.adp<=S.pick+8).length;
   const ratio=(gone+poolTop)?gone/(gone+poolTop):0;
   if(gone>=3&&ratio>hotRatio){hotRatio=ratio;hotPos=pos;}
 });
 return {drift,reaching:drift<-2,valueFalling:drift>2,hotPos,logged};
}

function seatBriefing(){
 // Data-backed opening read for THIS seat: what's realistically there at each of your first 4 picks.
 // Uses ADP survival to each pick slot (8-team board barely moves early, so this is high-confidence R1-2,
 // looser R3-4 — we say so honestly). Purpose: pre-plan the part of the draft that's most predictable.
 const seat=seatIdx(), picks=[];   // seatIdx() is 0-indexed to match teamOnClock()
 for(let pk=1;pk<=32;pk++){ if(teamOnClock(pk)===seat) picks.push(pk); }

 const pool=PLAYERS.filter(p=>p.pos!=="K"&&p.pos!=="DST").slice().sort((a,b)=>a.adp-b.adp);
 // crude but effective: a player is "likely there at pick P" if his ADP-rank ≈ P or later.
 // For each pick, the best player whose adp-rank is >= pick (i.e. expected to still be on the board).
 const lines=first4.map((pk,i)=>{
   // players expected gone before pk = those with adp-rank < pk; best available ≈ the one at index (pk-1)
   const bestAvail=pool[pk-1] || pool[pool.length-1];
   const nextFew=pool.slice(pk-1, pk+2).map(p=>p.fullName.split(" ").slice(-1)[0]).join(" / ");
   // elite-RB cliff: last top-15-overall RB by adp
   return {pk, rd:i+1, bestPos:bestAvail.pos, names:nextFew};
 });
 // where does the elite-RB window close for this seat? last pick that lands before ADP-rank ~15
 const eliteRBs=pool.filter(p=>p.pos==="RB").slice(0,6);           // ~top 6 RB by adp
 const lastEliteRBadp=eliteRBs.length?Math.max(...eliteRBs.map(p=>pool.indexOf(p)+1)):15;

}

function runPredictor(){
 if(!S.live)return null;
 const np=myFollowingPick(); if(!np||np<=S.pick)return null;
 const gap=np-S.pick;                       // picks before I'm up again
 const upcoming=[]; for(let pk=S.pick;pk<np;pk++)upcoming.push(teamOnClock(pk));
 // what do the upcoming teams need?
 const needCount={QB:0,RB:0,WR:0,TE:0};
 upcoming.forEach(t=>{const c={QB:0,RB:0,WR:0,TE:0};PLAYERS.forEach(p=>{if(S.teamOf[p.id]===t&&c[p.pos]!=null)c[p.pos]++;});
   ["RB","WR"].forEach(pos=>{if(c[pos]<2)needCount[pos]++;});["QB","TE"].forEach(pos=>{if(c[pos]<1)needCount[pos]++;});});
 // find the hottest need
 let hot=null,hn=0;for(const pos in needCount)if(needCount[pos]>hn){hn=needCount[pos];hot=pos;}
 if(hot&&hn>=Math.max(2,Math.ceil(gap*0.5))){
   const posAvail=available().filter(p=>p.pos===hot).sort((a,b)=>a.ovr-b.ovr);
   const topTier=posAvail.length?posAvail[0].tier:99;
   const inTier=posAvail.filter(p=>p.tier===topTier).length;
   const panic=inTier>hn;   // still depth in the tier = panic run, not real
   return {pos:hot,count:hn,gap,panic,names:posAvail.slice(0,hn).map(p=>p.fullName)};
 }
 return null;
}

function weekPts(team,wk){
 // roster for a team: rival = teamOf==team; mine = 'mine' status (teamOf may be my seat too)
 const roster=PLAYERS.filter(p=>team===seatIdx()?S.status[p.id]==="mine":S.teamOf[p.id]===team);
 // players AVAILABLE this week (not on bye). Byes are filled from YOUR OWN bench, not league replacement.
 const act=roster.filter(p=>p.bye!==wk);
 const arr=pos=>act.filter(p=>p.pos===pos).map(p=>p.proj).sort((a,b)=>b-a);
 const Q=arr("QB"),R=arr("RB"),W=arr("WR"),T=arr("TE"),K=arr("K"),D=arr("DST");
 // if a starter slot can't be filled from your active roster, you play a HOLE (well below replacement —
 // an empty/unusable slot), because in a shallow league your bench is thin. This makes byes actually bite.
 const hole={QB:8,RB:5,WR:5,TE:4,K:4,DST:2};   // points from a scramble waiver/empty slot by pos
 const pick=(a,n,pos)=>Array.from({length:n},(_,i)=>a[i]??hole[pos]);
 let pts=[...pick(Q,1,"QB"),...pick(R,2,"RB"),...pick(W,2,"WR"),...pick(T,1,"TE"),...pick(K,1,"K"),...pick(D,1,"DST")].reduce((a,b)=>a+b,0);
 // FLEX from the best remaining active RB/WR/TE, else a hole
 const left=[R[2],W[2],T[1]].filter(x=>x!=null);pts+=left.length?Math.max(...left):hole.WR;
 return pts;
}

   const mb=myRoster().filter(p=>(FLEXPOS.includes(p.pos)||p.pos==="QB")&&p.bye===i+1).length;
   const ob=oppByeCount(opp,i+1);
   return{wk:i+1,opp,mine,theirs,edge:mine-theirs,mb,ob};
 });

 const wins=played.filter(r=>r.edge>0).length;

}

/*═══════════════ HELPERS ═══════════════*/
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function posChip(pos,rank,sm){return `<span class="pchip${sm?' sm':''}" style="background:${POSCOLORS[pos]}">${pos}${rank?rank:""}</span>`;}
function grade(rankPct){ // legacy ordinal fallback (0=best)
 const g=["A+","A","A-","B+","B","B-","C+","C","D"];return g[Math.min(8,Math.floor(rankPct*9))];}
function gradeByMargin(myPts,allPts){
 // Margin-aware grade using BOTH: (a) points clear of the next-best roster, and (b) points vs
 // league average — measured in "starter-weeks" (~a useful weekly starter is ~11 pts). This makes a
 // dominant team an A+ and a photo-finish leader a B+, and doesn't get fooled by a high-scoring league.
 const mean=allPts.reduce((a,b)=>a+b,0)/allPts.length;
 const rank=allPts.filter(v=>v>myPts+0.001).length+1;
 const sorted=allPts.slice().sort((a,b)=>b-a);
 const nextBest=sorted[0]>myPts+0.001?sorted[0]:sorted[1];   // best rival's points
 const gapTop=myPts-nextBest;                                 // + if you lead, - if you trail leader
 const vsMean=myPts-mean;
 const UNIT=6;                                                // ~half a weekly starter; scales pts→grade
 // score blends your lead over the field (weighted) with your edge over average
 const score=(rank===1? gapTop*1.1 : -Math.abs(gapTop)*0.8) + vsMean*0.5;
 const s=score/UNIT;
 let g;
 if(rank===1&&gapTop>=10)g="A+";                              // clearly the best board
 else if(s>=1.6)g="A"; else if(s>=1.0)g="A-";
 else if(s>=0.4)g="B+"; else if(s>=0.0)g="B"; else if(s>=-0.5)g="B-";
 else if(s>=-1.1)g="C+"; else if(s>=-1.8)g="C"; else if(s>=-2.6)g="C-";
 else if(s>=-3.5)g="D"; else g="F";
 // guardrails
 if(g==="A+"&&rank>1)g="A";
 if(rank===1&&["C+","C","C-","D","F"].includes(g))g="B-";     // leading but tight → floor B-
 if(rank>=allPts.length-1&&["A+","A","A-","B+"].includes(g))g="B";  // near-worst can't be an A
 return {grade:g, rank, mean, gapTop, vsMean};
}

function waiverScore(p,ctx){
 // Roster-aware post-draft value. ctx (optional) precomputes roster state ONCE for the whole pool
 // — renderBestAvailable passes it, halving the hot path; standalone calls still work without it.
 if(!ctx){
   const c0=myPosCount(), bt0=byeTally(), pl0={};
   available().forEach(x=>{if(x.ovr<=180)pl0[x.pos]=(pl0[x.pos]||0)+1;});
   ctx={c:c0,bt:bt0,posLeft:pl0,baseProj:teamProj(seatIdx()),
        qbTeams:myRoster().filter(x=>x.pos==="QB").map(x=>x.team),
        pcTeams:myRoster().filter(x=>x.pos==="WR"||x.pos==="TE").map(x=>x.team)};
 }
 const {c,bt,posLeft,baseProj,qbTeams,pcTeams}=ctx;
 const REQ={QB:1,RB:2,WR:2,TE:1,K:1,DST:1};
 const useful={QB:2,RB:5,WR:5,TE:2,K:1,DST:1};
 const vor=p.proj-replFor(p.pos);
 const had=S.status[p.id], hadTeam=S.teamOf[p.id];
 S.status[p.id]="mine"; S.teamOf[p.id]=seatIdx();
 const lift=teamProj(seatIdx())-baseProj;
 if(had===undefined) delete S.status[p.id]; else S.status[p.id]=had;
 if(hadTeam===undefined) delete S.teamOf[p.id]; else S.teamOf[p.id]=hadTeam;
 const fillsStarter=c[p.pos]<(REQ[p.pos]||0);
 const surplus=c[p.pos]>=useful[p.pos];
 const scarce=((posLeft[p.pos]||0)-(p.ovr<=180?1:0))<=4;
 const byeBonus=(FLEXPOS.includes(p.pos)&&(bt[p.bye]||0)===0)?2:0;
 const stackBonus=(((p.pos==="WR"||p.pos==="TE")&&qbTeams.includes(p.team))||(p.pos==="QB"&&pcTeams.includes(p.team)))?3:0;
 let score=vor*3.0+lift*2.0;
 if(fillsStarter)score+=8; else if(surplus)score-=4;
 if((p.pos==="K"||p.pos==="DST")&&!fillsStarter)score-=8;
 if(scarce&&!surplus)score+=4;
 score+=byeBonus*0.5+stackBonus*0.5;
 const startable=p.proj>=replFor(p.pos)+2;
 let impact;
 if(fillsStarter&&lift>=2)impact="Starter upgrade";
 else if(fillsStarter)impact="Fills a starter";
 else if(lift>=2)impact="Lineup upgrade";
 else if((p.pos==="RB"||p.pos==="WR")&&startable&&vor>=2)impact="Flex/depth value";
 else if(p.pos==="RB"&&(p.watch||p.unsettled))impact="Handcuff/dart";
 else if(p.adp>=100&&(p.spike||p.unsettled||p.watch))impact="Bench dart";
 else if(stackBonus)impact="Stack piece";
 else if(byeBonus)impact="Bye-week cover";
 else if(startable)impact="Streamer/depth";
 else impact="Deep bench";
 return {score,impact,lift,vor};
}

function rosterSlots(){
 const mine=myRoster().slice();
 const filled=SLOTS.map(()=>null);
 const used=new Set();
 // fill fixed slots first
 SLOTS.forEach((s,i)=>{
   if(s[0]==="FLEX"||s[0]==="BN")return;
   const cand=mine.find(p=>p.pos===s[0]&&!used.has(p.id));
   if(cand){filled[i]=cand;used.add(cand.id);}
 });
 // flex
 const flexIdx=SLOTS.findIndex(s=>s[0]==="FLEX");
 const flexCand=mine.find(p=>FLEXPOS.includes(p.pos)&&!used.has(p.id));
 if(flexCand){filled[flexIdx]=flexCand;used.add(flexCand.id);}
 // bench = leftovers
 let bnStart=SLOTS.findIndex(s=>s[0]==="BN");
 mine.filter(p=>!used.has(p.id)).forEach(p=>{
   const slot=filled.findIndex((f,i)=>SLOTS[i][0]==="BN"&&!f);
   if(slot>=0){filled[slot]=p;used.add(p.id);}
 });
 return filled;
}
function teamProj(team){ // starters projection (per-game)
 const roster=PLAYERS.filter(p=>S.teamOf[p.id]===team||(team===seatIdx()&&S.status[p.id]==="mine"));
 const arr=pos=>roster.filter(p=>p.pos===pos).map(p=>p.proj).sort((a,b)=>b-a);
 const Q=arr("QB"),R=arr("RB"),W=arr("WR"),T=arr("TE"),K=arr("K"),D=arr("DST");
 const rep=pos=>replFor(pos);
 const pk=(a,n,pos)=>Array.from({length:n},(_,i)=>a[i]??rep(pos));
 let pts=[...pk(Q,1,"QB"),...pk(R,2,"RB"),...pk(W,2,"WR"),...pk(T,1,"TE"),...pk(K,1,"K"),...pk(D,1,"DST")].reduce((a,b)=>a+b,0);
 const left=[R[2],W[2],T[1]].filter(x=>x!=null);pts+=left.length?Math.max(...left):rep("WR");
 return pts;
}

 if(!mine.length){toast("Nothing drafted yet");return;}

 mine.forEach(h=>{const p=BYID[h.id];lines.push("R"+roundOf(h.pick)+" "+p.pos+" "+p.fullName+" ("+p.team+", bye "+p.bye+")");});
 lines.push("~"+Math.round(teamProj(seatIdx()))+" projected pts/wk");
 const txt=lines.join("\n");
 const done=()=>toast("Roster copied — paste it in the chat");
 function fallback(){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}
 else fallback();
}

function scheduleHtml(){
 if(!S.fixtures||S.fixtures.every(f=>f==null))return "";
 const bt=byeTally();
 const wks=S.fixtures.map((f,i)=>{
   const wk=i+1, mine=(bt[wk]||0), theirs=oppByeCount(f,wk);
   // net = how much worse off I am than my opponent that week
   const net=mine-theirs;
   const cls = mine>=3&&net>=2 ? "wk-bad" : mine>=2&&net>=1 ? "wk-warn" : net<=-2 ? "wk-good" : "";
   return {wk,f,mine,theirs,net,cls};
 });
 const cells=wks.map(w=>{
   const badge = w.mine||w.theirs
     ? `<span class="wk-b">${w.mine} v ${w.theirs}</span>` : "";
   return `<div class="wk ${w.cls}"><span class="wk-n">W${w.wk}</span><span class="wk-o">${esc(nameOf(w.f))}</span>${badge}</div>`;
 }).join("");
 // plain-English read of the season
 const worst=wks.slice().sort((a,b)=>b.net-a.net)[0];
 const best=wks.slice().sort((a,b)=>a.net-b.net)[0];
 const drafted=myRoster().filter(p=>FLEXPOS.includes(p.pos)||p.pos==="QB").length;
 let read;
 if(drafted<4){
   read="Draft a few starters and this fills in \u2014 each week will show how many of your starters are on bye against how many of theirs.";
 } else if(worst.net>=2){
   read=`<b>Week ${worst.wk} is your problem</b> \u2014 ${worst.mine} starters out against ${esc(nameOf(worst.f))}, who lose only ${worst.theirs}. That is the week to plan a waiver claim for, or to avoid stacking another bye onto.`
     + (best.net<=-2?` <b>Week ${best.wk}</b> is a free hit: they lose ${best.theirs}, you lose ${best.mine}.`:"");
 } else {
   read="<b>Your byes are well spread</b> \u2014 no week leaves you materially shorter than your opponent. Nothing to plan around.";
 }
 return `<div class="card"><div class="k">Season schedule \u2014 byes v opponent</div>
   <div class="wks">${cells}</div>
   <div class="wk-key"><span class="kk wk-bad"></span>you are short<span class="kk wk-warn"></span>watch<span class="kk wk-good"></span>they are shorter<span class="kk"></span>even</div>
   <p class="fine">${read}</p>
   <p class="fine">Numbers read <b>yours v theirs</b> \u2014 starting QB/RB/WR/TE on bye that week. Weeks 1\u20137
   repeat as 8\u201314, and no bye falls in the playoffs (week 15+), so a bye can never cost you a
   playoff game. Kicker and defence are excluded \u2014 you stream those.</p></div>`;
}
function renderLeague(){
 const el=document.getElementById("pg-league");
 const teams=Array.from({length:TEAMS},(_,t)=>{
   const roster=PLAYERS.filter(p=>t===seatIdx()?S.status[p.id]==="mine":S.teamOf[p.id]===t);
   return{t,roster,pts:teamProj(t)};
 }).sort((a,b)=>b.pts-a.pts);
 let cards="";
 teams.forEach((tm,rank)=>{
   const me=tm.t===seatIdx();
   const c={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};tm.roster.forEach(p=>c[p.pos]++);
   const needs=[];[["QB",1],["RB",2],["WR",2],["TE",1]].forEach(([pos,n])=>{if(c[pos]<n)needs.push(pos);});
   const players=tm.roster.sort((a,b)=>a.ovr-b.ovr).slice(0,8).map(p=>`<span class="tp"><span class="pdot" style="background:${POSCOLORS[p.pos]}"></span>${esc(p.fullName.split(" ").slice(-1)[0])}</span>`).join("");
   cards+=`<div class="tcard2 ${me?"me":""}"><div class="hd"><span class="trank">${rank+1}</span><span class="tname">${esc(nameOf(tm.t))}</span><span class="tpts">${tm.pts.toFixed(0)}</span></div>${tm.roster.length?`<div class="tplayers">${players}${tm.roster.length>8?`<span class="tp">+${tm.roster.length-8}</span>`:""}</div>`:`<div class="tblank">No picks logged yet</div>`}${needs.length&&tm.roster.length?`<div class="tneed">Still needs: ${needs.join(", ")}</div>`:""}</div>`;
 });
 el.innerHTML=`<div style="font-size:12px;color:var(--mut);margin-bottom:12px;line-height:1.5">All 8 rosters ranked by projected starting-lineup points. Yours is highlighted. Updates live as picks are logged.</div>${cards}`+scheduleHtml();
}

function renderReport(){
 const el=document.getElementById("pg-report");
 const mine=myRoster();
 if(!S.done&&mine.length<10){
   el.innerHTML=`<div class="empty">Your draft report unlocks when the draft completes.<br><br>It'll grade your roster, rank you in the league, map your bye-week stress against your fixtures, and show the value you captured.</div>`;return;
 }
 const myPts=teamProj(seatIdx());
 const allPts=Array.from({length:TEAMS},(_,t)=>t===seatIdx()?myPts:teamProj(t)).sort((a,b)=>b-a);
 const myRank=allPts.filter(v=>v>myPts).length+1;
 const _allPts=Array.from({length:TEAMS},(_,t)=>teamProj(t));
 const _gm=gradeByMargin(teamProj(seatIdx()),_allPts);
 const gr=_gm.grade;
 const _marginVsBest=teamProj(seatIdx())-Math.max(..._allPts.filter((_,i)=>i!==seatIdx()));
 const _marginVsMean=teamProj(seatIdx())-_gm.mean;
 // Draft steals & reaches — only diagnostic in rounds where board rank matters (1-9). For each of your
 // early picks, compare your player's talent rank to the BEST available skill player at that moment.
 // A "steal" = you got a top-tier faller (best-available or better than expected). A "reach" = you
 // passed clearly better players (15+ ranks) for need. Late rounds are dart-throws, so we skip them.
 let steals=0,reaches=0,worstPick=null,bestPick=null;
 {
   const drafted=new Set();
   S.history.slice().sort((a,b)=>a.pick-b.pick).forEach(h=>{
     const p=BYID[h.id];
     if(p&&h.team===seatIdx()&&roundOf(h.pick)<=9&&(p.pos==="RB"||p.pos==="WR"||p.pos==="TE"||p.pos==="QB")){
       // best available skill player by board rank right now
       let bestAvailOvr=Infinity;
       for(const q of PLAYERS){ if(drafted.has(q.id)||q.id===p.id)continue; if(q.pos==="K"||q.pos==="DST")continue; if(q.ovr<bestAvailOvr)bestAvailOvr=q.ovr; }
       const gap=p.ovr-bestAvailOvr;   // 0 = you took the best available; large + = reached past better players
       if(gap<=2){ steals++; if(!bestPick)bestPick=p; }         // took best-available (or a faller at ADP)
       else if(gap>=15){ reaches++; if(!worstPick||gap>worstPick.gap)worstPick={p,gap}; }
     }
     if(p)drafted.add(p.id);
   });
 }
 // positional bars vs league avg
 const posAvg={};["QB","RB","WR","TE"].forEach(pos=>{
   let tot=0;for(let t=0;t<TEAMS;t++){const r=PLAYERS.filter(p=>(t===seatIdx()?S.status[p.id]==="mine":S.teamOf[p.id]===t)&&p.pos===pos);tot+=r.sort((a,b)=>b.proj-a.proj).slice(0,pos==="RB"||pos==="WR"?2:1).reduce((a,b)=>a+b.proj,0);}
   posAvg[pos]=tot/8;
 });
 let bars="";
// data-backed coaching from 6 yrs of league history (Start 3/4)
 const _qbRd=(function(){const q=mine.find(p=>p.pos==="QB");const h=S.history.find(x=>x.team===seatIdx()&&BYID[x.id].pos==="QB");return h?roundOf(h.pick):null;})();
 const _wrBy5=S.history.filter(x=>x.team===seatIdx()&&roundOf(x.pick)<=5&&BYID[x.id].pos==="WR").length;
 let _coach=[];
 if(_qbRd&&_qbRd>=9)_coach.push("You left QB until round "+_qbRd+". In your league, waiting past round 8 has lined up with your worst finishes — a mid-rounds QB (≈6–8) has been the safer play.");
 if(_wrBy5<=1)_coach.push("Only "+_wrBy5+" WR through 5 rounds. In Full PPR, target-volume receivers score every week — your thinnest-WR drafts were your lowest finishes.");
 if(!_coach.length)_coach.push("Draft shape looks sound for your league. Historically these finishes are decided after the draft — win the waiver wire and start/sit and this roster competes.");
 const coachHtml=`<div class="coach"><div class="coach-h">From 6 years of your league</div>${_coach.map(c=>`<div class="coach-i">${c}</div>`).join("")}</div>`;
 bars=coachHtml;
 ["QB","RB","WR","TE"].forEach(pos=>{
   const r=mine.filter(p=>p.pos===pos).sort((a,b)=>b.proj-a.proj).slice(0,pos==="RB"||pos==="WR"?2:1);
   const mineP=r.reduce((a,b)=>a+b.proj,0);const avg=posAvg[pos]||1;const pct=Math.max(8,Math.min(100,(mineP/(avg*1.6))*100));
   const good=mineP>=avg;
   bars+=`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><span style="color:${POSCOLORS[pos]};font-weight:800;font-family:var(--mono)">${pos}</span><span style="font-family:var(--mono);color:${good?'var(--green)':'var(--mut)'}">${mineP.toFixed(0)} vs ${avg.toFixed(0)} avg</span></div><div style="height:8px;background:var(--card2);border-radius:5px;overflow:hidden;box-shadow:0 1px 0 var(--edge) inset"><div style="height:100%;width:${pct}%;background:${good?'var(--green)':POSCOLORS[pos]};border-radius:5px"></div></div></div>`;
 });
 // bye stress map (relative to fixtures)
 const fx=fixtureView();
 let stress="";
 if(fx.played){
   const holes=fx.rows.filter(r=>r.opp!=null&&r.mb>=1).sort((a,b)=>b.mb-a.mb);
   if(holes.length){
     holes.slice(0,6).forEach(r=>{
       const net=r.edge;const cls=r.mb>=2&&r.ob<2?"bad":"warn";
       stress+=`<div class="byec ${cls}"><span class="wk">Wk ${r.wk} · vs ${esc(nameOf(r.opp).split(" ").slice(-1)[0])}</span><span class="n">${r.mb}</span><span class="nm">you −byes, them ${r.ob} · net ${net>=0?"+":""}${net.toFixed(0)} ${net>=0?"✓":"✕"}</span></div>`;
     });
   }else stress=`<div style="font-size:12px;color:var(--green)">Byes spread cleanly — no scramble weeks. Well drafted.</div>`;
 }else{
   stress=`<div style="font-size:12px;color:var(--txt2);line-height:1.5">Add your fixture rotation in Settings to see bye stress weighted by the opponent you face each week.</div>`;
 }
 el.innerHTML=`
  ${myRoster().length?'<div class="copyrow"><button class="copybtn" onclick="copyRoster()">⧉ Copy roster for the group chat</button></div>':''}<div class="strength">${bearImg(44)}<div><div class="k">Draft grade</div><div class="grade" style="color:${myRank<=2?'var(--green)':myRank<=4?'var(--gold)':'var(--orange)'}">${gr}</div></div><div style="text-align:right"><div class="k">Projected finish</div><div class="v">${myRank}<span class="u">/8</span></div></div></div>
  <div class="marginline">${_marginVsBest>=0?`<b style="color:var(--green)">+${_marginVsBest.toFixed(0)} pts/wk clear</b> of the next-best roster`:`<b style="color:var(--orange)">${_marginVsBest.toFixed(0)} pts/wk</b> behind the leader`} · ${_marginVsMean>=0?"+":""}${_marginVsMean.toFixed(0)} vs league average. ${Math.abs(_marginVsBest)<3?"Tight race — the draft got you competitive; the season is won on waivers & start/sit.":_marginVsBest>=8?"Commanding board — you drafted a genuine contender.":"Solid position heading into the year."}</div>
  <div class="panel"><div class="panel-t">Draft discipline (early rounds)</div><div style="font-size:13px;color:var(--txt2);line-height:1.6"><b style="color:var(--green);font-family:var(--mono)">${steals}</b> best-available pick${steals===1?"":"s"} · <b style="color:${reaches>=3?'var(--orange)':'var(--txt2)'};font-family:var(--mono)">${reaches}</b> notable reach${reaches===1?"":"es"}. ${reaches===0?"Clean, value-driven board — no early reaches.":reaches<=2?"Mostly disciplined; a reach or two for roster fit is fine.":"Several early reaches — make sure each was worth passing better talent."}${worstPick?`<br>Biggest reach: <b style="color:var(--ink)">${esc(worstPick.p.fullName)}</b> (${worstPick.gap} better-ranked players were available)`:""}</div></div>
  <div class="panel"><div class="panel-t">Positional strength vs league</div>${bars}</div>
  <div class="panel"><div class="panel-t">Bye-week stress map</div><div class="byegrid">${stress}</div></div>
 `;
}

function renderRail(){
 const el=document.getElementById("rail");
 const nextP=myNextPick();
 const mine=myRoster().length;
 let items;
 if(S.live){
   const r=nextP?roundOf(nextP):"—";
   const pu=S.done?"—":picksUntilMe();
   items=[["My pick",S.done?"DONE":`R${r} · #${nextP||"—"}`,S.done],["Until me",S.done?"—":(pu===0?"NOW":pu+" away"),pu===0&&!S.done],["Roster",`${mine}/15`,false],["Overall",`${Math.min(S.pick,TOTAL)}/${TOTAL}`,false]];
 }else{
   items=[["My slot",`Pick ${S.seat}`,false],["Format","8·½PPR",false],["Rounds","15",false],["Pool",`${available().length}`,false]];
 }
 el.innerHTML=items.map(([l,v,on])=>`<div class="stat"><span class="kicker">${l}</span><b class="${on?"on":""}">${v}</b></div>`).join("");
}
let _fixIdx=null;
function fixOpen(k){_fixIdx=(_fixIdx===k?null:k);save();render();}
function reassign(k,team){
 const h=S.history[k];if(!h)return;
 if(team===seatIdx()&&h.team!==seatIdx()&&myCount()>=rosterCap()){toast("Papal roster is full \u2014 can\u2019t add another");return;}
 const p=BYID[h.id];
 h.team=team;S.teamOf[h.id]=team;S.status[h.id]=(team===seatIdx())?"mine":"taken";
 _fixIdx=null;save();render();
 if(p)toast("Owner fixed: "+p.fullName+" \u2192 "+nameOf(team));
}
function recentStrip(){
 if(!S.live||!S.history.length)return "";
 const n=Math.min(3,S.history.length);
 const rows=[];
 for(let k=S.history.length-1;k>=S.history.length-n;k--){
   const h=S.history[k];const p=BYID[h.id];if(!p)continue;
   const mine=h.team===seatIdx();const open=_fixIdx===k;const newest=k===S.history.length-1;
   rows.push(`<div class="rp${mine?" rp-me":""}">
     <button class="rp-b" onclick="fixOpen(${k})"><span class="rp-n">#${h.pick}</span><span class="rp-t">${esc(nameOf(h.team))}</span><span class="rp-p">${esc(p.fullName)}</span><span class="rp-c">${open?"\u2715":"fix"}</span></button>
     ${newest?`<button class="rp-u" onclick="undo()" title="Undo this pick">\u21ba</button>`:""}
     ${open?`<div class="rp-fix"><span class="rp-lbl">Actually picked by</span><div class="rp-ms">${Array.from({length:TEAMS},(_,ti)=>`<button class="rp-m${ti===h.team?" on":""}" onclick="reassign(${k},${ti})">${esc(nameOf(ti))}</button>`).join("")}</div></div>`:""}
   </div>`);
 }
 return `<div class="rpwrap"><div class="rp-h">Last picks \u2014 check the owner, tap <b>fix</b> if it\u2019s wrong</div>${rows.join("")}</div>`;
}
function renderLivectl(){
 const el=document.getElementById("livectl");
 if(!S.live){
   el.innerHTML=`<button class="startbar" onclick="startDraft()">▶ Start the draft</button><button class="startbar ghost" onclick="startPractice()">◉ Practice draft — 7 bots, real flow</button>`;return;
 }
 const done=S.done;
 const you=!done&&clockTeam()===seatIdx();
 el.innerHTML=`<div class="clockbar ${you?"you":""} ${done?"done":""}">
   <div class="ckl"><span class="ckk">${done?`All ${TOTAL} picks logged`:"Pick "+S.pick+" · Round "+roundOf(S.pick)}</span><span class="ckt">${S.practice?`<em class="ckpr">PRACTICE</em> `:""}${done?"DRAFT COMPLETE":you?"THE PAPAL ARE ON THE CLOCK":"On the clock: "+esc(nameOf(clockTeam()))}</span></div>
   <span class="ckbtns">${done?`<button class="ckbtn" onclick="go('report')">View report</button><button class="ckbtn" onclick="resetDraft()">↻ Start again</button>`:`<button class="ckbtn" onclick="resetDraft()">↻</button><button class="ckbtn" onclick="endDraft()">${S.history.length<10?"Cancel":"End"}</button>`}</span>
 </div>${recentStrip()}`;
}
const TABS=[["board","Board","▤"],["papal","Papal","★"],["watch","Watch","◉"],["league","League","⛨"],["report","Report","✓"],["strategy","Plan","◆"]];
function renderTabs(){
 const el=document.getElementById("tabs");
 const focusLive=S.focus!==false&&S.live&&!S.done;
 // Live, only the two tabs that change a pick stay out; the rest are prep and post-mortem.
 const list=(focusLive&&!S.moreTabs)?TABS.filter(([id])=>id==="board"||id==="papal"||id===S.tab):TABS;
 let html=list.map(([id,label,ico])=>{
   let badge="";
   if(id==="papal"&&myRoster().length)badge=`<span class="badge">${myRoster().length}</span>`;
   if(id==="board"&&S.live&&!S.done&&clockTeam()===seatIdx())badge=`<span class="badge">•</span>`;
   const lab=(focusLive&&id==="board")?"Now":label;
   return `<button class="${S.tab===id?"on":""}" onclick="go('${id}')"><span class="ico">${ico}</span>${lab}${badge}</button>`;
 }).join("");
 if(focusLive)html+=`<button class="${S.moreTabs?"on":""}" onclick="S.moreTabs=!S.moreTabs;save();render()"><span class="ico">${S.moreTabs?"×":"⋯"}</span>${S.moreTabs?"Less":"More"}</button>`;
 el.innerHTML=html;
}

function go(tab){S.tab=tab;save();_keepScroll=false;render();window.scrollTo({top:0,behavior:"smooth"});}
let _keepScroll=true;let _focusInfo=null;
function qlogEnter(){
 if(!(S.live&&!S.done&&!S.practice&&clockTeam()!==seatIdx()))return;
 const q=S.qlogQ.trim().toLowerCase();
 const av2=available();
 let pool;
 if(q){pool=av2.slice().sort((a,b)=>a.adp-b.adp).filter(p=>p.fullName.toLowerCase().includes(q)).slice(0,6);}
 else if(typeof botCandidates==="function"){try{pool=botCandidates(clockTeam(),S.pick,()=>0.5).cands.sort((a,b)=>b.wt-a.wt).slice(0,6).map(x=>x.p);}catch(e){pool=av2.slice().sort((a,b)=>a.adp-b.adp).slice(0,6);}}
 else pool=av2.slice().sort((a,b)=>a.adp-b.adp).slice(0,6);
 if(pool.length){S.qlogQ="";mark(pool[0].id,"taken");}
}
function render(){
 // Apple-feel: a render must never fight the user — preserve scroll & input focus across rebuilds
 let _sy=null;try{_sy=(typeof window!=="undefined"&&typeof window.scrollY==="number")?window.scrollY:null;}catch(e){}
 try{const ae=document.activeElement;_focusInfo=(ae&&ae.id&&ae.tagName==="INPUT")?{id:ae.id,ss:ae.selectionStart,se:ae.selectionEnd}:null;}catch(e){_focusInfo=null;}
 document.querySelectorAll(".pg").forEach(p=>p.classList.remove("on"));
 const active=document.getElementById("pg-"+S.tab);if(active)active.classList.add("on");
 renderRail();renderLivectl();renderTabs();
 if(S.tab==="board")renderBoard();
 else if(S.tab==="papal")renderPapal();
 else if(S.tab==="league")renderLeague();
 else if(S.tab==="report")renderReport();
 else if(S.tab==="strategy")renderStrategy();
 else if(S.tab==="watch")renderWatch();
 else if(S.tab==="settings")renderSettings();
 try{if(_keepScroll&&_sy!=null&&typeof window.scrollTo==="function")window.scrollTo(0,_sy);}catch(e){}
 _keepScroll=true;
 try{if(_focusInfo){const el=document.getElementById(_focusInfo.id);if(el&&el.focus){el.focus();if(el.setSelectionRange&&_focusInfo.ss!=null)el.setSelectionRange(_focusInfo.ss,_focusInfo.se);}}}catch(e){}
}
