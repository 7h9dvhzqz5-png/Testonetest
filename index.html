[40,38,"E. Egbuka","TB","WR",18,5,10,4,-2,11.1,7.8,-1.3,0,"contested",0,0,"Emeka Egbuka could crush his mid WR2 draft cost this season. Egbuka faded after Week 5 last year after he sustained a hamstring injury, and Baker Mayfield’s injury severely impacted his ability to feed catchable targets to the receiving options in Tampa Bay. In Weeks 1-5, Egbuka was the WR3 in fantasy points per game, commanding a 22.1% target share with 89 receiving yards per game, 2.71 yards per route run, a 26.1% first-read share, and 0.104 first downs per route run (per Fantasy Points Data). Had Egbuka kept up that pace all season, he would have ranked 19th in target share, third in receiving yards per game, fourth in yards per route run, 26th in first-read share, and 20th in first downs per route run. Sadly, he didn’t keep up that pace. In Weeks 6-18, despite still drawing a 23.1% target share with a 28.9% first-read share, Egbuka had only 41.1 receiving yards per game, 1.50 yards per route run, and 0.052 first downs per route run as the WR55 in fantasy points per game. If Egbuka had closed the season with the flurry of production instead of the other way around, fantasy gamers would be foaming at the mouth to draft him this season. Consider me a rabid drafter hellbent upon drafting as much Egbuka as possible this season. Entering his second season with Chris Godwin and Jalen McMillan as his primary competition for targets, Egbuka can establish himself as the team’s clear WR1 and return WR1/2 production."],
[41,66,"J. Burrow","CIN","QB",4,5,6,3,25,11.7,17.4,0.6,0,"starter",0,0,"Every year, it seems as if good health is the only thing standing in between Joe Burrow and a high-end QB1 season. The 29-year-old Burrow is unquestionably one of the best pure passers in the game, if not the best. His career completion percentage of 68.5% currently stands as the best of all time. He’s averaged 7.4 yards per pass attempt over his six NFL seasons, and he’s had at least 34 TD passes in all three seasons in which he played at least 16 games. Two seasons ago, Burrow completed 70.6% of his throws and led the NFL in completions (460), passing yardage (4,918), and TD passes (43). Burrow played only eight games in 2025, missing nine starts with a turf toe injury that required surgery. Burrow missed seven games with a wrist injury in 2023. And as a rookie in 2020, Burrow missed the last six games of the season after tearing his ACL, MCL, and PCL. The injury history is worrisome, and Burrow adds little fantasy value as a runner. But Burrow’s passing proficiency is indisputable, and he has one of the league’s best WR tandems at his disposal with Ja’Marr Chase and Tee Higgins."],
[42,28,"B. Hall","NYJ","RB",17,5,13,3,-14,4.8,10.7,-0.1,1,"committee",0,1,"Breece Hall had a tough time last year despite finishing as the RB20 in fantasy points per game. New York’s quarterback play was dreadful, and the offense overall was a mess, which led to them ranking 29th in points per game and red zone scoring opportunities per game. The good news is that despite those factors, he ran behind an offensive line that ranked seventh in adjusted yards before contact per attempt (per Fantasy Points Data). New York’s offensive line remains largely intact while adding Dylan Parham to the mix to replace the often-injured and departed Alijah Vera-Tucker, so they could easily be a top-shelf unit in 2026. The Jets also added Geno Smith, Omar Cooper Jr., and Kenyan Sadiq to the mix, which will raise the ceiling and floor of the overall offensive environment. This is all great news for a back that was also fourth in explosive run rate and tenth in missed tackle rate last year. Hall should enjoy more scoring opportunities this season and hopefully a bounce back in the receiving department while finishing with a career-low 10.9% target share last season. Hall should be considered a top-shelf RB2 with RB1 upside."],
[43,50,"D. Adams","LAR","WR",19,5,11,1,7,7.0,11.6,2.5,0,"rotational",0,0,"The early ECR is pricing Davante Adams as a mid-WR2. Last year was actually a red flag season disguised as an elite one; he posted a career-low catch rate of 53%, his YAC per reception hit a career low, and the bulk of his production was TD-dependent with 15 scores. That kind of touchdown volume is notoriously hard to replicate year over year. Even though Matthew Stafford is back under center in LA, he may not force-feed Adams in the end zone as he did in 2025 en route to an MVP award (7.7% TD rate). On top of that, Adams turns 33 and dealt with a lower-body tissue injury in 2025 that cost him time; at his age, that’s not something you just brush off. When you look at the totality: the age, the injury, the TD regression risk, the declining efficiency numbers: easy to see a player far more likely to fall off than to replicate 2025"],
[44,49,"J. Williams","DET","WR",20,5,6,4,5,7.4,9.1,0.0,0,"contested",0,1,"Jameson Williams finally delivered on his first-round pedigree in 2025, topping 1,000 receiving yards and finishing as a fantasy WR1 after a massive second-half surge. Much of that breakout coincided with Dan Campbell taking over play-calling duties and Sam LaPorta missing time, as Williams’ production dipped noticeably when the Lions tight end was active. The explosive upside remains obvious, but Williams still operated with just a 17% target share and carried one of the highest bust rates among top-20 fantasy WRs. With a new offensive coordinator and returning target competition entering 2026, Williams projects as a high-variance WR capable of week-winning performances, accompanied by super frustrating lows."],
[45,45,"T. McLaurin","WAS","WR",21,5,7,2,0,8.2,7.6,-1.5,0,"contested",0,0,"Terry McLaurin experienced a steep drop-off last year after his banner WR14 campaign in 2024. Ultimately, the Washington offense took a massive step back, and McLaurin was dealing with a quad injury for much of last season, which limited him to ten games played. In those ten games, yes, he was the WR33 in fantasy points per game, but his per-route metrics remained stellar. Among 109 qualifying receivers, McLaurin ranked 25th in target per route run rate (24%), 13th in yards per route run (2.38), fourth in first downs per route run (0.135), and 26th in route win rate (per Fantasy Points Data). With Deebo Samuel and Zach Ertz gone, only Antonio Williams and Chig Okonkwo were added to this receiving depth chart; McLaurin should return to his target hog WR2 ways in 2026. He’s a strong bounceback candidate."],
[46,36,"L. McConkey","LAC","WR",22,5,7,2,-10,6.7,7.2,-1.9,0,"rotational",0,1,"Don’t hold the OL injuries against the Chargers’ skill players. Ladd McConkey specifically. The Chargers’ WR failed to live up to his expectations from his rookie season, as Keenan Allen’s presence capped his target/production ceiling. The 33-year-old WR LED the Chargers in targets under OC Greg Roman (hyper-targeted on third downs). But with Roman replaced by Mike McDaniel, we should expect McConkey to finish closer to his rookie season, when he averaged 2.6 YPRR. McDaniel knows how to deploy his WRs to achieve peak efficiency both for real-life and fantasy purposes."],
[47,31,"T. Etienne Jr.","NO","RB",18,5,8,3,-16,7.3,12.8,2.0,1,"contingent",0,1,"Travis Etienne excelled last year as the Jags RB1 with an RB13 finish in fantasy points per game. After a down 2024 season, it was nice to see the new Saints’ lead back bounce back. He lands with New Orleans after a season where he was 11th in snap share, 13th in opportunity share, tenth in weighted opportunities, and fifth in red zone touches. Etienne soaked up 296 touches, producing 1,399 total yards. He’s set to see a similar workload in 2026 with the Saints. Etienne was disappointing on a per-touch basis, ranking 37th in explosive run rate, 31st in missed tackle rate, and 34th in yards after contact per attempt. Those metrics are worrisome, but Etienne should see enough volume that it won’t matter this season. He’s a solid RB2 that could outkick that projection if the Saints’ offense takes a leap forward and surprises this year."],
[48,58,"C. Watson","GB","WR",23,5,11,5,10,12.0,9.7,0.6,0,"contested",0,1,"Christian Watson got the bag this offseason and should be considered the clear WR1 for the Green Bay Packers. Watson deserved the pay day as a he proved that he can handle this role last year. Last season, in Weeks 8-18, he was the WR21 in fantasy points per game with an 18.2% target share, 61.1 receiving yards per game, 2.67 yards per route run, a 23.9% first-read share, and 0.122 first downs per route run (per Fantasy Points Data). His target share and first-read share should go up this season with Romeo Doubs and Dontayvion Wicks gone and Watson likely getting promoted into a full-time role. Last year, he was also held back by a 68% route share (56th out of 109 qualifying receivers). The increase in usage and playing time should make his ultra-efficiency per route even more deadly in 2026. Last year, among those 109 qualifying receivers, Watson ranked fourth in yards per route run, tenth in first downs per route run, and sixth in fantasy points per route run. Watson is a strong WR2 with upside for more in 2026."],
[49,40,"G. Wilson","NYJ","WR",24,6,13,4,-9,9.4,9.1,0.0,0,"contested",0,1,"Last year, before being lost to a knee injury (Weeks 1-6), Garrett Wilson was the WR10 in fantasy points per game. During that span, he commanded a 31.2% target share with 65.8 receiving yards per game, 1.92 yards per route run, a whopping 45.9% first-read share, and 0.087 first downs per route run (per Fantasy Points Data). With more weapons installed around him this offseason (Omar Cooper Jr. and Kenyon Sadiq), Wilson’s target share and first-read share could dip some, but he’ll still be the clear leader of the passing attack with (hopefully) improved quarterback play with Geno Smith under center. Wilson is a strong WR2 with WR1 upside if the Jets new look offense gels in 2026."],
[50,46,"J. Waddle","DEN","WR",25,6,10,2,-4,9.5,8.1,-1.0,0,"rotational",0,1,"It’s Jaylen Waddle SZN! I can’t wait to see him ball out in the Denver passing attack. Waddle should get a wonderful infusion of volume this season, moving from an offense that was 29th in neutral passing rate to one that was fourth in that metric last season. Overall, Denver was fourth in passing attempts behind only Arizona, Cincy, and Dallas last year. Waddle is a stud no matter what metric you look at. Last year, among 109 qualifying wide receivers (per Fantasy Points Data), he was 12th in target per route run rate, 12th in yards per route run, seventh in first downs per route run, 12th in separation score, and 11th in route win rate. He also bested Courtland Sutton in each of those metrics with the exception of route win rate (15.3% vs. 15.5%). Waddle is a flag plant player for me this year. You can easily draft him as a WR2 for your teams this season that has WR1 upside."],
[51,42,"L. Burden III","CHI","WR",26,6,10,3,-9,8.3,5.4,-3.7,0,"contested",0,1,"Luther Burden steps into a much larger workload in 2026. Last year (including the playoffs), Burden had only five games in which he played at least 53% of the snaps. In those games, he had a 15.5% target share and 61.2 receiving yards per game, which is concerning, but his per-route metrics were outstanding, with 2.30 yards per route run, a 23.6% first-read share, and 0.120 first downs per route run (per Fantasy Points Data). There’s a lot of projection for Burden’s 2026 season. Last year, he was stellar overall per-route with a 26% target per route run rate (11th), 2.83 yards per route run (third), 0.117 first downs per route run (12th), and 0.56 fantasy points per route run (eighth, among all wideouts with at least 200 routes). The hope and hype centered around Burden is that he can turn that small-sample hyper-efficiency into a marvelous season with a full-time workload. That could happen this year, and it sends him screaming up the weekly rankings for wide receivers, but Burden also has Rome Odunze and Colston Loveland to contend with for the top spot in the Chicago pecking order. Burden is best viewed as a WR2 with upside."],
[52,65,"J. Daniels","WAS","QB",5,6,7,2,13,13.9,16.8,-3.8,0,"starter",0,1,"After a sublime 2024 rookie season in which he threw for 3,568 yards and 25 touchdowns, ran for 891 yards and six touchdowns, and was named Offensive Rookie of the Year, Daniels played only seven games in 2025 due to elbow, knee and ankle injuries. When he was healthy, Daniels was a far less efficient passer than he had been in 2024, averaging only 6.7 yards per pass attempt and completing 60.6% of his throws in 2025 (down from 7.4 YPA and a 69.0% completion rate as a rookie). Daniels still ran aggressively, averaging 8.3 rushing attempts per game after averaging 8.7 as a rookie. But his effectiveness as a runner waned, going from 6.0 to 4.8 yards per carry. Daniels’ running ability and his potential as a passer still make him a top-five fantasy quarterback, but he’s obviously a less appealing investment than he was a year ago, and the Commanders’ lack of proven pass catchers behind WR Terry McLaurin is cause for concern."],
[53,53,"B. Irving","TB","RB",19,6,10,2,0,8.5,10.8,-0.3,0,"contingent",0,1,"Bucky Irving has dealt with a number of injuries in his short career with a foot sprain and a shoulder/ AC joint sprain last year. Rewinding to 2024, he also dealt with hip, back, toe, and hamstring issues. When he was on the field last year, he averaged 20.3 touches and 86.5 total yards as the RB17 in fantasy points per game. His efficiency suffered massively from the injuries last year after being a wonderous per-touch monster in 2024. Last year, among 49 qualifying backs, he was 43rd in explosive run rate, 35th in missed tackle rate, and 46th in yards after contact per attempt (per Fantasy Points Data). Those dips are explainable, but they are still concerning for a back that is on the smaller side and has been banged up quite often over the last two seasons. Yes, Rachaad White is gone, but Irving will still have to contend with Kenneth Gainwell and Sean Tucker this season on early downs and in the passing game. Irving could be a nice bounce-back candidate in 2026 or a massive disappointment that loses work to Gainwell and Tucker all year. I’ll buy the dip if he slips in some drafts, but I won’t go out of my way to draft him this season."],
[54,83,"T. Kraft","GB","TE",4,6,11,2,29,11.8,10.7,3.3,0,"starter",0,0,"Tucker Kraft is coming back from an ACL tear and small meniscus tear that ended his 2025 season after eight games and torpedoed what was shaping up to be a monster season. After a breakout 2024 season in which he had 50 catches for 707 yards and seven touchdowns, Kraft was off to a torrid start last year, with 32 catches for 489 yards and six touchdowns before getting hurt against the Panthers in Week 9. Kraft was TE2 in fantasy scoring behind only Trey McBride when he went down. If Kraft is fully healthy, he could produce big numbers in 2026. The Packers have parted ways with WRs Romeo Doubs and Dontayvion Wicks, and they didn’t add any notable pass catchers in the offseason. Kraft averaged an astounding 2.33 yards per route run last season. He’s a beast after the catch who’s averaged 8.8 yards after catch per reception over his three-year career. Monitor the news on Kraft’s recovery over the summer and be prepared to pounce if he comes with an injury discount in 2026 fantasy drafts."],
[55,43,"C. Skattebo","NYG","RB",20,6,8,4,-12,7.3,13.0,1.9,1,"contingent",0,0,"The human battering ram known as Cam Skattebo made waves in his rookie season before being sidelined by a horrible ankle/fibula fracture that also ruptured his deltoid ligament in Week 8 of last season. In Weeks 2-7 as the Giants’ workhorse, Skattebo averaged 19.5 touches and 96.3 total yards as the RB8 in fantasy points per game. I won’t be surprised if Skattebo’s per-touch efficiency is impacted for at least part of his 2026 season, if not the entire year, as he works his way back from last year’s injury. If he’s good to go, he should be the Giants’ leading ball carrier this season. Last season, he was stellar with his touches, ranking fourth in missed tackle rate and yards after contact per attempt, 11th in target per route run rate, eighth in yards per route run, and second in first downs per route run (per Fantasy Points Data). He’s best viewed as a volume-driven RB2, but I won’t be shocked if he’s an RB1 this season."],
[56,44,"M. Evans","SF","WR",27,6,8,2,-12,11.4,6.8,-2.3,0,"contested",0,1,"Mike Evans has a new home with the 49ers, and he looks like a wonderful value in fantasy drafts. Yes, Evans dealt with hamstring issues again last year, but that wasn’t the big limiting factor in his games played. That was related to a broken collarbone. For all of the injury talk about Evans, before the 2025 season, he had never played less than 13 games in any season, and since 2020 he had played at least 14 games in every season. Evans might be older, but he hasn’t slowed down when you look at his metrics. Last year, during his seven full games played, he had a 24.4% target share, a 30.6% first-read share, and 0.116 first downs per route run (per Fantasy Points Data). Among 109 qualifying receivers last year, those numbers would have ranked 13th-best across the board. Yes, during that sample, he had only 1.86 yards per route run and 52.6 receiving yards per game, which would have ranked 31st and 33rd among the same group of receivers, but that was more related to Baker Mayfield’s inaccuracy than Evans slowing down. In his full games played, Evans had only a 70.9% catchable target rate, which among those 109 receivers would have ranked 84th. Evans on field production didn’t match his deeper analytics and target-earning ability, as he was also second-best in separation and route win rate last season. If he can stay healthy this season, he should be one of the best values on the board for fantasy season with WR1 upside."],
[57,54,"Q. Judkins","CLE","RB",21,6,11,3,-3,6.7,10.3,-0.8,0,"committee",0,1,"Quinshon Judkins had off-the-field and contract issues last year, entering his rookie season, which caused him to miss training camp and not start the season until Week 2. Once he was on the field, he was Cleveland’s workhorse back until suffering an ankle and fibula fracture in Week 16. In Weeks 2-15, he was the RB26 in fantasy points per game (RB22 in expected fantasy points per game), averaging 18.7 touches and 72.8 total yards. I wasn’t high on Judkins as a prospect, as his per-touch efficiency in college wasn’t amazing. He didn’t debunk that trend in his rookie season, either. Among 49 qualifying backs, he ranked 40th in explosive run rate, 33rd in missed tackle rate, and 26th in yards after contact per attempt (per Fantasy Points Data). In his defense, Judkins’ offensive line didn’t do him any favors last season. Among those 49 backs, Judkins had the fifth-highest mark of yards after first contact, with 62.2% of his rushing yards coming after first contact, and he had the fourth-fewest yards before contact per attempt, with only Cam Skattebo, Ashton Jeanty, and Zach Charbonnet seeing less runway with the ball in their hands. With a rebuilt offensive line to run behind in 2026, hopefully better quarterback play in front of him (fingers crossed), and more scoring opportunities, Judkins could return RB2 production this season."],
[58,60,"R. Odunze","CHI","WR",28,6,10,3,2,11.2,8.5,-0.6,0,"rotational",0,0,"Rome Odunze’s second season was a tale of two halves, as injuries and poor catchable targets derailed what started as a breakout campaign. Before Week 9, he ranked top-10 in WR fantasy points per game while dominating high-value usage, leading the Bears in targets, red-zone looks, and air yards share. The concerns are real with Colston Loveland and Luther Burden taking larger roles in Year 2 but Chicago also lost significant WR volume and touchdown production entering 2026 with the departure of DJ Moore. Odunze remains a strong positive regression candidate tied to Caleb Williams, especially if the Bears’ passing game takes another step forward under HC Ben Johnson."],
[59,51,"D. Swift","CHI","RB",22,6,10,2,-8,5.7,12.2,1.1,1,"committee",0,1,"D’Andre Swift arguably had a career year last season for the Bears as the RB16 in fantasy points per game. He finished with 257 touches and 1,386 total yards while splitting work with Kyle Monangai. Monangai’s presence didn’t hurt Swift a ton as he was the RB20 in fantasy points per game after Monangai’s emergence in Week 9. During Weeks 10-18, Swift remained the preferred passing down back for Chicago with a 43% route share (Monangai 28.8%, per Fantasy Points Data), but he split up the red zone work with Monangai, with 18 red zone rushing attempts to Monangai’s 19. This is worrisome, but not something to freak out about in today’s NFL, where most teams are utilizing some form of committee approach. It was nice to see Swift’s efficiency numbers bounce back after a horrible 2024 season. Last year, he ranked 13th in explosive run rate, 11th in rushing success rate, and 20th in missed tackle rate. Swift should be a mid-range RB2 again this season."],
[60,71,"J. Hurts","PHI","QB",6,6,10,5,11,12.8,19.1,-1.5,0,"starter",0,1,"After averaging at least 21 fantasy points per game from his first full season as a starter in 2021 to 2024, Jalen Hurts slipped to 19.1 fantasy points per game in 2025. A decrease in rushing production was largely to blame. Hurts’ 421 rushing yards last season marked a five-year low, and his streak of four straight seasons with double-digit rushing touchdowns was snapped, as Hurts had only eight TD runs in 2025. Kevin Patullo has been ousted as the Eagles’ playcaller, replaced by first-time NFL offensive coordinator Sean Mannion. As dysfunctional as the Eagles’ passing game seemed at times last season, the change in playcallers seems like a positive for Hurts. Philadelphia’s offensive line remains one of the league’s best, and Eagles GM Howie Roseman drafted two exciting new weapons for Hurts in WR Makai Lemon and TE Eli Stowers."],
[61,52,"T. Henderson","NE","RB",23,6,11,2,-9,10.3,10.1,-1.0,1,"contingent",0,1,"TreVeyon Henderson finished his rookie season as the RB24 in fantasy points per game, but it wasn’t nearly that productive for fantasy managers when you look at the full breakdown of how it unfolded. In Weeks 10-11, Rhamondre Stevenson wasn’t active, and Henderson feasted with 60.3 combined PPR points, which accounted for 29.2% of his overall fantasy production for the season. If you take those two monster games out of the equation, Henderson would have averaged 9.8 PPR points per game, which would have made him the RB33 in fantasy points per game. Without Stevenson in the lineup in Weeks 9-11, Henderson averaged 19 touches and 110 total yards. With Stevenson active, Henderson had 11.2 touches and 57.2 total yards per game. This isn’t to shade Henderson, but I’m trying to give context to his rookie season that will be overlooked at first glance. I don’t know how Henderson overtakes Stevenson in 2026 if both of these players continue to post per-touch efficiency metrics like they did last season. Last year, Henderson was bested by Stevenson in every metric that I care about, namely explosive run rate, missed tackle rate, yards after contact per attempt, yards per route run, and pass protection stats. Among 49 qualifying backs, Henderson ranked 12th in explosive run rate, but he was also 32nd in missed tackle rate and 42nd in yards after contact per attempt (per Fantasy Points Data). Henderson could eat into Stevenson’s workload more in 2026 if he can take another step and payoff as an RB2, but he ‘s best viewed as an upside RB3."],
[62,48,"D. Montgomery","HOU","RB",24,6,8,4,-14,11.5,8.4,-2.7,1,"committee",0,1,"David Montgomery now finds himself as the Texans’ do it all workhorse for 2026. Last year, he was phased out of the Lions’ offensive plans as the season moved along, which led to his RB32 finish in fantasy points per game. In Weeks 12-18, he was the RB43 in fantasy points per game with a 32.1% snap rate, 8.2 touches per game, and only 42.8 total yards per game. Montgomery still has the juice to produce as a workhorse this season. Last season, he ranked 30th in missed tackle rate, but he was 12th in yards after contact per attempt (per Fantasy Points Data). His receiving chops are also still alive and well, as he was also 22nd in yards per route run and 12th in first downs per route run. Many will worry that Montgomery will split Houston’s backfield workload with Woody Marks this season, but I don’t see that happening. Montgomery should absorb a workload close to what Joe Mixon saw in 2024. In 2024, Mixon ranked fifth in opportunity share, 14th in snap share, and 13th in carries among running backs, finishing with 281 touches. Last season, Montgomery bested Marks in explosive run rate, missed tackle rate, rushing success rate, yards after contact per attempt, and yards per route run. Legit, every per-touch metric that I care about. Montgomery is the superior back, even at this stage of his career, and he’ll be a strong volume-driven RB2 that could flirt with RB1 production."],
[63,57,"DJ Moore","BUF","WR",29,6,7,4,-6,11.1,7.1,-2.0,0,"contested",0,1,"D.J. Moore’s stock took a tumble last year as Moore sank to WR41 in fantasy points per game. Moore has a new home for 2026 and beyond after being traded to Buffalo as Josh Allen’s new WR1. Moore had a 14.3% target share with 1.33 yards per route run, a 17.5% first-read share, and 0.063 first downs per route run (per Fantasy Points Data). None of these numbers offer hope for 2026, but don’t tune out just yet because I’m getting to the hope segment of this outlook. Buffalo hasn’t had a dependable high-end target share earning receiving option since Stefon Diggs, and Joe Brady’s previous experience with Moore has him and Buffalo believing that he can return to that form in 2026. Moore’s deeper analytics agree with Brady. Last year, among 109 qualifying receivers, Moore was 47th and 49th in separation score and route win rate. The numbers get even better when we look at Moore as a perimeter receiver, which he’ll be asked to do more than the 65% of the snaps that he played there last year. As an outside receiver last year, among the same sample of receivers, he was 36th in separation and 29th in route win rate. Moore looks like a nice bounceback candidate this season as a WR2/3 with upside for much more."],
[64,55,"B. Tuten","JAC","RB",25,6,7,4,-9,12.4,5.2,-5.9,1,"contingent",0,1,"With Travis Etienne gone, Bhayshul Tuten will compete with Chris Rodriguez to be the lead back for the Jaguars in 2026. I want to bet on Tuten this year and his talent. Last year, Tuten was unfortunately robbed of the stretch run of his rookie season as he was sidelined by a finger injury. Before the injury, he was starting to make some noise. This could be the big breakout season for Tuten, who, on a per-touch basis, flashed the immense talent that I really liked when he was in college. Last season, among 55 qualifying backs, he ranked fifth in rushing success rate, 11th in missed tackle rate, and 17th in yards after contact per attempt. Rodriguez will remain a worry for Tuten at the goal line and to his overall touch count until we see his role fleshed out this season, but if he can be the clear lead guy, he has the talent to match Etienne’s RB13 finish last year in fantasy points per game."],
[65,64,"T. Warren","IND","TE",5,6,13,3,-1,9.4,6.6,-0.8,0,"starter",0,0,"Tyler Warren’s rookie season got off to a fast start, but his production slowed down markedly late in the season, leaving us with a challenging evaluation for 2026. Over his first 10 games of 2025, Warren averaged 5.0 catches, 61.7 receiving yards and 11.1 half-point PPR fantasy points per game, with four touchdowns. Over his last seven games, Warren averaged 3.7 catches, 28.6 receiving yards and 5.6 half-point PPR fantasy points per game, with one touchdown. The net result: 76 catches for 817 yards and four touchdowns (plus one TD run) and a TE5 fantasy finish. Daniel Jones’ late-season injuries might partly account for Warren’s late-season slowdown, and Jones’ health status might still be an issue early in the 2026 season. But the Colts traded away WR Michael Pittman in the offseason and didn’t make any significant pass-catching acquisitions in free agency or the draft, bolstering Warren’s 2026 target outlook. Warren might not be one of the elite fantasy TEs in 2026, but he should still be one of the first five tight ends off the board in this year’s drafts."],
[66,62,"J. Price","SEA","RB",26,6,11,4,-4,14.1,4.7,-6.4,0,"rotational",0,1,"Jadarian Price was selected in the first round of the NFL Draft by the Seahawks to be their new Kenneth Walker (and maybe more). Walker led the backfield last year for Seattle, but they limited his usage in the red zone and in the passing game. Price remains an unknown in the passing game after only 13 targets over the last two collegiate seasons at Notre Dame, but he could easily surpass Walker’s red zone usage in 2205. It’s unknown when we’ll see Zach Charbonnet back to 100%, and outside of him, Price is competing with Emanuel Wilson and George Holani for work. Price is a wonderful rushing talent ranking 25th and fifth in yards after contact per attempt, 31st and 3rd in breakaway rate, and 15th and 39th in elusive rating over the last two seasons in college (per PFF). Price is an intriguing RB2 with a ton of upside in 2026."],
[67,70,"C. Williams","CHI","QB",7,6,10,3,3,13.9,19.0,-1.6,0,"starter",0,1,"After an uneven rookie season in which he finished QB16 in fantasy scoring, Caleb Williams took a big step forward in 2025 under new Bears head coach and playcaller Ben Johnson, finishing QB6 in fantasy scoring. Williams threw for a franchise-record 3,942 yards. He boosted his yardage per pass attempt from 6.3 as a rookie to 6.9. He bumped his TD rate from 3.6% to 4.9%, while slashing his sack rate from 10.8% to 4.1%. There’s still room for improvement. Williams completed only 58.1% of his throws last season, and he’s a notoriously slow starter who sometimes slumbers through the first half of games. But Williams is a remarkable athlete capable of extraordinary throws. He adds some fantasy value as a runner (388 rushing yards and three TD runs last year), though he prefers to use his mobility to buy additional time to throw. Williams has a bright future, and with Johnson as his mentor and a pass-catching corps that includes TE Colston Loveland and WRs Rome Odunze and Luther Burden, a high-end QB1 fantasy season is within reach."],
[68,81,"J. Herbert","LAC","QB",8,6,7,2,13,12.2,18.7,-1.9,0,"starter",0,0,"Over the first three years of his NFL career, Justin Herbert averaged 287.5 passing yards and 1.9 TD passes per game. Over the last three years, he’s averaged 233.3 passing yards and 1.5 TD passes per game. There hasn’t been a discernible difference in Herbert’s passing efficiency over those two periods. The downturn can be traced to (at various times) conservative play-calling, offensive line injuries, or a shortage of quality pass catchers. Those problems appear to have been resolved, and Herbert could have a banner season in tandem with new Chargers offensive coordinator Mike McDaniel (under whom Tua Tagovailoa led the league in passing yardage three years ago)."],
[69,79,"A. Pierce","IND","WR",30,7,13,4,10,9.4,9.1,3.5,0,"contested",0,1,"Alec Pierce cashed in after a breakout season, leading the Colts in receiving yards in each of the last two years while continuing to dominate as one of the NFL’s premier deep threats. The 26-year-old finished as the WR23 in fantasy points per game in 2025, posting 10 games with at least 65 receiving yards and clearing 1,000 yards for the first time in his career. With Michael Pittman Jr. traded away, Pierce enters 2026 as Indianapolis’ top wide receiver, although target competition from Tyler Warren and Josh Downs remains a concern. His fantasy ceiling will largely depend on the health and effectiveness of Daniel Jones, but Pierce has already shown he can produce splash weeks regardless of quarterback play."],
[70,59,"C. Tate","TEN","WR",31,7,9,3,-11,12.6,4.6,-1.0,0,"rotational",0,0,"Drafting Carnell Tate is a bet on talent and Cam Ward’s ability to take off in his second season with Brian Daboll calling plays. I want to bet on Tate as I’m in love with the talent. Tate is an amazing route runner who can separate at all three levels of the field after ranking tenth in yards per route run and fourth in receiving grade last season (per PFF). He finished college with an otherworldly 68.8% contested catch rate, and he had zero drops in his final season despite a 14.6 aDOT. Tate will have to contend with Wan’Dale Robinson and Calvin Ridley for the WR1 spot in the Tennessee offense, but he has the talent to be the clear WR1 from Week 1. It just comes down to how quickly he can hit the ground running and how many weapons can Ward support in 2026. I’ll be drafting Tate a ton."],
[71,69,"M. Harrison Jr.","ARI","WR",32,7,14,2,-2,9.9,7.2,1.6,0,"rotational",0,0,"Marvin Harrison Jr.’s second season was derailed by a brutal string of injuries, but the underlying indicators still point toward a potential Year 3 breakout. Even through the missed time, Harrison continued to command high-value usage near the end zone and showed improvement in several key efficiency metrics. From Weeks 1-13, Harrison was the WR27 in PPG. In his last five healthy games...12.8 PPG - low-end fantasy WR1 numbers. Michael Wilson’s stark on-off splits highlighted just how important MHJ remained when healthy to the Cardinals passing game. With Mike LaFleur now running the offense and a likely emphasis on moving Harrison around the formation more creatively, the former top-five pick remains a prime post-hype breakout candidate."],
[72,85,"T. Lawrence","JAC","QB",9,7,7,4,13,11.0,20.6,-0.5,0,"starter",0,1,"As the 2025 regular season reached its conclusion, Trevor Lawrence was playing the best football of his five-year NFL career under first-year Jaguars head coach Liam Coen. Over his first 10 games, Lawrence averaged 215 passing yards, 1.1 TD passes and 16.6 fantasy points per game. He averaged 6.4 yards per pass attempt over that span, and his passer rating was 79.4. Over his last seven regular-season games, Lawrence averaged 265 passing yards, 2.6 TD passes and 26.6 fantasy points per game. He averaged 8.4 yards per pass attempt over those seven games, and his passer rating was 108.6. Lawrence also had his most productive season as a runner, with 359 rushing yards and nine TD runs. With Brian Thomas Jr., Jakobi Meyers and Parker Washington (and perhaps occasional contributions from Travis Hunter), Lawrence has a good set of wide receivers. Now, we’ll see if T-Law can pick up where he left off."],
[73,75,"J. Warren","PIT","RB",27,7,9,2,2,5.0,11.1,3.4,0,"rotational",0,1,"Last season, Jaylen Warren had arguably his most productive season for fantasy purposes as the RB18 in fantasy points per game. He was his usual incredibly efficient self on a per-touch basis. In 2025, Warren ranked sixth in missed tackle rate, ninth in yards after contact per attempt, 12th in rushing success rate, third in yards per route run, and seventh in first downs per route run (per Fantasy Points Data). He set career highs in carries (211), rushing yards (958), and total touchdowns (eight). Kenneth Gainwell moved on from Pittsburgh in the offseason, but Mike McCarthy brought in his favorite son, Rico Dowdle. Warren’s role for Pittsburgh has evolved over the years from preferred passing down back to lead back, but his role could be in flux in 2026 with the arrival of a new head coach and backfield mate. Warren could still return RB2 value this season, but there’s more risk in his 2026 projection than many will be able to admit."],
[74,77,"DK Metcalf","PIT","WR",33,7,9,3,3,9.5,8.5,2.9,0,"contested",0,1,"DK Metcalf’s first season in Pittsburgh largely reinforced what fantasy managers have seen over the last several years &mdash; good, not great, fantasy consistency (WR26 overall and WR24 in PPG). The Steelers receiver once again finished outside the top tier at the position, and now faces even more target competition in a new-look offense entering 2026. His role has increasingly trended toward volatile WR3 territory rather than true fantasy alpha production. With Aaron Rodgers at quarterback and additional mouths to feed, his ceiling appears lower than his reputation might suggest."],
[75,73,"T. Pollard","TEN","RB",28,7,9,3,-2,10.0,9.0,1.3,0,"rotational",0,1,"Tony Pollard remains the clear leadback for the Titans entering the 2026 season. Last year, he ranked 15th in snap share, 17th in opportunity share, and 16th in weighted opportunities, but because of the putrid offensive situation he found himself in, he was only the RB29 in fantasy points per game. This can be traced to his five total touchdowns, which were a result of an offense that was 30th in points per game and 32nd in red zone scoring attempts per game, so it makes sense that he also ranked 49th in red zone touches. Pollard was still solid on a per-touch basis. Among 49 qualifying backs, he ranked 25th in explosive run rate and 22nd in yards after contact per attempt (per Fantasy Points Data). Brian Daboll, his new offensive coordinator, has historically ridden one running back in his offenses, and Pollard looks to be that guy this season. Pollard should find running room in 2026 with Carnell Tate and Wan’Dale Robinson added to the passing game, improved play from Cam Ward, and an offensive line that last year was quietly 13th-best in yards before contact per attempt. Pollard will be lingering in the RB3 range in plenty of drafts, but I think he returns strong RB2 value and production this season."],
[76,61,"B. Thomas Jr.","JAC","WR",34,7,7,4,-15,10.2,6.5,0.9,0,"contested",0,1,"Brian Thomas Jr.’s sophomore season was a major disappointment after the lofty expectations created by his explosive rookie campaign. Injuries constantly interrupted his momentum, while Jacksonville’s offense increasingly funneled targets toward players like Jakobi Meyers, Parker Washington, and Brenton Strange. The talent that made BTJ a breakout star still exists, but his connection with Trevor Lawrence never consistently clicked in Liam Coen’s system. Until Jacksonville proves willing to feature him more prominently again, Thomas profiles as more of a volatile upside WR3/4 than the ascending alpha many expected entering 2025."],
[77,74,"C. Hubbard","CAR","RB",29,7,5,1,-3,13.4,6.4,-1.3,0,"contingent",0,1,"Chuba Hubbard followed up his big breakout 2024 season with a stinker in 2025. Last year, Chuba Hubbard fell apart as the RB40 in fantasy points per game. Yes, he dealt with a calf injury for part of the season, but he also lost his starting job during the season to Rico Dowdle. Hubbard was arguably the most inefficient running back in the NFL last year. Among 49 qualifying backs, he ranked dead last in missed tackle rate and explosive run rate (zero explosive runs) while also sitting at 47th in yards after contact per attempt (per Fantasy Points Data). If Jonathon Brooks is fully healthy (I think he will be), he could easily be the backfield leader coming out of camp. I’ll be avoiding Hubbard in drafts this year."],
[78,87,"R. Dowdle","PIT","RB",30,7,9,2,9,10.1,10.4,2.7,0,"committee",0,1,"Rico Dowdle did it again last season. Dowdle fought to get to the top of the Carolina running back depth chart as he wrestled the starting job away from Chuba Hubbard. In Weeks 5-18, Dowdle averaged 18.6 touches and 87.7 total yards as the RB10 in fantasy points per game. Dowdle also excelled last season on the ground and in the receiving game. He ranked 23rd in explosive run rate, 17th in missed tackle rate, tenth in yards after contact per attempt, 17th in yards per route run, and 16th in first downs per route run (per Fantasy Points Data). After that strong season, Dowdle now finds himself reunited with Mike McCarthy in Pittsburgh as a backfield complement to Jaylen Warren. The division of the Steelers’ running back workload is up in the air for the 2026 season, but I won’t count against Dowdle’s ability to rise to the competition for RB1 duties. We’ll likely see a committee approach for Pittsburgh this season, but Dowdle could easily return RB2 value if not strong flex value this season."],
[79,82,"C. Sutton","DEN","WR",35,7,10,2,3,10.9,8.6,3.0,0,"rotational",0,0,"Over the last two seasons, Courtland Sutton has been the unquestioned WR1 for Bo Nix and the Denver Broncos. In those seasons, he finished as the WR18 and WR24 in fantasy points per game. The arrival of Jaylen Waddle will change that this year. Sutton still can be a highly productive player in a pass-happy offense, but he’ll take a backseat to Waddle. Last year, Denver was fourth in pass rate over expectation and passing attempts (per Fantasy Points Data). His per-route data remained solid, but it wasn’t spectacular outside of his separation score and route win rate (20th, ninth). Last year, among 109 qualifying receivers, Sutton was 35th in target per route run rate, 32nd in yards per route run, and 29th in first downs per route run. I expect the passing attack to condense around Waddle and Sutton with all of the other receiving options falling in behind them as matchup/coverage specific chess pieces. Sutton is a WR2/3 for 2026."],
[80,96,"S. LaPorta","DET","TE",6,7,6,3,16,6.8,7.4,0.1,0,"starter",0,0,"After finishing TE1 in fantasy scoring as a rookie in 2023, Sam LaPorta has been less productive the last two seasons, although he hasn’t been *that* much less productive on a per-game basis, and injuries may partly explain the dip. LaPorta played through a sprained ankle early in the 2024 season and missed one game that November with a sprained AC joint in his shoulder. In 2025, he herniated a disc in his back in Week 10 and missed Detroit’s last eight games. After scoring 10 touchdowns as a rookie, LaPorta had seven TDs in 2024 and three in 2025. But LaPorta hit career highs in catch rate (81.6%), yards per target (10.0) and yards per route run (2.00) last season, suggesting there has been no drop-off in his quality of play. But after averaging 7.1 targets per game as a rookie, LaPorta has averaged only 4.9 targets in his 27 regular-season games the last two years. Perhaps he’ll see a target uptick under new Lions offensive coordinator Drew Petzing, who was calling the plays in Arizona the last three years while Cardinals TE Trey McBride blossomed into a superstar."],
[81,76,"R. Stevenson","NE","RB",31,7,11,2,-5,7.1,10.5,2.8,0,"rotational",0,1,"Rhamondre Stevenson was the Pats’ lead back last year as the RB21 in fantasy points per game, and I don’t see that changing in 2026. Stevenson was amazing on a per-touch basis, and he bested TreVeyon Henderson in EVERY discernible metric that I care about. Last year, Stevenson was fifth in explosive run rate, missed tackle rate, and yards after contact per attempt (per Fantasy Points Data). Stevenson also surpassed Henderson in yards per route run (1.41 vs. 0.98) and pass protection. Unless Stevenson falls off in 2026, he should remain the lead back for New England after playing at least 57% of the snaps in nine of his 14 games played in 2025. Stevenson should be a nice value for fantasy managers again this season."],
[82,80,"D. Prescott","DAL","QB",10,7,14,2,-2,13.8,19.0,-2.1,0,"starter",0,0,"One of the best pure passers in the game, Dak Prescott seems primed for another big season. He has a solid offensive line in front of him and perhaps the best WR tandem in the league in CeeDee Lamb and George Pickens. If the Dallas defense is subpar again, Prescott could be thrust into a lot of shootouts in which he’s forced to match opponents score for score. Over the last three years, Prescott has averaged 263 passing yards, 1.8 TD passes and 19.1 fantasy points per game. He’s led the league in completions in two of the last three years, and he might have gone 3-for-3 had he not missed the last nine games of the season with a hamstring injury. Although he managed to finish QB5 in fantasy scoring last season, Prescott offers little value as a runner, with only seven TD runs over the last five years."],
[83,104,"H. Fannin Jr.","CLE","TE",7,7,11,3,21,11.6,7.2,-0.1,0,"starter",0,0,"A third-round pick in last year’s NFL Draft, Harold Fannin was surprisingly impactful as a rookie, racking up 72 catches for 731 yards and six touchdowns to finish TE6 in half-point PPR fantasy scoring. Perhaps we shouldn’t have been surprised by Fannin’s first-year success. He had 117 catches for 1,555 yards in his final college season at Bowling Green, leading all FBS pass catchers in both categories. The Browns have an unappealing QB situation, and the arrival of rookie WRs KC Concepcion and Denzel Boston could cut into Fannin’s target share. But the Browns’ new head coach, Todd Monken, has historically been a very TE-friendly playcaller. Fannin should be regarded as a midrange TE1 in 2026 fantasy drafts."],
[84,99,"J. Dart","NYG","QB",11,7,8,4,15,13.9,17.6,-3.5,0,"starter",0,1,"After selecting edge rusher Abdul Carter No. 3 overall in last year’s NFL Draft, the Giants traded back into the first round to grab Jaxson Dart of Ole Miss at No. 25. That move looks shrewd so far, as Dart acquitted himself extremely well in 12 starts last year despite having a skeleton crew of pass catchers following a season-ending injury to WR Malik Nabers. Dart completed 63.7% of his throws and averaged a respectable 6.7 yards per pass attempt, with 15 touchdown passes and five interceptions. Dart was dynamic as a runner, racking up 487 rushing yards and nine TD runs. But Dart was also a reckless runner at times. He took some hard hits, including one against the Bears in Week 10 that resulted in a concussion. But it’s appealing to fantasy managers that Dart is such a willing and able runner. Two reasons for concern: (1) Nabers has reportedly been slow to recover from his knee injury; and (2) new Giants offensive coordinator Matt Nagy isn’t considered one of the NFL’s top offensive designers."],
[85,92,"B. Corum","LAR","RB",32,7,11,5,7,10.6,6.7,-1.0,0,"contingent",0,1,"Blake Corum is one of the best handcuffs in fantasy. He looked back to his pre-injury form (finally) last year. After all of the injuries he sustained at Michigan, I didn’t know if we’d ever see the early collegiate version of Corum again, but he was excellent last year on a per-touch basis. After Week 1, he was a viable touchdown or bust flex as the RB46 in fantasy points per game with four top 24 finishes in weekly scoring among backs. He doesn’t offer much in the passing game with only 14 targets and 4.5 yards per reception last year, but he’s a damn good rusher on early downs. Among 49 qualifying backs, Corum ranked sixth in explosive run rate and 11th in missed tackle rate (per Fantasy Points Data). He’s a fine high-end handcuff stash or later round flier that could be an emergency flex during the season."],
[86,106,"K. Pitts Sr.","ATL","TE",8,7,11,3,20,8.9,7.2,-0.1,0,"starter",0,0,"Kyle Pitts entered the 2025 season with the reputation of being a perennial fantasy tease. The former No. 3 overall draft pick tried to rehabilitate his image with 88 catches for 928 yards and five touchdowns last year, good for a TE2 finish in half-point PPR fantasy scoring. Pitts scored three of his five touchdowns and had his only 100-yard game of the season in Week 15, when he erupted for 11 catches, 166 yards and three scores vs. the Buccaneers. It was Pitts’ best season since his 1,026-yard rookie campaign in 2021. The Falcons don’t have a lot of firepower at wide receiver beyond Drake London, so Pitts could very well be Atlanta’s No. 2 target earner this season. And while the QB duo of Michael Penix and Tua Tagovailoa doesn’t seem very appealing, it’s worth remembering that Mike Gesicki and Jonnu Smith had the best fantasy seasons of their careers with Tua as their primary QB."],
[87,93,"K. Monangai","CHI","RB",33,7,10,2,6,11.9,7.6,-0.1,0,"contingent",0,1,"Kyle Monangai is a solid RB3/flex option with high-end handcuff appeal for 2026. Last year, in Weeks 10-18, Monangai led D’Andre Swift with 19 red zone rushing attempts compared to Swift’s 18 while producing as the RB33 in fantasy points per game. During the same span, Monangai averaged 12.2 touches and 55.8 total yards while having a 28.8% route share (per Fantasy Points Data). Monangai is a serviceable early down hammer for Chicago, ranking 24th in explosive run rate, 21st in rushing success rate, and 20th in yards after contact per attempt. If Swift misses any time, Monangai would be Chicago’s lead back and an RB1/2."],
[88,63,"J. Tyson","NO","WR",36,7,8,3,-25,17.0,3.8,-1.8,0,"rotational",0,1,"Jordyn Tyson lands with the New Orleans Saints and should be the immediate second target in an ascending passing game led by Tyler Shough. Over the last two collegiate seasons, Tyson has ranked 60th and 11th in yards per route run and 12th and 15th in receiving grade (per PFF). Hopefully, Tyson has kicked the injury bug that plagued him in college. If so, he could take off in his rookie season for a team that could easily be pass-happy. Last year, in Weeks 12-18, New Orleans was fifth in neutral passing rate and 11th in pass rate over expectation. Tyson’s ceiling and floor this season are attached to his ability to stay healthy and the intriguing arm of Shough."],
[89,98,"J.K. Dobbins","DEN","RB",34,7,10,2,9,13.4,10.5,2.8,0,"contingent",0,1,"J.K. Dobbins returns to Denver this season as their early down hammer. It’s tough to count on him for a full season at this point, but while he’s out there, he should be a nice RB2/flex play this season. Last year, Dobbins did see his season cut short with a foot injury. In Weeks 1-10, he was the RB24 in fantasy points per game, averaging 16.4 touches and 80.6 total yards. The bulk of that work was in the rushing department as he averaged only 1.4 targets and 3.7 receiving yards per game. He had only four games in which he saw more than one target, and he never saw more than two targets in any game. Dobbins was on pace for 260 carries and 1,313 rushing yards before his injury, so his value on early downs is quite nice. Among 49 qualifying backs, he ranked third in explosive run rate and eighth in missed tackle rate (per Fantasy Points Data). Dobbins should return RB2/touchdown-dependent flex value this season."],
[90,72,"M. Lemon","PHI","WR",37,7,10,4,-18,16.8,3.6,-2.0,0,"contested",0,1,"Makai Lemon enters the NFL with elite collegiate production and first-round draft capital after the Eagles aggressively traded up to secure the former USC standout. Lemon offers inside-outside versatility and was one of the most efficient perimeter receivers in college football despite being viewed by some as slot-only. The biggest obstacle to immediate fantasy relevance is target competition in Philadelphia, where DeVonta Smith and Dallas Goedert already command significant volume. Still, Lemon’s talent and long-term upside make him an intriguing bench stash and rookie breakout candidate if the Eagles improve their passing attack under new OC Sean Mannion (McVay/Shanahan-type offense)."],
[91,68,"P. Washington","JAC","WR",38,7,7,4,-23,13.5,7.9,2.3,0,"contested",0,1,"Parker Washington finished last season with a flurry of insane production; if he picks up right where he left off, he’ll be one of the best picks in fantasy football this season. Last year, in Weeks 16-19, Washington asserted himself as the Jags’ clear WR1. During that stretch, he averaged 22.3 PPR points per game while soaking up six red zone targets and 13 deep targets (per Fantasy Points Data). In those four games, he had a 28.9% target share, 113.5 receiving yards per game, 3.78 yards per route run, and a 33.3% first-read share. Those are all absolutely elite metrics no matter how you slice it. There’s some uncertainty about how the Jags target hierarchy sifts out this season with Brian Thomas Jr. and Travis Hunter healthy. Each player could effectively put a dent in Washington, putting up monster numbers in 2026, but that risk is baked into Washington’s price in drafts. He’s a wonderful upside swing in the later rounds."],
[92,95,"B. Purdy","SF","QB",12,7,8,1,3,12.8,20.8,-0.3,0,"starter",0,0,"Brock Purdy’s pass-catching corps will look a lot different in 2026. Free-agent addition Mike Evans is expected to be Purdy’s new No. 1 receiver, and the 49ers added WR Christian Kirk in free agency as well. Ricky Pearsall is still around, but Jauan Jennings and Kendrick Bourne are gone. TE George Kittle is recovering from a torn Achilles and might not be ready for the start of the season. A nagging turf toe injury limited Purdy to nine starts in 2025. He threw 20 TD passes despite missing all that time, but he also threw 10 interceptions. Purdy has ranked inside QB1 range in fantasy points per game in each of his three full seasons as a starter. Consider him a low-end QB1 in 2026 fantasy drafts."],
[93,86,"RJ Harvey","DEN","RB",35,7,10,2,-7,16.7,9.4,1.7,0,"rotational",0,1,"R.J. Harvey’s rookie season was a tale of two seasons centered around J.K. Dobbins being in the lineup and out of it. In Weeks 1-10, Harvey was the RB29 in fantasy points per game, averaging 29.1% of the snaps played with 7.5 touches and 38.9 total yards per game. In Weeks 11-18, with Dobbins out, he was the RB13 in fantasy points per game with 16.8 touches and 72.5 total yards per game while averaging 60.7% of the snaps played. With Dobbins back and Denver drafting Jonah Coleman, Harvey’s role is up in the air. He could easily fall back into last year’s early-season role as passing down partner with Dobbins, or this backfield could get messy with all three backs playing and the production getting divided up. Harvey was awesome overall last season as a receiving option, but he struggled on early downs. As a pass catcher, he ranked sixth in target per route run rate and first downs per route run and tenth in yards per route run (per Fantasy Points Data). As a rusher, among 49 qualifying backs, he was 21st in missed tackle rate but 42nd in explosive run rate and 44th in yards after contact per attempt. Harvey is a decent selection in fantasy drafts this season, but in 2026, I won’t go out of my way to get him on all my teams like last year."],
[94,89,"C. Godwin Jr.","TB","WR",39,8,10,4,-5,14.1,5.6,0.4,0,"contested",0,1,"Chris Godwin’s last two seasons have been derailed by injuries, and 2025 raised additional concerns about potential age-related decline entering his age-30 campaign. Even when healthy, Godwin struggled to command high-end volume or efficiency in Tampa Bay’s crowded receiving corps. Still, the veteran remains an important part of the Buccaneers offense and flashed signs of life late in the year with a strong Week 17 performance. If fully healthy entering 2026, Godwin could rebound into fantasy relevance, although his ceiling appears much lower than it was during his prime seasons."],
[95,97,"M. Wilson","ARI","WR",40,8,14,2,2,11.9,8.4,3.2,0,"rotational",0,0,"Michael Wilson’s 2025 breakout came with massive context attached, as nearly all of his fantasy production occurred when Marvin Harrison Jr. was sidelined. Wilson averaged elite WR1 numbers without MHJ in the lineup, but his role and target rate cratered whenever Arizona’s No. 1 receiver was active. The Cardinals are also expected to lean more balanced offensively after investing heavily in the run game during the 2026 NFL Draft with the selection of Jeremiyah Love. Wilson can still provide spike weeks, but expecting last season’s counting stats to repeat in a healthier Arizona offense feels overly optimistic."],
[96,88,"J. Addison","MIN","WR",41,8,6,5,-8,9.5,6.6,1.4,0,"contested",0,1,"Jordan Addison’s 2025 fall-off was heavily tied to poor quarterback play and an early-season suspension, leading to the least productive fantasy season of his young career. Still, the former first-round pick flashed upside whenever the Vikings received competent QB play, averaging 77 receiving yards per game with Carson Wentz under center. Addison’s downfield role continues to create splash-play potential, but it also makes him more volatile week-to-week. With Kyler Murray now in Minnesota, Addison profiles as a strong bounce-back candidate, although added target competition in the red zone could cap his touchdown upside."],
[97,127,"D. Kincaid","BUF","TE",9,8,7,3,30,12.0,7.3,1.1,0,"starter",0,0,"Dalton Kincaid was wildly efficient in 2025, averaging 14.6 yards per catch, 11.7 yards per target, and 2.70 yards per route run. The problem was that he played only 12 games and 302 snaps. Kincaid had 39 catches for 571 yards and five touchdowns. He was third in TE snaps on his own team last season behind Dawson Knox and rookie Jackson Hawes. The 26-year-old Kincaid lost games to hamstring and abdominal injuries last year. He’s also been dealing with a partially torn PCL in his left knee since late 2024. The injury won’t require surgery, but Bills GM Brandon Beane has said that Kincaid’s 2026 workload might have to be managed. It would be hard for Kincaid to improve upon his efficiency numbers, so he would probably need bigger snap counts to have a more impactful fantasy season in 2026. The outlook for that is murky, and if he plays limited snaps again this season and his efficiency numbers regress to career norms, Kincaid could disappoint. It’s best to regard him as a high-end TE2 for fantasy drafts."],
[98,78,"Q. Johnston","LAC","WR",42,8,7,2,-20,14.3,8.6,3.4,0,"rotational",0,1,"Quentin Johnston showed more signs of progress in 2025, posting career-best fantasy production (WR25 PPG) while maintaining his role as a downfield and red-zone weapon in the Chargers’ offense. The season was still wildly inconsistent, as Johnston’s early breakout faded once Oronde Gadsden became more involved in the passing game. Even so, Johnston remains attached to an ascending offense with Justin Herbert and should maintain a full-time role entering 2026. The upside remains enticing, but after three seasons without a true top-30 finish, fantasy managers should still expect volatility from the former first-round pick."],
[99,90,"P. Mahomes II","KC","QB",13,8,5,2,-9,8.4,21.1,6.2,0,"starter",0,1,"Patrick Mahomes’ fantasy appeal has diminished in recent years, and now the nine-year veteran is trying to recover from a major knee injury. Mahomes tore the ACL and LCL in his left knee late in the Chiefs’ Week 15 loss to the Chargers in mid-December. Reports say he has been rehabbing aggressively in hopes of starting the Chiefs’ Monday-night season opener against the Broncos on Sept. 14, which comes three days before his 31st birthday. Even if Mahomes is able to return for Week 1, his mobility could be compromised. Mahomes’ rushing production helped him get off to a fast fantasy start in 2025. Through eight weeks, he was QB1 in fantasy scoring at 25 points per game, fueled in part by 280 rushing yards and four TD runs. Mahomes finished the year tied for QB2 in fantasy points per game behind Josh Allen, after finishing QB11 in FPPG (six games minimum) in both 2023 and 2024. Kansas City didn’t make any significant additions to Mahomes’ pass-catching arsenal in the offseason, but the Chiefs added RB Kenneth Walker III, who could make Mahomes’ life easier by providing the Chiefs with a credible running threat."],
[100,107,"Bo Nix","DEN","QB",14,8,10,3,7,7.8,18.6,3.7,0,"starter",0,1,"Bo Nix is something of a fantasy football Rorschach test. The good: Nix has finished QB7 in fantasy scoring in each of his first two NFL seasons; he provides value as a runner, with 786 rushing yards and nine TD runs in 34 regular-season starts; Broncos head coach Sean Payton is regarded as one of the NFL’s better playcallers; and an offseason trade for Jaylen Waddle gives Nix a very good group of pass catchers. The bad: Nix hasn’t fared quite as well in fantasy points per game, ranking QB9 in 2024 and QB11 in 2025; he led the league in pass attempts last season yet still fell short of 4,000 passing yards; and he averaged an unimpressive 6.4 yards per pass attempt last season. Nix offers a relatively safe floor but might have a limited ceiling. Consider him a low-end QB1 or high-end QB2."],
[101,105,"M. Stafford","LAR","QB",15,8,11,3,4,12.3,21.1,6.2,0,"starter",0,1,"Matthew Stafford is coming off an MVP season in which he led the league in passing yards (4,707) and TD passes (46) while throwing only eight interceptions and taking just 23 sacks. He finished QB3 in fantasy scoring despite rushing for one yard all season and zero touchdowns. Stafford dealt with back issues last summer but played all 17 regular-season games plus three playoff games. The 38-year-old Stafford was feeling good enough to sign a contract extension that should keep him around for at least two more seasons. With offensive wizard Sean McVay as his head coach and the dynamic duo of Puka Nacua and Davante Adams at wide receiver, Stafford seems well positioned for another big season."],
[102,114,"G. Kittle","SF","TE",10,8,8,3,12,24.2,9.5,3.3,0,"starter",1,0,"George Kittle tore his right Achilles in the 49ers’ Wild Card win over the Eagles on Jan. 11. Kittle says his goal is to play in the 49ers’ 2026 season opener against the Rams in Australia, defying the typical recovery timeline for an Achilles tear. It’s possible the 32-year-old Kittle misses time early in the season, and it’s possible he won’t offer the usual Kittle-level production upon his return. But there will be an injury discount on Kittle in 2026 fantasy drafts, and the possibility that he’s back to peak form in time for the fantasy playoffs is appealing. Over the last four seasons, Kittle has averaged 4.6 catches, 63.4 yards and 0.5 touchdowns per game. Kittle has been remarkably efficient over his career, averaging 10.0 yards per catch and 2.27 yards per target - better career numbers than superstar WR Ja’Marr Chase in both categories."],
[103,103,"J. Meyers","JAC","WR",43,8,7,4,0,10.5,6.3,1.1,0,"contested",0,0,"Jakobi Meyers continues to be one of fantasy football’s most underrated receivers, quickly becoming Trevor Lawrence’s trusted target after arriving in Jacksonville midseason. Meyers immediately stepped into a major role in Liam Coen’s offense and maintained steady production even after Brian Thomas Jr. returned to the lineup. His reliability, route-running, and ability to command targets have quietly made him one of the league’s more productive possession receivers over the last several seasons. With a full offseason to build chemistry in Jacksonville, Meyers profiles as a strong value WR3 with a safer weekly floor than most players in his draft range."],
[104,100,"R. Pearsall","SF","WR",44,8,8,2,-4,20.8,5.3,0.1,0,"contested",1,0,"Ricky Pearsall is reaching make-or-break territory. Last year was another injury-marred campaign, as he was limited to nine games played with a PCL sprain that plagued him all year, essentially. Pearsall still flashed when he was on the field, with four top-24 weekly finishes in those nine games (WR20, WR11, WR21, WR22). Last year, Pearsall only drew a 17.4% target share, but he averaged 58.7 receiving yards with 2.02 yards per route run and 0.103 first downs per route run (per Fantasy Points Data). Last year, among 109 qualifying receivers, Pearsall ranked 23rd in yards per route run and 22nd in first downs per route run. On a per-route basis, Pearsall was excellent. Yes, Mike Evans was added to this offense along with Christian Kirk and De’Zhaun Stribling. I don’t see Kirk or Stribling impacting Pearsall’s role and volume in this offense if he can stay healthy. If Pearsall can finally put together a full, healthy 17-game season, this could be his breakout year. I’ll take that shot late in drafts all the time."],
[105,121,"J. Croskey-Merritt","WAS","RB",36,8,7,4,16,13.4,7.7,0.9,0,"rotational",0,1,"Last year, Jacory Croskey-Merritt had an up-and-down season as the RB41 in fantasy points per game. Washington didn’t trust him as a passing game option, and he was in and out of the starting lineup as the team also leaned on other backs like Chris Rodriguez. In 2025, Croskey-Merritt had four top 24 finishes in weekly scoring while also popping in rushing efficiency metrics. Among 49 qualifying backs, he ranked 26th in explosive run rate, 19th in yards after contact per attempt, seventh in yards per carry on zone runs, and ninth in one rushing success rate (per Fantasy Points Data). Croskey-Merritt is only a dice roll this season as he’ll be competing with Rachaad White, Kaytron Allen, and Jerome Ford for the starting job and work in 2026."],
[106,116,"A. Jones Sr.","MIN","RB",37,8,6,4,10,13.7,7.6,0.8,0,"committee",0,1,"Aaron Jones returns to Minnesota this season, another year older and with more injuries and missed games on his resume. Last year, he missed five games while dealing with hamstring, shoulder, and hip injuries. When he was active, he averaged 13.3 touches and 62.3 total yards as the RB31 in fantasy points per game. Entering his age-32 season, I don’t think Jones can be expected to play a full 17 games as a workhorse back. He will likely split work with Jordan Mason this season, picking up most of the passing game usage. On early downs, his best days are behind him, as he was 32nd in explosive run rate, 43rd in missed tackle rate, and 49th in yards after contact per attempt (per Fantasy Points Data). In the receiving game, he is still above average, ranking 26th in yards per route run and 24th in first downs per route run. Jones should be considered an RB3/PPR flex play for 2026."],
[107,109,"J. Goff","DET","QB",16,8,6,5,2,11.1,17.9,3.0,0,"starter",0,1,"Jared Goff has become a paragon of consistency. He’s strung together four consecutive 4,000-yard seasons, averaging 4,551 passing yards and 32.5 TD passes per season over that span. Goff hasn’t missed a game since 2021. But Goff has finished outside the top 12 in fantasy points per game (five starts minimum) in three of the last four years. He’s a fine passer but offers next to nothing as a runner, with 195 rushing yards and two TD runs over the last four years. Goff’s high-floor, low-ceiling profile makes him an unsexy target in fantasy drafts, but his high-floor makes him an ideal backup in 1QB leagues or QB2 in superflex leagues."],
[108,120,"T. Kelce","KC","TE",11,8,5,4,12,13.8,6.9,0.7,0,"starter",0,0,"Travis Kelce will turn 37 in October, but he’s committed to playing at least one more season for the Chiefs. Kelce finished TE3 in fantasy scoring last season, catching 76 passes for 851 yards and five touchdowns. But the longtime fantasy star’s efficiency has been plummeting. Kelce has averaged 8.6 yards per target for his career, but he’s averaged just 6.9 YPT over the last two seasons. Kelce has averaged 2.05 yards per route run for his career, but he’s been just under 1.50 YPRR each of the last two seasons. The Chiefs didn’t add any significant pass catchers in the offseason, so Kelce still figures to be a prominent target earner in Andy Reid’s offense. It’s just a matter of how much he can do with those targets. The good news is that Kelce has become a budget option at the position and will probably be available in the middle rounds of fantasy drafts."],
[109,108,"K. Gainwell","TB","RB",38,8,10,2,-1,11.3,8.7,1.9,0,"contingent",0,1,"Kenneth Gainwell was an integral part of the Pittsburgh backfield last year for the entire season, but he really hit his stride in Weeks 11-18 as the RB7 in fantasy points per game with 13.3 touches and 85 total yards per game. His passing game was robust during this stretch as he was third in target share (17.5%), second in receiving yards per game (45.4), fourth in yards per route run (2.10), and first in first downs per route run (0.116, per Fantasy Points Data). That also isn’t to say that he wasn’t also fantastic on early downs, ranking 14th in explosive run rate and missed tackle rate overall for the season among backs. Gainwell will play a prominent role for his new team (Tampa Bay) this season as a complement to Bucky Irving. Irving has had a substantial list of injuries that he has dealt with during his short career, so I wouldn’t be surprised if Gainwell is leading the backfield some weeks in 2026 with a solid standalone role when Irving is active. Gainwell could easily return RB2 value in 2026 if everything falls in his favor. He definitely carries more fantasy appeal in PPR formats, though."],
[110,110,"R. White","WAS","RB",39,8,7,4,0,15.6,6.1,-0.7,0,"contingent",0,1,"Over the last two seasons, with Bucky Irving in town, Rachaad White was a more effective per-touch player, but with Irving out of the lineup last year, he proved again that he can carry the mail (although while being horribly inefficient). Last season, in Weeks 5-12, White averaged 14.6 touches and 60 total yards while seeing 71% of the snaps. During that span, White was the RB23 in fantasy points per game with a 1.2% explosive run rate, a 14% missed tackle rate, and only 1.52 yards after contact per attempt (per Fantasy Points Data). White has moved on to Washington for the 2026 season, and he could easily be their starting running back this season if he can secure the job coming out of camp. He is a decent dice roll for fantasy football for 2026, who could stack up enough volume to pay off for fantasy gamers."],
[111,112,"K. Murray","MIN","QB",17,8,6,5,1,13.6,16.2,1.3,0,"starter",0,1,"After seven topsy-turvy seasons with the Cardinals, Kyler Murray will make a fresh start with the Vikings in 2026. Murray may or may not be in a quarterback competition with JJ McCarthy for Minnesota’s starting job, but it’s widely expected that Murray will be taking the snaps when the Vikings face the Packers in Week 1. Murray played only five games last season before sustaining a foot sprain that eventually landed him on injured reserve. Murray’s yearly finishes in fantasy points per game among quarterbacks with at least five starts: QB11, QB4, QB4, QB7, QB9, QB12, QB20. Murray steps into a good situation with Kevin O’Connell as his playcaller, and he’ll have Justin Jefferson, Jordan Addison and Jauan Jennings as his wide receivers. Murray has always added rushing value, having averaged at least 30 rushing per game in all seven of his NFL seasons. The perception might be that Murray is damaged goods, but he could be one of the better QB values in 2026 fantasy drafts."],
[112,101,"M. Pittman Jr.","PIT","WR",45,8,9,3,-11,12.5,7.2,2.0,0,"contested",0,1,"Michael Pittman Jr. quietly remained productive in 2025 despite losing ground to Alec Pierce in the Colts offense and dealing with declining efficiency. Now in Pittsburgh, Pittman projects as a reliable possession receiver who could quickly become Aaron Rodgers’ preferred underneath target. His fantasy ceiling may be limited compared to DK Metcalf’s splash-play upside, but Pittman’s volume and red-zone involvement should keep him firmly in the WR3 mix in a pass-happier offense led by HC MIke McCarthy. If the Steelers lean heavily on quick-game concepts, Pittman could easily lead the team in receptions/targets."],
[113,124,"J. Mason","MIN","RB",40,8,6,4,11,11.6,7.2,0.4,0,"contingent",0,1,"Jordan Mason is a one-trick pony, but that one trick is quite good. He’s a strong early down option for NFL offenses and should continue to serve in the role this season for Minnesota. Last year, he was the RB42 in fantasy points per game while soaking up 158 rushing attempts and producing 758 rushing yards and six total touchdowns. Among 49 qualifying backs, he ranked tenth in explosive run rate, seventh in rushing success rate, ninth in missed tackle rate, and 15th in yards after contact per attempt (per Fantasy Points Data). Aaron Jones will continue to be the passing-down partner for Mason for Minny in 2026. If (or when) Jones misses time, Mason could be a plug-and-play RB2, but he’s best viewed as a high-end handcuff/touchdown-dependent flex."],
[114,84,"J. Reed","GB","WR",46,8,11,5,-30,25.8,4.2,-1.0,0,"rotational",1,1,"Jayden Reed’s 2025 season was largely lost to injuries, but Green Bay’s offseason actions suggest the Packers still believe in his long-term upside. The explosive slot receiver received a lucrative extension while the team moved on from other veteran wideouts, potentially opening the door for a more stable every-down role. Reed’s route participation and deployment remain the key questions for fantasy purposes, though his efficiency and playmaking ability have never been in doubt. in the games where Reed played at least 38% of the snaps, he had no fewer than three receptions in any contest during the regular season (8.8 PPG). At his current draft cost, Reed profiles as an appealing post-hype sleeper with room for a major rebound."],
[115,136,"D. Goedert","PHI","TE",12,8,10,4,21,13.4,8.3,2.1,0,"starter",0,0,"Dallas Goedert not only scored a career-high 11 touchdowns in 2025, but he more than doubled his previous single-season high. Goedert had never scored more than five touchdowns in any of his seven previous NFL seasons. Six of Goedert’s TDs last year came on variations of shovel passes from the 5-yard line or closer, as the shovel pass to Goedert became a short-range alternative to the Eagles’ “tush push” QB sneaks. Goedert also hit a career high with 60 receptions last season, although he averaged a career-low 9.9 yards per catch. The 31-year-old Goedert clearly has gas left in the tank. The question is whether the Eagles’ new offensive coordinator, Sean Mannion, will feature Goedert near the goal line as much as departed Eagles OC Kevin Patullo did."],
[116,131,"I. Likely","NYG","TE",13,8,8,3,15,27.0,2.5,-3.7,0,"starter",1,0,"After spending the first four seasons of his NFL career with the Ravens, Isaiah Likely signed a three-year, $40 million contract with the Giants. Likely shared targets with Mark Andrews for four years and could see increased usage with his new team. The Giants are thin at wide receiver behind young star Malik Nabers, and Nabers has been slow to recover from an ACL tear sustained last September, leaving his early-season status in question. Likely’s best season with the Ravens was in 2024, when he had 42 catches for 477 yards and six TDs. He never saw more than 60 targets in any of his four seasons in Baltimore. The world saw Likely’s potential when he had nine catches for 111 yards and a touchdown in the Ravens’ nationally televised season opener against the Chiefs in 2024. With an expected target increase in 2026, Likely has a chance to be a top-10 fantasy tight end."],
[117,94,"X. Worthy","KC","WR",47,8,5,2,-23,13.4,4.9,-0.3,0,"rotational",0,1,"Xavier Worthy’s sophomore season never gained traction, as injuries, inconsistent quarterback availability, and the return of established weapons kept him from carving out a meaningful fantasy role. The speedster still flashed explosive upside and posted stronger numbers when paired with Patrick Mahomes, but Kansas City’s offense clearly revolved around Rashee Rice whenever he was available. Worthy’s usage suggests better days could be ahead, especially after dramatically underperforming expectations compared to Year 1. If Rice misses time again or the Chiefs’ offense rebounds, Worthy remains an intriguing post-hype breakout candidate entering his age-23 season."],
[118,125,"M. Andrews","BAL","TE",14,8,13,4,7,20.8,4.9,-1.3,0,"starter",1,0,"Is Mark Andrews poised for a bump in productivity now that TE Isaiah Likely has left the Ravens for the Giants, leaving Andrews as the only established pass-catching tight end on the Baltimore roster? Or is Andrews, who turns 31 on Sept. 6, simply out of gas? Andrews’ production cratered last season. He had career lows in yards per game (24.8), yards per catch (8.8) and yards per target (6.0). Some of Andrews’ problems were undoubtedly related to Lamar Jackson’s 2025 health issues. The Ravens’ starting QB missed four regular-season games and didn’t appear to be fully healthy in others. If Jackson returns to form and Andrews sees a target increase in the absence of Likely, Andrews could offer midrange TE1 numbers at a low-end TE1/high-end TE2 price. Andrews has drawn 69 and 70 targets the last two seasons despite playing 17 regular-season games both years. He drew 153 targets in 2021 and 113 targets in 15 games in 2022."],
[119,113,"J. Love","GB","QB",18,8,11,4,-6,8.2,16.1,1.2,0,"starter",0,1,"It’s possible Jordan Love is simply a better real-life fantasy quarterback than fantasy quarterback. In 2025, Love ranked second among all quarterbacks in expected points added per dropback, third in defense-adjusted value over average, third in QBR and sixth in passer rating. And yet Love averaged only 16.1 fantasy points per game, which ranked QB19 among quarterbacks who made at least eight starts. Love finished QB5 in 2023, his first full season as an NFL starter, and hasn’t finished in QB1 range since. It’s partly because the Packers have been so run-heavy the last two seasons, finishing 31st in pass rate over expected in 2024, 22nd in 2025. Love hasn’t offered much rushing production either, with 282 rushing yards and one TD run over the last two seasons. Love might be a top-10 quarterback in reality, but it’s best to regard him as a high-end to midrange QB2 in 2026 fantasy drafts."],
[120,115,"W. Robinson","TEN","WR",48,8,9,3,-5,13.1,7.9,2.7,0,"contested",0,1,"Last year, Wan’Dale Robinson had his best season to date, easily, with a true breakout campaign as the WR14 in fantasy points per game. Among 109 qualifying receivers, he ranked 11th in target share (26.8%), 15th in receiving yards per game (63.4), 28th in yards per route run (1.94), and 11th in first-read share (32.9%, per Fantasy Points Data). A huge change for Robinson was that he wasn’t just a checkdown or underneath option anymore, as his aDOT rose to 8.7 and he was 21st among that sample of receivers in deep targets. This season, Robinson will have more target competition alongside Carnell Tate and Calvin Ridley, but I expect him to be the clear WR2 in the offense. It’s wonderful that he stays tied to Brian Daboll in Tennessee, who oversaw his breakout and usage last year, which gives me hope for his 2026 outlook. His floor and ceiling this season will be tied to Cam Ward taking a big step with this new coaching staff. If that happens, Robinson could be a weekly WR2/3 this season."],
[121,118,"B. Mayfield","TB","QB",19,8,10,2,-3,10.0,16.6,1.7,0,"starter",0,0,"This is a crossroads year for Baker Mayfield, who went from QB3 in fantasy points per game in 2024 to QB19 last season. Mayfield’s completion percentage fell from 71.4% in 2024 to 63.2% in 2025. He went from 7.9 yards per pass attempt in 2024 to 6.8 yards per attempt in 2025. Injuries may have been at least partly to blame. WRs Mike Evans and Chris Godwin each missed about half the season. WR Emeka Egbuka started fast, then hurt his hamstring and fell off dramatically. The Buccaneers’ offensive line was banged up early in the season. Mayfield himself dealt with a shoulder injury. Mayfield had a good season with Dave Canales as his playcaller in 2023 and an even better season with Liam Coen as his playcaller in 2024. Mayfield had a disappointing 2025 season in tandem with Buccaneers offensive coordinator Josh Grizzard. Now he gets his fourth playcaller in as many seasons, new Buccaneers offensive coordinator Zac Robinson. A bounce-back season for the 31-year-old Mayfield is entirely possible, but we probably shouldn’t assume he’ll return to his 2023-2024 form."],
