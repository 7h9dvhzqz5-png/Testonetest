<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B162A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Room">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B162A'/%3E%3Cg transform='translate(50 50) scale(.76) translate(-50 -50)'%3E%3Cpath d='M82.2%2023%20A42%2042%200%201%200%2082.2%2077%20L63.8%2069.7%20A24%2024%200%201%201%2063.8%2030.3%20Z' fill='none' stroke='%23fff' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M82.2%2023%20A42%2042%200%201%200%2082.2%2077%20L63.8%2069.7%20A24%2024%200%201%201%2063.8%2030.3%20Z' fill='%23C83803'/%3E%3C/g%3E%3C/svg%3E">
<title>Papal Draft Room '26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#081120;--bg2:#0B162A;--card:#122036;--card2:#16263f;--raise:#1d3050;
 --edge:rgba(255,255,255,.055);--line:rgba(139,160,190,.12);--line2:rgba(139,160,190,.07);
 --ink:#f2f5fa;--txt:#dbe3ee;--txt2:#a3b1c6;--mut:#75859d;--faint:#465469;
 --orange:#C83803;--opress:#e5470f;--odim:rgba(200,56,3,.13);--oline:rgba(200,56,3,.5);
 --green:#30c97e;--gdim:rgba(48,201,126,.14);--gold:#e0ac35;--red:#f5564a;--rdim:rgba(245,86,74,.13);
 --qb:#f59a32;--rb:#34b87c;--wr:#5b93ec;--te:#a878e8;--k:#8a99ad;--dst:#c9a04a;
 --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
 --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
 --shc:0 1px 0 var(--edge) inset,0 10px 30px rgba(0,0,0,.35);
 --shp:0 1px 0 var(--edge) inset,0 18px 48px rgba(0,0,0,.5);
 --sho:0 8px 24px rgba(200,56,3,.35);
 --press:cubic-bezier(.32,.72,0,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;max-width:600px;margin:0 auto;
 padding-bottom:88px;position:relative;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;
 background-image:linear-gradient(180deg,var(--bg2),var(--bg) 340px);overflow-x:hidden}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96);opacity:0}60%{transform:scale(1.01)}100%{transform:scale(1);opacity:1}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flash{0%{background:var(--gdim)}100%{background:transparent}}
.hide{display:none!important}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

/* MASTHEAD */
header{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 20px 0;
 background:rgba(11,22,42,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
 border-bottom:.5px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between}
.org{display:inline-flex;align-items:center;gap:8px}
.orgname{font-size:11px;font-weight:800;letter-spacing:.09em;color:#9fb0c4;text-transform:uppercase}
.orgname em{font-style:normal;color:var(--orange)}
.hbtns{display:flex;gap:7px}
.ibtn{background:var(--card);border:none;color:#cdd8e5;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
 cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;font-size:15px;transition:transform .18s var(--press),color .15s}
.ibtn:active{transform:scale(.88);color:var(--orange)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0 10px}
.title{font-size:30px;font-weight:800;letter-spacing:-.022em;color:var(--ink);line-height:1}
.title .yr{color:var(--orange)}
.tagline{font-size:10px;font-weight:700;letter-spacing:.07em;color:#b78563;text-transform:uppercase;white-space:nowrap}
/* command rail */
.rail{display:flex;margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none;border-top:.5px solid var(--line2)}
.rail::-webkit-scrollbar{display:none}
.stat{display:flex;flex-direction:column;gap:5px;white-space:nowrap;padding:11px 16px 13px 0;margin-right:16px;border-right:.5px solid var(--line2)}
.stat:last-child{border-right:none}
.stat b{font-family:var(--mono);font-size:22px;color:var(--ink);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b.on{color:var(--orange)}

/* LIVE BAR */
.startbar{width:calc(100% - 40px);margin:15px 20px 0;padding:16px;border:none;border-radius:14px;cursor:pointer;
 background:var(--orange);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;
 box-shadow:var(--sho);transition:transform .18s var(--press),background .15s}
.startbar:active{transform:scale(.975);background:var(--opress)}
.startbar.ghost{background:var(--card);color:var(--txt);box-shadow:var(--shc);margin-top:9px;font-weight:700}
.startbar.ghost:active{background:var(--raise)}
.ckpr{font-style:normal;background:rgba(168,120,232,.25);color:#d9c6f5;font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.06em;vertical-align:middle}
.clockbar{margin:15px 20px 0;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shc);
 display:flex;align-items:center;justify-content:space-between;gap:12px;animation:rise .3s var(--press)}
.clockbar.you{background:var(--orange);box-shadow:var(--sho)}
.clockbar.done{background:var(--card);box-shadow:var(--shc),0 0 0 1.5px var(--green) inset}
.ckl{display:flex;flex-direction:column;gap:4px}
.ckk{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:7px;text-transform:uppercase}
.ckk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);animation:dot 1.4s ease infinite}
.clockbar.you .ckk{color:rgba(255,255,255,.85)}.clockbar.you .ckk::before{background:#fff}
.clockbar.done .ckk::before{background:var(--green);animation:none}
.ckt{font-size:17px;font-weight:800;letter-spacing:-.015em;color:#fff;line-height:1}
.clockbar.done .ckt{color:var(--ink)}
.ckbtn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .16s var(--press)}
.clockbar:not(.you) .ckbtn{background:var(--card2);color:var(--txt2)}
.ckbtn:active{transform:scale(.92)}
.ckbtns{display:flex;gap:7px;flex-shrink:0}

/* NAV */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;z-index:40;display:flex;gap:2px;
 padding:7px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(11,22,42,.92);
 backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--mut);padding:8px 3px 6px;font-size:10px;font-weight:700;
 display:inline-flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:color .18s,transform .16s var(--press)}
.tabs button:active{transform:scale(.92)}
.tabs button.on{color:var(--orange)}
.tabs .ico{font-size:18px;line-height:1}
.badge{background:var(--orange);color:#fff;border-radius:20px;padding:0 5px;font-size:9.5px;font-family:var(--mono);font-weight:700;min-width:15px;height:14px;display:inline-grid;place-items:center}
.tabs button:not(.on) .badge{background:var(--faint)}

main{padding:14px 20px 20px;animation:rise .28s var(--press)}
.pg{display:none}.pg.on{display:block}

/* SCARCITY */
.scar{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:13px;box-shadow:var(--shc)}
.sm-wrap{background:var(--card);border-radius:12px;margin-bottom:12px;box-shadow:var(--shc),0 0 0 1px var(--oline) inset;overflow:hidden}
.sm-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;user-select:none}
.sm-title{font-size:12px;font-weight:800;letter-spacing:-.01em;color:var(--txt)}
.sm-sub{font-weight:500;color:var(--mut);font-size:10px}
.sm-mine{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px}
.sm-g{font-family:var(--mono);font-weight:800;font-size:14px}
.sm-rk{font-family:var(--mono);font-size:11px;color:var(--mut)}
.sm-caret{color:var(--mut);font-size:11px;margin-left:2px}
.sm-rows{padding:0 6px 6px}
.sm-colh{display:flex;align-items:center;padding:4px 8px 6px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;border-bottom:.5px solid var(--line2)}
.sm-row{display:flex;align-items:center;padding:7px 8px;border-radius:8px;font-size:12.5px}
.sm-row.me{background:linear-gradient(90deg,rgba(200,56,3,.12),rgba(200,56,3,.03));box-shadow:0 0 0 1px rgba(200,56,3,.25) inset}
.sm-rank{width:22px;font-family:var(--mono);font-size:12px;color:var(--mut);font-weight:700;flex-shrink:0}
.sm-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sm-row.me .sm-name{color:var(--orange);font-weight:800}
.sm-you{font-size:9px;background:var(--orange);color:#fff;padding:1px 4px;border-radius:4px;font-weight:800;letter-spacing:.03em;vertical-align:middle}
.sm-colh .sm-pts,.sm-colh .sm-grade,.sm-colh .sm-rank,.sm-colh .sm-name{font-size:9px}
.sm-pts{width:52px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--txt2);flex-shrink:0}
.sm-grade{width:38px;text-align:right;font-family:var(--mono);font-weight:800;font-size:13px;flex-shrink:0}
.gA{color:#4caf6a}.gB{color:#6cb2e0}.gC{color:#e0a860}.gD{color:#e08a5a}.gF{color:#e05a5a}
.scar-t{margin-bottom:10px;display:flex;align-items:center;gap:7px}
.scar-t::before{content:"";width:3px;height:10px;background:var(--orange);border-radius:1px}
.scar-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card2);border-radius:11px;padding:10px 2px 9px;box-shadow:0 1px 0 var(--edge) inset}
.sc.urgent{background:var(--odim)}.sc.gone{opacity:.35}
.sc .p{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.03em}
.sc .n{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.sc.urgent .n{color:var(--orange)}
.sc .l{font-size:8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.02em}

/* THE PICK */
.pick{background:var(--card);border-radius:18px;box-shadow:var(--shp);overflow:hidden;margin-bottom:15px;animation:pop .35s var(--press)}
.pick-eb{display:flex;align-items:center;gap:7px;color:var(--orange);padding:14px 16px 0;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pick-eb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.pick-hero{display:flex;align-items:flex-start;gap:12px;padding:11px 16px 0;cursor:pointer}
.pchip{color:#fff;font-weight:800;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:6px 8px;border-radius:7px;margin-top:4px}
.pick-body{flex:1;min-width:0;padding-bottom:14px;display:flex;flex-direction:column}
.pick-name{font-size:25px;font-weight:800;letter-spacing:-.022em;display:flex;align-items:center;gap:8px;color:var(--ink);line-height:1.02;flex-wrap:wrap}
.pick-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.pick-meta .r{color:var(--ink);font-weight:700}.pick-meta .d{color:var(--faint)}
.vbadge{font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.vbadge.steal{background:var(--green);color:#04160d}.vbadge.value{background:var(--gdim);color:var(--green)}
.vbadge.dead{background:var(--rdim);color:var(--red)}
.pick-reason{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.pick-reason .rhead{font-size:13.5px;color:var(--ink);font-weight:650;line-height:1.4;letter-spacing:-.01em}
.pick-reason .rbits{font-size:11.5px;color:var(--txt2);font-weight:450;line-height:1.5}
.pulse{margin:0 16px 10px;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:600;line-height:1.4}
.pulse.reach{background:var(--gdim);color:var(--green)}
.pick.myturn{box-shadow:var(--shp),0 0 0 2px var(--orange)}
.moreb{display:block;width:calc(100% - 32px);margin:0 16px 13px;background:var(--card2);border:none;color:var(--txt2);border-radius:9px;padding:9px;font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .15s var(--press)}
.moreb:active{transform:scale(.98)}
.setup{background:var(--card);border-radius:14px;padding:14px;margin-bottom:13px;box-shadow:var(--shc),0 0 0 1px var(--oline) inset}
.brief{background:linear-gradient(165deg,rgba(200,56,3,.06),var(--card))}
.brief-picks{font-family:var(--mono);font-size:13px;color:var(--txt);margin:2px 0 9px;letter-spacing:.02em}
.brief-body{font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:8px}
.brief-foot{font-size:10.5px;color:var(--mut);font-style:italic;line-height:1.5}
.su-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.su-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--line2)}
.su-row:first-of-type{border-top:none}
.su-tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--card2);color:var(--mut);box-shadow:0 1px 0 var(--edge) inset;flex-shrink:0}
.su-tick.on{background:var(--gdim);color:var(--green)}
.su-l{flex:1;font-size:13px;font-weight:600;color:var(--txt);letter-spacing:-.01em}
.su-go{background:var(--card2);border:none;color:var(--orange);border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset}
.su-hint{font-size:11px;color:var(--mut);line-height:1.5;padding-top:10px;border-top:.5px solid var(--line2);margin-top:2px}
.su-hint b{color:var(--txt)}
.pulse.fall{background:var(--gdim);color:var(--green)}
.pick-stack{margin:0 16px 12px;background:rgba(168,120,232,.12);border-radius:9px;padding:9px 11px;font-size:11px;color:#cbb3f0;line-height:1.45;cursor:pointer;transition:transform .15s var(--press)}
.pick-stack:active{transform:scale(.98)}
.pick-stack b{color:#d9c6f5;font-weight:700}.pick-stack .sname{color:#fff;font-weight:700}
.pick-plan{margin:0 16px 13px;background:linear-gradient(160deg,rgba(48,201,126,.09),var(--card2));border-radius:12px;padding:12px 13px;box-shadow:0 1px 0 var(--edge) inset}
.plan-h{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:9px}
.plan-step{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:.5px solid var(--line2)}
.plan-step:first-of-type{border-top:none}
.plan-step.now .plan-nm{color:var(--ink);font-weight:800}
.plan-pk{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--mut);min-width:34px}
.plan-step.now .plan-pk{color:var(--green)}
.plan-pos{color:#fff;font-family:var(--mono);font-size:9px;font-weight:800;padding:3px 6px;border-radius:5px;letter-spacing:.02em}
.plan-nm{font-size:13px;font-weight:600;color:var(--txt);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-note{font-size:10px;color:var(--mut);line-height:1.4;margin-top:8px;padding-top:8px;border-top:.5px solid var(--line2)}
.pick-bears{margin:0 16px 12px;background:linear-gradient(135deg,var(--odim),rgba(200,56,3,.04));border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 0 0 1px var(--oline) inset;cursor:pointer;transition:transform .15s var(--press)}
.pick-bears:active{transform:scale(.985)}
.pb-badge{background:var(--orange);color:#fff;font-family:var(--mono);font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;letter-spacing:.03em;flex-shrink:0}
.pb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pb-k{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.pb-txt{font-size:11.5px;color:var(--txt);line-height:1.4}.pb-txt b{color:var(--ink);font-weight:700}
.pb-take{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;box-shadow:var(--sho);transition:transform .15s var(--press)}
.pb-take:active{transform:scale(.92)}
.pick-wait{margin:0 16px 12px;background:var(--card2);border-radius:9px;padding:9px 11px;box-shadow:0 1px 0 var(--edge) inset}
.wa-k{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:7px}
.wa-row{display:flex;gap:7px;flex-wrap:wrap}
.wa-cell{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:600;color:var(--txt)}
.wa-pos{font-family:var(--mono);font-size:9.5px;font-weight:800}
.pick-cta{align-self:flex-start;margin-top:12px;display:inline-flex;align-items:center;gap:3px;background:var(--orange);color:#fff;
 font-weight:800;font-size:13.5px;padding:11px 17px;border-radius:10px;box-shadow:var(--sho);cursor:pointer;transition:transform .16s var(--press),background .15s;border:none}
.pick-cta:active{transform:scale(.96);background:var(--opress)}
.pick-warn{margin:0 16px 12px;background:var(--rdim);border-radius:9px;padding:8px 11px;font-size:11px;color:#f2a196;line-height:1.4;font-weight:500}
.pick-gone{margin:0 16px 12px;background:var(--card2);border-radius:9px;padding:8px 11px;font-size:11px;color:var(--txt2);line-height:1.45;box-shadow:0 1px 0 var(--edge) inset}
.pick-gone b{color:var(--ink);font-weight:700}
.alts{display:flex;gap:6px;padding:12px 16px 14px;flex-wrap:wrap;border-top:.5px solid var(--line2)}
.alt{display:inline-flex;align-items:center;gap:7px;background:var(--card2);border:none;border-radius:9px;padding:8px 12px;color:var(--txt);
 font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .15s var(--press),background .15s}
.alt:active{transform:scale(.94);background:var(--raise)}
.pdot{width:7px;height:7px;border-radius:50%}
.alt .an{font-weight:700;color:var(--ink)}.alt .ap{font-family:var(--mono);font-size:9.5px;color:var(--mut)}

/* QUICK LOG */
.qlog{background:var(--card);border-radius:14px;box-shadow:var(--shc);padding:13px 14px 12px;margin-bottom:13px;display:flex;flex-direction:column;gap:9px}
.qlog-h{color:var(--orange);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.qlog-in{background:var(--card2);border:none;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;font-weight:500;box-shadow:0 1px 0 var(--edge) inset}
.qlog-in:focus{outline:none;box-shadow:0 0 0 2px var(--oline)}
.qchip{display:flex;align-items:center;gap:8px;background:var(--card2);border:none;border-radius:9px;padding:9px 11px;color:var(--txt);
 font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;text-align:left;width:100%;transition:transform .14s var(--press),background .14s}
.qchip:active{transform:scale(.98);background:var(--raise)}

/* SEARCH + VIEW TOGGLE */

.wl-tier{font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;background:rgba(90,160,255,.14);color:#5aa0ff;margin-left:4px}

.copyrow{margin:0 0 10px}
.copybtn{width:100%;background:var(--card2);border:none;color:var(--txt2);border-radius:10px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .12s var(--press)}

.bear{height:36px;width:auto;display:inline-block;vertical-align:middle;margin:1px 9px 1px 0}

/* one alert line; detail one tap away */

/* logging: the chips are the entire job */

.fxrow{display:flex;align-items:center;gap:12px;margin-top:8px;padding:11px 12px;background:var(--card2);border-radius:10px;box-shadow:0 1px 0 var(--edge) inset}

.scorecard{margin-top:8px;padding:11px 12px;background:var(--card2);border-radius:10px;box-shadow:0 1px 0 var(--edge) inset}

.sc-n{margin-top:8px;padding-top:8px;border-top:1px solid var(--edge);font-size:10.5px;color:var(--mut);line-height:1.55}

.qtm{margin-left:5px;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--mut);letter-spacing:.03em}
.rpwrap{margin-top:7px;background:var(--card);border-radius:12px;padding:8px 9px;box-shadow:var(--shc)}
.rp-h{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:5px}

.rp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px}

.rp-n{font-family:var(--mono);font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0}
.rp-t{color:var(--acc);font-weight:800;flex-shrink:0;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-c{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:800;flex-shrink:0}
.rp-u{background:var(--card2);border:none;border-radius:9px;color:var(--mut);font-size:13px;padding:7px 10px;cursor:pointer;flex-shrink:0}
.rp-fix{flex-basis:100%;padding:6px 2px 3px}
.rp-lbl{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:5px}
.rp-ms{display:flex;flex-wrap:wrap;gap:4px}
.rp-m{background:var(--raise);border:none;border-radius:8px;color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;padding:7px 9px;cursor:pointer}

*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,.b,.chip,.qchip,.alt,.qitem,.tab,.wv-toggle,.copybtn,.pick-cta,.starb,.moreb,.pb-take,.mgsel,.rp-b,.rp-u,.rp-m{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.b:active,.qchip:active,.alt:active,.qitem:active,.wv-toggle:active,.pick-cta:active,.starb:active,.moreb:active,.pb-take:active,.tab:active,.rp-b:active,.rp-u:active,.rp-m:active{transform:scale(.97)}
.pr-ovr,.pr-adp,.pr-bye,.ap,.sm-pts,.hero-sv,.ap-sv,.q-sv{font-variant-numeric:tabular-nums}
.viewseg button{border:none;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:7px 15px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;color:var(--mut);box-shadow:var(--shc);margin-bottom:10px}

.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}

.chip:active{transform:scale(.93)}.chip.on{background:var(--ink);color:#0c1220}
.queue{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:11px;box-shadow:var(--shc)}

.qitem{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:none;border-radius:8px;padding:6px 9px;color:var(--ink);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .14s var(--press)}
.qitem:active{transform:scale(.93)}.qitem .qx{color:var(--mut);margin-left:1px}

/* BOARD TABLE */
.list{list-style:none;background:var(--card);border-radius:18px;box-shadow:var(--shc);overflow:hidden}

.prow{padding:11px 13px;border-bottom:.5px solid var(--line2);position:relative;transition:background .12s}
.prow:last-child{border-bottom:none}.prow:active{background:rgba(255,255,255,.02)}

.pr-ovr{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pchip.sm{font-size:9px;min-width:0;text-align:center;padding:5px 4px;border-radius:6px;margin-top:0;letter-spacing:.02em}
.pr-txt{min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.pr-nm{font-size:15.5px;font-weight:700;letter-spacing:-.016em;display:flex;align-items:center;gap:6px;color:var(--ink);flex-wrap:wrap;line-height:1.05}
.chi{background:var(--orange);color:#fff;font-size:8px;font-weight:800;padding:2px 4px;border-radius:4px;letter-spacing:.04em;font-family:var(--mono)}
.pr-sub{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.pr-tm{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:600}
.pr-tier{font-family:var(--mono);font-size:9.5px;color:var(--txt2);font-weight:700}
.tag{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.04em}
.tag.dz{background:var(--rdim);color:var(--red)}
.tag.rook{background:rgba(90,160,255,.16);color:#5aa0ff}
.tag.slee{background:rgba(120,200,120,.16);color:#6cc46c}
.wl-wrap{padding:4px 2px 20px}

.wl-intro{font-size:12px;color:var(--txt2);line-height:1.6;padding:0 4px 14px}
.wl-sec{margin-bottom:18px}
.wl-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;padding:9px 12px;border-radius:10px 10px 0 0;color:#fff}
.wl-h.rook{background:linear-gradient(90deg,#3a6ea5,#4d84c4)}
.wl-h.slee{background:linear-gradient(90deg,#3f8a3f,#54a054)}
.wl-count{font-family:var(--mono);font-size:11px;font-weight:700;opacity:.92}
.wl-sub{font-size:11px;color:var(--mut);line-height:1.5;padding:8px 12px 4px;background:var(--card);border-left:1px solid var(--edge);border-right:1px solid var(--edge)}
.wl-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card);border-top:.5px solid var(--line2);border-left:1px solid var(--edge);border-right:1px solid var(--edge)}
.wl-row:last-of-type{border-bottom:1px solid var(--edge);border-radius:0 0 10px 10px}
.wl-row.gone{opacity:.4}
.wl-main{display:flex;align-items:center;gap:8px;min-width:0}
.wl-pos{font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--card2);color:var(--txt2)}
.wl-pos.RB{color:#6cc46c}.wl-pos.WR{color:#5aa0ff}.wl-pos.TE{color:#e0a860}.wl-pos.QB{color:#c88fe0}
.wl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wl-meta{flex-shrink:0;text-align:right}
.wl-adp{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.wl-taken{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:700}
.wl-empty{padding:14px 12px;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--edge);border-radius:0 0 10px 10px;font-style:italic}
.wl-foot{font-size:10px;color:var(--mut);line-height:1.5;padding:6px 4px;font-style:italic}.tag.val{background:var(--gdim);color:var(--green)}
.tag.uns{background:rgba(91,147,236,.16);color:var(--wr)}.tag.spk{background:rgba(168,120,232,.16);color:var(--te)}
.pr-adp{font-family:var(--mono);font-size:12.5px;color:var(--txt);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pr-bye{font-family:var(--mono);font-size:10.5px;color:var(--mut);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pr-bye.warn{color:var(--orange);font-weight:800}
.pr-btns{display:flex;gap:6px;align-items:center}
.b{border:none;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .15s var(--press),filter .12s;letter-spacing:-.01em}

.b-mine{background:var(--green);color:#04160d}.b-taken{background:var(--card2);color:var(--txt2);box-shadow:0 1px 0 var(--edge) inset}

/* TIER WALL */

/* PAPAL / ROSTER */
.strength{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:13px;box-shadow:var(--shp)}
.strength .k{color:var(--orange);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.coach{background:linear-gradient(160deg,rgba(200,56,3,.08),var(--card2));border-radius:12px;padding:12px 13px;margin-bottom:14px;box-shadow:0 1px 0 var(--edge) inset}
.coach-h{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.coach-i{font-size:12px;color:var(--txt);line-height:1.55;padding:5px 0;border-top:.5px solid var(--line2)}

.marginline{font-size:11.5px;color:var(--txt2);line-height:1.5;margin:-4px 0 14px;padding:10px 12px;background:var(--card2);border-radius:10px;box-shadow:0 1px 0 var(--edge) inset}
.needrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.need{background:var(--odim);color:var(--orange);font-size:12px;font-weight:700;padding:8px 13px;border-radius:9px;letter-spacing:-.01em}

.roster{list-style:none;background:var(--card);border-radius:18px;box-shadow:var(--shc);overflow:hidden;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:.5px solid var(--line2)}
.slot:last-child{border-bottom:none}.slot.filled{background:rgba(255,255,255,.014)}
.slot-l{font-family:var(--mono);font-size:10px;font-weight:700;min-width:42px;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}

.slot-nm{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:-.015em;display:flex;align-items:center;gap:7px}

.rel{margin-left:auto;background:var(--card2);border:none;color:var(--mut);width:28px;height:28px;border-radius:8px;font-size:14px;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .15s var(--press),color .15s}

/* BYE / FIXTURES */

.byec .wk{font-family:var(--mono);font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase}
.byec .n{font-family:var(--mono);font-size:21px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.byec.bad .n{color:var(--orange)}
.byec .nm{font-size:9px;color:var(--txt2);line-height:1.35;font-weight:500}
.fxrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:.5px solid var(--line2);flex-wrap:wrap}
.fxrow:first-of-type{border-top:none}
.fx-wk{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);min-width:30px}
.fx-opp{font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fxhead{font-size:12.5px;color:var(--txt2);margin-bottom:8px}.fxhead b{color:var(--ink);font-variant-numeric:tabular-nums}

/* LEAGUE */
.tcard2{background:var(--card);border-radius:14px;padding:14px;margin-bottom:9px;box-shadow:var(--shc);position:relative;animation:rise .25s var(--press)}

.trank{font-family:var(--mono);font-weight:800;font-size:12px;color:var(--ink);background:var(--card2);min-width:27px;height:27px;border-radius:8px;display:grid;place-items:center;box-shadow:0 1px 0 var(--edge) inset;font-variant-numeric:tabular-nums}

.tname{font-weight:800;font-size:15px;letter-spacing:-.015em;color:var(--ink);flex:1}
.tpts{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tplayers{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.tp{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--txt);box-shadow:0 1px 0 var(--edge) inset}
.tneed{margin-top:10px;font-size:11px;color:var(--orange);font-weight:700}
.tblank{margin-top:8px;font-size:12.5px;color:var(--mut);font-style:italic}

/* SETTINGS */
.settings{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shc)}
.sub{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px;display:flex;align-items:center;gap:7px}
.sub:first-child{margin-top:0}
.setrow{display:flex;gap:11px;flex-wrap:wrap}
.setf{display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.05em;text-transform:uppercase;flex:1;min-width:90px}
.setf input,.setf select{background:var(--card2);border:none;color:var(--ink);border-radius:10px;padding:11px;font-size:14px;font-family:var(--mono);font-weight:600;box-shadow:0 1px 0 var(--edge) inset}

.lock{background:var(--card2);color:var(--ink);border-radius:10px;padding:11px;font-size:14px;font-family:var(--mono);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 0 0 1px var(--oline) inset}
.lock em{font-style:normal;color:var(--orange);font-size:8px;letter-spacing:.09em;font-weight:800}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.namegrid input{background:var(--card2);border:none;color:var(--ink);border-radius:9px;padding:10px 11px;font-size:13.5px;font-family:inherit;font-weight:600;box-shadow:0 1px 0 var(--edge) inset}
.namegrid input:disabled{color:var(--orange);font-weight:800;opacity:1}
.namegrid input:focus{outline:none;box-shadow:0 0 0 2px var(--oline)}
.ncell{display:flex;flex-direction:column;gap:4px}
.mgsel{background:var(--card2);border:none;color:var(--txt2);border-radius:8px;padding:7px 8px;font-size:11px;font-family:var(--mono);font-weight:700;box-shadow:0 1px 0 var(--edge) inset}
.mgsel.me{color:var(--orange);text-align:center}
.diffrow{display:flex;gap:7px;margin-bottom:7px}
.diffbtn{flex:1;background:var(--card2);border:none;color:var(--txt2);border-radius:9px;padding:10px 6px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--edge) inset;transition:transform .12s var(--press)}
.diffbtn:active{transform:scale(.97)}
.diffbtn.on{background:var(--orange);color:#fff;box-shadow:none}
.diffhint{font-size:11px;color:var(--mut);line-height:1.5;margin-bottom:14px}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fixc{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:700}
.fixc select{flex:1;min-width:0;background:var(--card2);border:none;color:var(--ink);border-radius:8px;padding:8px;font-size:12px;font-family:inherit;font-weight:600;box-shadow:0 1px 0 var(--edge) inset}
.btn-full{width:100%;background:var(--odim);border:none;color:var(--orange);padding:11px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:6px;transition:transform .16s var(--press)}
.btn-full:active{transform:scale(.98)}
.reset{margin-top:12px;background:var(--rdim);border:none;color:var(--red);padding:11px 15px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;width:100%}

/* DOC */
.doc h2{font-size:22px;font-weight:800;margin:2px 0 12px;color:var(--ink);letter-spacing:-.02em}
.doc h3{font-size:10.5px;font-weight:700;color:var(--orange);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.doc h3::before{content:"";width:3px;height:11px;background:var(--orange);border-radius:1px}
.doc p{font-size:13.5px;line-height:1.7;color:var(--txt2);margin-bottom:11px}.doc b{color:var(--ink);font-weight:700}
.doc ul{margin:0 0 11px 18px}.doc li{font-size:13.5px;line-height:1.6;color:var(--txt2);margin-bottom:7px}.doc li b{color:var(--ink)}
.fine{font-size:11px;color:var(--mut);border-top:.5px solid var(--line);padding-top:12px;margin-top:18px;line-height:1.6}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:11px 18px;border-radius:12px;box-shadow:var(--shp);font-size:13px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.confirm-overlay{position:fixed;inset:0;z-index:80;background:rgba(6,9,15,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:28px;opacity:0;transition:opacity .2s}
.confirm-overlay.show{display:flex;opacity:1;animation:rise .2s var(--press)}
.cf-box{background:var(--card);border-radius:18px;padding:22px 20px 18px;max-width:340px;width:100%;box-shadow:var(--shp)}
.cf-msg{font-size:14.5px;line-height:1.5;color:var(--ink);font-weight:500;margin-bottom:18px}
.cf-btns{display:flex;gap:9px}
.cf-btns button{flex:1;border:none;border-radius:11px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s var(--press)}
.cf-btns button:active{transform:scale(.96)}
.cf-no{background:var(--card2);color:var(--txt2);box-shadow:0 1px 0 var(--edge) inset}
.cf-yes{background:var(--orange);color:#fff;box-shadow:var(--sho)}
.saved{position:fixed;top:calc(6px + env(safe-area-inset-top));right:14px;font-size:9px;color:var(--faint);font-family:var(--mono);z-index:50;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
</style>
</head>

<script>
/*═══════════════ DATA (injected) ═══════════════*/
// FantasyPros 2026 merged board — 478 players
const COLS=["ovr", "adp", "name", "team", "pos", "posRank", "tier", "bye", "sos", "ecr", "std", "proj", "cliff", "deadzone", "role", "unsettled", "spike", "note"];
// Full-PPR replacement levels (Start 3): standard baseline lifted by +0.5×receptions at the replacement tier.
// Reception-driven positions rise at the floor; value model below also uplifts pass-catcher projections.
// Replacement level = the best player still available once every team has filled that slot, in
// an 8-team league with 1QB/2RB/2WR/1TE and a W-R flex. RECOMPUTED from the true league-scoring
// projections — the old values were calibrated to the July half-PPR scale, which left almost
// every QB with negative value once the real numbers landed.
const REPL={"QB": 15.8, "RB": 9.7, "WR": 11.7, "TE": 9.5, "K": 9.6, "DST": 2.2};
// TWELVE-TEAM replacement levels. Recomputed for this league: with 12 teams the replacement
// player at every position is materially worse, which lifts everyone's value against it. The
// biggest shift is RUNNING BACK - replacement falls from 11.8 to 9.7 because 31 backs start
// league-wide instead of 21, so elite backs are far scarcer here than in the 8-team league.   // matched to the July projection scale in use
const SCORING="Full PPR";
const RAWP=[
[1,1,"J. Gibbs","DET","RB",1,1,6,5,0,1.7,17.1,-1.5,0,"alpha",0,1,"Last year, Jahmyr Gibbs finished as the RB3 in fantasy points per game. After Week 10, his usage got a massive bump as he didn’t play less than 68% of the snaps in any game for the rest of the season while averaging 20 touches and 114.9 total yards pre game. This stretch of games from Weeks 11-18 also coincided with Sam LaPorta’s absence, which increased Gibbs’ passing game usage. In Weeks 1-10, Gibbs had a 12.7% target share, 25.2 receiving yards per game, and an 11.1% first-read share (per Fantasy Points Data). In Weeks 11-18, Gibbs saw a huge increase in work through the air without LaPorta, with a 19% target share, 48.6 receiving yards per game, and a 19.6% first-read share. Gibbs led all running backs in those statistical categories in the final eight games of the season. Gibbs is in the running for RB1 overall for 2026, but if the rest of the weapons for Detroit remain healthy all season, it could be tough for him to do so. I still expect him to be a top-three back this season who is insanely efficient with his passing game and early down work. Last year, he ranked ninth in explosive run rate and third in missed tackles forced per attempt. Gibbs will and should be a top 3-5 pick in every fantasy draft this year."],
[2,2,"B. Robinson","ATL","RB",2,1,11,2,0,1.0,17.2,-1.4,0,"alpha",0,1,"Last year, Bijan Robinson was the RB2 in fantasy points per game. For most of the season, he was pacing towards a 1,000-yard season for rushing and receiving before tailing off at the end of the season (820 receiving yards). Robinson was also crushed by the heavy usage of Tyler Allgeier near the goalline. Allgeier finished with eight rushing touchdowns, while Robinson had only 11 total touchdowns. Robinson had a pitiful 49.3% red zone rushing share (per Fantasy Points Data). With Allgeier and the previous coaching staff gone, Robinson should enjoy more usage near paydirt in 2026. Robinson was incredibly efficient with his workload last season, which is a reflection of his insane talent. He finished top-three among running backs (minimum 100 carries, 20 targets) in receiving yards per game, target share, yards per route run, first downs per route run, missed tackles forced per attempt, and yards after contact per attempt. Robinson is my favorite bet to be the RB1 overall in 2026."],
[3,3,"J. Chase","CIN","WR",1,1,6,4,0,1.3,11.8,-0.4,0,"alpha",0,1,"Ja’Marr Chase had another stellar season last year. He was the WR3 in fantasy points per game while finishing sixth in red zone targets and 18th in deep targets (tied). Again this season, Chase will lead an offense that will live and die by their passing game. Last year, Cincy was third in neutral passing rate and fifth in red zone passing rate. I don’t see either of those numbers changing much in 2026 with Joe Burrow back under center. Last year, Chase remained a volume and efficiency monster, ranking third in target share (30.2%) and receiving yards per game (88.3), 18th in yards per route run (2.30), 14th in first downs per route run (0.119), and third in first-read share (40.3%, per Fantasy Points Data). Among 109 qualifying receivers, he was ninth in separation score and 23rd in route win rate. Chase has WR1 overall upside again this season."],
[4,4,"P. Nacua","LAR","WR",2,1,11,1,0,1.5,15.4,3.2,0,"alpha",0,1,"Last year, Puka Nacua took Ja’Marr Chase’s throne as the WR1 in fantasy points per game, and he could repeat as the top dog this year among wide receivers. Last year, Nacua was third in raw target volume, first in receptions, second in receiving yards, 23rd in deep targets, and 12th in red zone targets (tied). Nacua was fourth in target share (28.8%), first in receiving yards per game (107.2), first in yards per route run (3.85), and fourth in first-read share (37.5%, per Fantasy Points Data). If all of that wasn’t enough, he was also sixth-best in separation and route win rate. Nacua is a volume-gobbling stud who could easily repeat as the WR1 overall if Matthew Stafford keeps dealing at an MVP (or near) level in 2026."],
[5,5,"J. Smith-Njigba","SEA","WR",3,1,11,3,0,1.5,14.2,2.0,0,"alpha",0,1,"Last year, Jaxon Smith-Njigba stepped up and put up what might be a career-best season for him when it’s all said and done. I’m not saying that he will definitively fall off, but replicating his 2025 season will be tough no matter how you slice it. Last year, he posted the seventh-most receiving yards ever in a single season (1,793) and 119 receptions as the WR2 in fantasy points per game. He had 44.1% of Seattle’s receiving yards, which was easily the highest mark in the NFL among receivers by a staggering 6.2%. The next closest was Puka Nacua with 37.9%. Smith-Njigba didn’t have any new faces added to this Seattle passing attack in the offseason to threaten his usage at all, and he still has Sam Darnold under center, but we’ll have to see how much losing Klint Kubiak impacts this offense. That loss won’t tank his season, but it’s a concern that has to be brought up. Last year, Smith-Njigba ranked first in target share (32.6%), second in receiving yards per game (105.5), second in yards per route run (3.74), and first in first-read share (44.6%, per Fantasy Points Data). Smith-Njigba is a top 3-5 fantasy receiver with an extremely high ceiling and elite floor."],
[6,6,"J. Taylor","IND","RB",3,2,13,4,0,3.3,18.6,3.0,0,"alpha",0,1,"Jonathan Taylor was the RB4 in fantasy points per game last year, but his season was a tale of two halves. With Daniel Jones (Weeks 1-13), he was the RB2 in fantasy points per game, averaging 21.7 touches and 132.1 total yards. After Jones was out of the lineup (Achilles), Taylor was the RB22 in fantasy points per game with 21.6 touches and 75.4 total yards per game. Last year, among 49 qualifying backs, Taylor was 17th in explosive run rate, 28th in missed tackle rate, and 13th in yards after contact per attempt. Jones is set to return this season, but the big question for Taylor and the Indy offense is how effective he’ll be in 2026 coming off the Achilles injury. Taylor should see plenty of volume this season to return top 15-20 production in fantasy, but if you’re drafting him with an RB1 price tag, it’s fair to wonder if he can be a top three back this season, with his quarterback’s play in question. Last year, Taylor was first in snap share, second in opportunity share, fourth in weighted opportunity, and second in red zone touches. I have more questions about his 2026 outlook than most, but he’s still a solid pick in 2026, even with the questions about Jones."],
[7,8,"A. St. Brown","DET","WR",4,2,6,4,1,1.9,12.2,1.9,0,"alpha",0,1,"Amon-Ra St. Brown has been a no-brainer stud WR1 for fantasy football over the last four years. Since 2023, he has finished as the WR4 in fantasy points per game in EVERY season. Yep, it’s true. Last season, among 109 qualifying receivers, St. Brown ranked fifth in target share (28.5%), in receiving yards per game (82.4), yards per route run (2.66), and first-read share (37.4%, per Fantasy Points Data). He was also third in first downs per route run and led all receivers in red zone targets. The red zone work should come down some with a healthy Sam LaPorta for 2026, but St. Brown should still finish with double-digit receiving touchdowns for the fourth consecutive season. St. Brown is a high floor/high ceiling pick again in 2026."],
[8,7,"C. McCaffrey","SF","RB",4,2,8,2,-1,5.0,18.5,2.9,0,"alpha",0,1,"Christian McCaffrey came storming back in his age-29 season to finish as the RB1 in fantasy points per game while leading the NFL with 413 touches. He also ranked second in total yards from scrimmage behind only Bijan Robinson. McCaffrey remained amazing through the air, leading backs with a 21.3% target share, 54.4 receiving yards per game, and 0.103 first downs per route run (per Fantasy Points Data). After another high-volume season in the bag, and with his age getting close to the danger zone, McCaffrey feels like a risky pick again that could produce league-winning results if he stays healthy. At this point, San Francisco isn’t decreasing his workload. They can talk about it all they want yearly, but it’s not happening. Outside of the concerns that I’ve already stated, McCaffrey’s declining rushing efficiency is a worry. Last year, among 49 qualifying backs, McCaffrey ranked 35th in explosive run rate, 26th in missed tackle rate, and 40th in yards after contact per attempt. Those numbers are worrisome, but again, they are thwarted by his volume weekly and his passing game role. McCaffrey could easily post another RB1 overall season in 2026, or he could get dinged up and miss time, thus crushing your team. It’s not difficult to see either outcome for this upcoming season."],
[9,9,"C. Lamb","DAL","WR",5,2,14,2,0,3.0,9.0,-1.3,0,"alpha",0,0,"CeeDee Lamb had a “down” year last season as the WR11 in fantasy points per game, but that finish doesn’t really tell the entire story of Lamb’s season. In Week 3, he played only seven snaps, and in Week 18, he played only 45.5% of the snaps. If we remove those two games, he averaged 16.6 PPR points per game, which would have him as the WR9 in fantasy points per game last season. In that 12-game sample, Lamb drew a 24.8% target share with 89.4 receiving yards per game, 2.51 yards per route run, a 32.3% first-read share, and 0.098 first downs per route run (per Fantasy Points Data). Overall, those marks would have ranked 13th, third, ninth, 12th, and 26th among all receivers with at least 200 routes last season. Lamb remains a locked-in WR1 with a stellar quarterback in his prime and George Pickens alongside him to keep defenses honest."],
[10,12,"J. Cook III","BUF","RB",5,2,7,2,2,3.1,15.8,0.2,0,"alpha",0,1,"Well, so much for all of the regression talk about James Cook last year. Cook crushed all of the haters, improving his stock as the RB6 in fantasy points per game. He led the NFL in rushing yards (1,621) while finishing third in rushing attempts and sixth in rushing touchdowns (tied). Cook had 14 total touchdowns compared to the 18 that he spiked in the previous season. Cook remained extremely efficient as a rusher, ranking 15th in explosive run rate and 11th in yards after contact per attempt (per Fantasy Points Data). His passing game usage was nearly identical to the previous season, with 40 targets (38 targets in 2024) and 8.8 yards per reception (8.1 in 2024). We can quibble about where Cook sits in the RB1 rankings in 2026, but he remains a rock-solid RB1 in one of the best offenses in the NFL."],
[11,10,"J. Jefferson","MIN","WR",6,2,6,5,-1,4.0,6.9,-3.4,0,"alpha",0,0,"Last year, Justin Jefferson had a horrible runout as the WR28 in fantasy points per game (WR14 in expected fantasy points per game). Obviously, a ton of his season was impacted by the level of quarterback play, but Jefferson also slid to 36th in separation score and 38th in route win rate (among 109 qualifying receivers, per Fantasy Points Data). A lot of the blame can fall at the feet of Minny’s quarterback room last year, but not all of it, considering the per-route metrics as well as the fact that Jefferson was tied for the sixth-most drops. Yes, he was also 78th in catchable target rate, so 2025 was a mixed bag with some blame on both sides of the aisle. Last year, Jefferson was still sixth in target share (28.5%) and seventh in first-read share (35.1%), so we should all expect the Minnesota passing attack to run through their alpha wide receiver again in 2026. He could easily return to being a top 10 fantasy wideout as he has been every year of his NFL career (outside of 2025), but there’s still some risk with Kyler Murray or J.J. McCarthy throwing him the ball this season."],
[12,22,"N. Collins","HOU","WR",7,3,8,3,10,4.5,10.3,-0.3,0,"alpha",0,1,"Nico Collins has now managed back-to-back-to-back WR1 seasons (WR9, WR8, WR7) in fantasy points per game. It’s impressive that Collins has managed to do this despite C.J. Stroud’s struggles over the last two years. There’s no reason to doubt his ability to do it again this season. Last year, among 109 qualifying receivers, Collins was 15th in target share (23.1%), eighth in receiving yards per game (74.5), fifth in deep targets (24), 16th in first-read share (28.1%), and 19th in first downs per route run (0.105, per Fantasy Points Data). Collins is an easy click in drafts with upside. If Stroud can flash even momentary glimpses of his rookie form in 2026, Collins could enter top five receiver territory this season."],
[13,20,"D. London","ATL","WR",8,3,11,3,7,3.7,11.2,0.6,0,"alpha",0,1,"I absolutely understand the concern regarding the Falcons’ quarterback situation, but that won’t stop me from drafting Drake London. London is a bet on talent that I’ll continue to make. Despite Michael Penix and Kirk Cousins, London was cooking last year before a PCL injury derailed his season in Week 11. In Weeks 1-10 last year, London was the WR6 in fantasy points per game. During that stretch, he was fourth in target share (30.3%), fourth in receiving yards per game (86.4), sixth in yards per route run (2.74), fifth in first-read share (37.6%), and seventh in first downs per route run (0.135, per Fantasy Points Data). London should be a locked-in WR1 this season with top-five upside if the quarterback situation works itself out."],
[14,18,"D. Henry","BAL","RB",6,3,13,3,4,3.5,15.6,4.1,0,"alpha",0,1,"Last year was another impressive year for Derrick Henry. He didn’t show any signs of slowing down with 307 rushing attempts, 1.595 rushing yards, 16 total touchdowns, and an RB8 finish in fantasy points per game. Last year, among 49 qualifying backs, Henry ranked 16th in yards after contact per attempt and seventh in explosive run rate (per Fantasy Points Data). Henry won’t contribute much in the passing game, but that’s a given at this point. It doesn’t crush his overall production, but it isn’t there to help add to his weekly floor. Henry had five games last year as RB25 or lower in weekly fantasy scoring. I still want to invest in Henry as an RB1 again in 2026. If Lamar Jackson can bounce back, Henry could inch back closer to his 2024 production (RB4 in fantasy points per game). He’s at worst a low-end RB1 with top-five upside."],
[15,21,"B. Bowers","LV","TE",1,3,13,3,6,3.0,9.3,-1.9,0,"starter",0,0,"There are great expectations for Brock Bowers in his third NFL season following an injury-plagued Year 2. Bowers had five catches for 103 yards in the Raiders’ 2025 season opener against the Patriots, but he sustained a PCL injury and bone bruise to his left knee in that game, was clearly hampered over his next three games (with under 50 receiving yards in each) and was shut down for three games. Upon his return, Bowers scored seven touchdowns in eight games before the Raiders, looking to protect their star TE and also secure the No. 1 pick in the draft, placed Bowers on injured reserve, keeping him out of their last two contests. Widely considered one of the best TE prospects to ever enter the league, Bowers had 112 catches for 1,194 yards and five touchdowns on 153 targets as a rookie. With better health in 2026, he has a chance to match or exceed his rookie numbers. The Raiders are talent-starved at wide receiver, so Bowers is poised to be their alpha pass catcher. New head coach Klint Kubiak has been entrusted to repair the Las Vegas offense. No. 1 overall draft pick Fernando Mendoza offers hope at the QB position, and the Raiders also have TE-friendly QB Kirk Cousins, who was quarterbacking the Falcons last year in Week 15, when TE Kyle Pitts had 11 catches for 166 yards and three TDs. Bowers is worth a look in the back half of the second round or early in the third round of 12-team fantasy drafts."],
[16,11,"A. Jeanty","LV","RB",7,3,13,2,-5,6.6,11.2,-0.3,0,"alpha",0,1,"Ashton Jeanty will be seen as a disappointment for fantasy managers exiting his rookie season. It wasn’t a failure, but you can make the argument that, because of his talent and the hype, it didn’t live up to lofty expectations. Jeanty was the RB15 in fantasy points per game, finishing with 321 touches and 1,321 total yards. He ranked fifth in snap share, first in opportunity share, seventh in weighted opportunities, and 15th in red zone touches. Among 49 qualifying backs, Jeanty ranked 16th in missed tackle rate and 17th in yards after contact per attempt (per Fantasy Points Data). The ecosystem surrounding Jeanty stunk. The Raiders were 31st in red zone scoring attempts per game and 30th in yards per play. Among those 49 qualifying backs previously, Jeanty had the second-fewest yards before contact per attempt (1.28), and 65% of his rushing yards came after first contact. With Klint Kubiak in town, Fernando Mendoza or Kirk Cousins at the helm, a healthy Brock Bowers, and improved blocking up front, Jeanty could be poised to post a strong RB1 season in his second season."],
[17,19,"A.J. Brown","NE","WR",9,3,11,2,2,5.8,9.5,-1.1,0,"alpha",0,1,"A.J. Brown has a new home in New England for the foreseeable future. Brown has been a WR1 in fantasy points per game over the last four seasons (WR10, WR12, WR8, WR8), and I don’t see that stopping this season. Brown moves from an Eagles offense that was 15th in neutral passing rate to a Patriots’ system that was ninth in neutral passing rate and could climb even higher this season with the additions of Brown and Romeo Doubs this offseason. Brown could easily spike a career high in touchdowns this season. Last season, Philly was 32nd in passing rate inside the ten-yard line while the Patriots were 15th. That jump in touchdown fuel (if it all works out) could send him into top five status this season among fantasy receivers. Last year, among 109 qualifying receivers, Brown was ninth in target share (27.5%), 17th in yards per route run (2.23), eighth in first-read share (35%), and 20th in first downs per route run (0.104, per Fantasy Points Data). Brown was also 30th in separation score and 16th in route win rate among the same sample of receivers. While many will worry about Drake Maye spreading the ball around in 2026, I’m not because last year that was related to New England not having an alpha-level receiver like Brown on the depth chart. That isn’t the case now. Brown is a strong WR1 with more upside than he’s had in previous seasons because of the passing volume floor and ceiling for New England this year."],
[18,13,"S. Barkley","PHI","RB",8,3,10,4,-5,5.7,12.2,0.7,0,"alpha",0,1,"I tried to tell people last year, but few wanted to listen. After an insane 2024 season, Saquon Barkley was poised to come back down to earth some in 2025. Well, it happened. Barkley finished with 317 touches and 1,413 total yards as the RB14 in fantasy points per game. Part of this could be traced to natural regression, but also, Barkley had a decent dip in efficiency. In 2024, Barkley had an insane 3.55 yards before contact per attempt, which easily led all running backs (minimum 100 carries, per Fantasy Points Data). Last year, that number fell to 2.11, which was 23rd among 49 qualifying backs, essentially a league-average number. From 2024 to 2025, Barkley’s explosive run rate dropped from 7.2% (fourth-best) to 4.6% (20th), and his yards after contact per attempt dipped from 2.26 (35th) to 1.96 (39th). Barkley lived off explosive runs and easily getting into the second level of defenses in 2024, but he found more uphill sledding last year. His volume should finish in the neighborhood of 300 touches with double-digit touchdown upside. That should lock him into top-15 running back status with possible top 5-7 upside if the offensive line can stay healthy and the Eagles’ passing attack can also bounce back. If the aerial attack can get right, this team and Barkley will have more scoring opportunities in 2026 (last year, 28th in red-zone scoring opportunities per game)."],
[19,24,"G. Pickens","DAL","WR",10,3,14,2,5,5.3,11.7,1.1,0,"alpha",0,0,"Last season was a monster breakout season for George Pickens as the WR5 in fantasy points per game. His splits with CeeDee Lamb out and active were dramatic, but that doesn’t mean that Pickens wasn’t awesome in both realms. With Lamb in the huddle, Pickens averaged 15 fantasy points per game versus 24.2 with him out. Across that entire season with Lamb, that would have made Pickens the WR11 in fantasy points per game, and without him, he would have been the WR1 in fantasy points per game. With Lamb, Pickens had a 20.2% target share with 2.24 yards per route run, 77.1 receiving yards per game, a 25.2% first-read share, and 0.116 first downs per route run (per Fantasy Points Data). Without Lamb, those numbers jumped to a 23.6% target share, 3.14 yards per route run, 106.8 receiving yards per game, a 34.1% first-read share, and 0.154 first downs per route run. No matter how you slice it, Pickens was elite last year, and he should be a WR1 again this season in a pass-first Dallas offense."],
[20,16,"D. Achane","MIA","RB",9,3,6,3,-4,8.8,16.0,4.5,0,"alpha",0,1,"Last season, De’Von Achnae was the RB5 in fantasy points per game while racking up 305 touches and 1,838 total yards. After a dip in 2024, he returned to being an otherworldly back in terms of efficiency. Among 49 qualifying backs, Achane was first in explosive run rate, 13th in missed tackle rate, and sixth in yards after contact per attempt (per Fantasy Points Data). He was also a key cog in the passing game, ranking second among backs in target share (18.7%), 12th in yards per route run, and fourth in receiving yards. He was fifth in targets among backs with 85. That number is sure to drop this season with Malik Willis in Miami. I don’t think he’ll be a zero in the passing game, especially considering the receiving depth chart for Miami, but Willis’s rushing ability will lead to fewer checkdowns for Achane in 2026. Achane should still be considered an insanely talented RB1 that could lead the NFL in rushing yards this season, but if his receiving work takes a hit, he’ll probably lack top 3-5 upside at the position."],
[21,27,"T. McBride","ARI","TE",2,4,14,2,6,7.7,11.2,4.5,0,"starter",0,0,"It will be hard for Trey McBride to top the year he had in 2025. He finished the season with 126 catches for 1,239 yards and 11 touchdowns on 169 targets. Among all pass catchers, McBride trailed only Puka Nacua in receptions. McBride also ranked third in targets among all pass catchers and tied for second in TD catches. It was an impressive follow-up to a 2024 season in which McBride had 111 catches for 1,146 yards and two touchdowns. There are reasons to think that McBride might have a hard time matching his 2025 numbers this season. The Cardinals threw at the highest rate in the NFL last season. That’s not likely to happen again after the team drafted a running back, Jeremiyah Love, No. 3 overall. The Cardinals are also looking to get Marvin Harrison Jr. more involved after two disappointing seasons. McBride is clearly one of the elite tight ends and is worthy of a top-25 draft pick. Just don’t expect a full repeat of last year."],
[22,34,"J. Allen","BUF","QB",1,4,7,3,12,0.5,22.0,4.6,0,"starter",0,1,"Josh Allen is once again the consensus QB1 in fantasy. He finished QB1 in fantasy scoring last season for the fourth time in the last six years. After down years from Lamar Jackson and Jalen Hurts, the gap between Allen and other fantasy QBs seems to have widened. And yet, there are at least a few small gray clouds dotting Allen’s profile. In 2025, he hit a six-year low in passing yards per game (215.8), TD passes (25), and fantasy points per game (22.0). A lack of pass-catching weaponry has been a problem. Khalil Shakir led the Bills with 719 receiving yards in 2026, and Buffalo hasn’t had even a 900-yard receiver since Stefon Diggs left after the 2023 season. The Bills traded for D.J. Moore in March in an attempt to give Allen additional help. But what really anchors Allen’s fantasy value is his rushing. He ran for 579 yards and 14 touchdowns in 2025 - his third consecutive season with double-digit TD runs. Over the last five years, Allen has averaged 640 rushing yards and 10.8 TD runs."],
[23,14,"O. Hampton","LAC","RB",10,4,7,3,-9,8.3,11.5,-1.5,0,"alpha",0,1,"Last year, Omarion Hampton’s rookie season was derailed by an ankle injury in Week 5. When he came back, he wasn’t close to 100% healthy and had only one game with over a 55% snap rate. Any games after Week 4 last year, I’m just tossing in the trash because that wasn’t the “real” Hampton. In 2025, in Weeks 1-4, Hampton averaged 17 touches and 95 total yards as the RB13 in fantasy points per game. In that small sample of games, he posted a 7.4% explosive run rate, a 19% missed tackle rate, and 2.54 yards after contact per attempt (per Fantasy Points Data). If he had kept up that pace the entire year in those three categories, he would have ranked fourth, tenth, and eighth in those categories (minimum 100 carries). Those are impressive numbers and speak to his talent and upside in 2026 as Mike McDaniel’s possible bellcow. Hampton also contributed through the air in his first four NFL games with a 10.1% target share, 27.5 receiving yards per game, and 1.12 yards per route run. McDaniel is sure to get Hampton involved through the air after designing offenses of the last three seasons that have ranked third, third, and seventh in target share to the running back position. Yes, I know that Hampton isn’t De’Von Achane, but this is still a feather in Hampton’s cap. Hampton should be a rock-solid RB1 with massive upside in 2026."],
[24,29,"C. Olave","NO","WR",11,4,8,3,5,8.1,10.6,0.8,0,"alpha",0,0,"Last season, Chris Olave had easily the most productive season of his NFL career as the WR7 in fantasy points per game. Olave spiked a career-high nine receiving touchdowns and proved yet again that he should be mentioned in the same breath as the most talented receivers in the NFL. Among 109 qualifying receivers, Olave was tenth in target share (27.2%), ninth in receiving yards per game (72.7), 19th in yards per route run (2.09), ninth in first-read share (33.8%) ,and 28th in first downs per route run (0.095, per Fantasy Points Data). Olave will again be Tyler Shough’s unquestioned WR1 in what we expect to be an ascending offense. Olave is a locked-in WR1 for 2026 that could take another step if Shough progresses."],
[25,15,"K. Walker III","KC","RB",11,4,5,3,-10,9.2,9.5,-3.5,0,"alpha",0,1,"Kenneth Walker arrives in Kansas City as the Chiefs’ new lead back. Walker had a disappointing season in 2025 from a fantasy standpoint as the RB28 in fantasy points per game, but it’s easy to see why it unfolded that way. Walker had to split the passing game usage with Zach Charbonnet, and he was shown the cold shoulder by Seattle in the red zone. Last year, Walker had a 31.9% route share versus Charbonnet’s 34.7% route share (per Fantasy Points Data). In the games that Charbonnet was active, Walker saw only 34.8% of the running back red zone rushing work (30 red zone carries versus Charbonnet’s 51). With a lucrative contract signed and delivered for Walker, I don’t see him missing out on the high usage boat in 2026. Talent isn’t the problem for Walker; it was just the way that Seattle deployed him. Last year, Walker ranked second in explosive run rate, first in missed tackle rate, ninth in yards per route run, and 12th in first downs per route run. He was a per-touch efficiency marvel. I don’t foresee him being a true bellcow with Kansas City, and I don’t want that because he has dealt with injury issues in the past. With his salivating mix of talent and efficiency, Walker should be an explosive RB1 in 2026."],
[26,17,"C. Brown","CIN","RB",12,4,6,2,-9,6.7,12.6,-0.4,0,"alpha",0,1,"Last year, Chase Brown started slowly as the RB34 in fantasy points per game in Weeks 1-5. After that point, he was exactly who fantasy gamers thought they were drafting as the RB6 in fantasy points per game. In Weeks 6-18, among 48 qualifying backs, he ranked 17th in explosive run rate, fifth in yards after contact per attempt, and 16th in missed tackles forced per attempt (per Fantasy Points Data). During that span, he averaged 18.2 touches and 100.1 total yards. Brown had to deal with Samaje Perine eating into his workload during Weeks 13-18, but it didn’t capsize his production. During that stretch, while he did play 60.5% of the snaps and 71.6% of the snaps in the red zone, he did have 17 red zone carries versus Perine’s 13. If Brown can capture more of the red zone work in 2026, his ceiling and floor will be raised considerably from a week-to-week and season-long perspective. Brown is a solid RB1 with top-five upside this season."],
[27,26,"R. Rice","KC","WR",12,4,5,2,-1,11.0,12.1,2.3,0,"alpha",0,1,"Rashee Rice has a super-high ceiling given how much he was targeted in the red zone this past season (a ton of screen passes). Rice finished top-5 among WRs in PPG during his truncated season. 7th overall in red-zone targets in just 8 games played. Given that his draft price might be slightly reduced due to his off-field issues and the injured QB...Rice could easily be a league winner after it was announced in early April that he would not face discipline from the NFL."],
[28,33,"T. Higgins","CIN","WR",13,4,6,4,5,7.0,10.2,0.4,0,"contested",0,1,"Over the last two seasons, Tee Higgins has been the WR13 and WR5 in fantasy points per game. Last season, with Joe Burrow under center in Weeks 14-18, Higgins had an 18.8% target share with 67.8 receiving yards per game, 2.20 yards per route run, a 25.6% first-read share, and 0.106 first downs per route run (per Fantasy Points Data). Those are all incredibly impressive per-route metrics. For context, if Higgins had kept up that pace for an entire season with Burrow, he would have ranked 12th in receiving yards per game, 19th in yards per route run, 28th in first-read share, and 17th in first downs per route run among wideouts (minimum 200 routes). Higgins is a strong bet for fantasy again this season. If Joe Burrow can stay healthy this season, Higgins should be a locked-in top-15 wideout with WR1 upside again."],
[29,67,"D. Maye","NE","QB",2,4,11,2,38,7.8,21.1,3.7,0,"starter",0,1,"In only his second NFL season, Drake Maye finished QB2 in fantasy scoring, averaging 21.1 fantasy points per game. Maye was sublime as a passer last year, leading the NFL in completion percentage (72.0%), yards per pass attempt (8.9) and passer rating (113.5). Maye finished a close second in the MVP balloting behind the Rams’ Matthew Stafford. Aided by the tailwinds of a favorable regular-season schedule, Maye produced 4,394 passing yards and 31 TD passes. He also chipped in as a runner with 450 rushing yards and four TD runs - and his bountiful college rushing stats suggest there’s still more meat on that bone. Maye got a rude wakeup call in the playoffs, completing 58.3% of his throws and averaging 207 passing yards per game and 6.9 yards per attempt in a four-game run against the Chargers, Texans, Broncos and Seahawks - all among the best pass defenses in the league. Despite the sour ending, Maye’s second NFL season was a triumph. He’s a top-five fantasy quarterback moving forward."],
[30,56,"L. Jackson","BAL","QB",3,4,13,3,26,9.8,17.1,-0.3,0,"starter",0,1,"Injuries and a steep decline in rushing production cratered Lamar Jackson’s fantasy value in 2025. After finishing QB1 in fantasy scoring in 2024, Jackson plummeted to a QB20 fantasy finish last season and was QB16 in fantasy points per game at the position. Jackson lost three games to an early-season hamstring injury and one game to a late-season back injury. He also dealt with knee, ankle, and toe issues that may have contributed to the sharp drop-off in his rushing numbers. In his first six seasons as a full-time starter, Jackson averaged 10 rushing attempts and 63 rushing yards per game. In 2026, he averaged 5.2 rushing attempts and 26.8 rushing yards per game. Jackson has been an elite fantasy scorer at the position for so long that it’s reasonable to think better health will propel him to another high-end QB1 season. It’s worth noting, however, that Jackson will be working with a new offensive coordinator, 29-year-old Declan Doyle, a former assistant to Bears head coach Ben Johnson."],
[31,39,"T. McMillan","CAR","WR",14,4,5,2,8,8.1,8.3,-1.5,0,"contested",0,1,"Tetairoa McMillan wasted no time establishing himself as Carolina’s clear-cut WR1, winning Offensive Rookie of the Year after nearly topping 1,100 receiving yards on 126 targets. The rookie standout commanded elite volume immediately, finishing with a 23% target share and massive 41% air yards share despite operating in a run-heavy offense. McMillan consistently delivered as Bryce Young’s go-to option and flashed massive upside whenever the Panthers leaned into the passing game. After such a polished rookie campaign, T-Mac looks poised to make the jump into the fantasy WR1 conversation entering Year 2."],
[32,32,"K. Williams","LAR","RB",13,4,11,5,0,7.2,13.4,0.4,0,"rotational",0,1,"Kyren Williams continues to motor along with RB1 seasons. Last year, he was the RB10 in fantasy points per game after seasons as the RB10 and RB2 in fantasy points per game. Williams had to deal with more work for Blake Corum last year, but he still retained his lead role overall and in the red zone. In Weeks 7-18, Williams still saw 63% of the red zone rushing attempts while Corum helped him with the heavy lifting on early downs in between the 20s. With the workload lightened a tad, Williams did post improved rushing efficiency metrics, ranking 21st in explosive run rate, 25th in missed tackle rate, and 18th in yards after contact per attempt (per Fantasy Points Data). Williams should remain the lead back for one of the NFL’s best offenses in 2026 and turn in another low-end RB1 season."],
[33,41,"J. Jacobs","GB","RB",14,4,11,4,8,8.5,13.4,0.4,0,"contingent",0,1,"Josh Jacobs has been the RB8 and RB9 in fantasy points per game during his two seasons in Green Bay. he dealt with a knee injury last season, which impacted his snap share and effectiveness. Last year, after Week 6, he surpassed 60% of the snaps in only two games. I wouldn’t be surprised to see Green Bay limit his playing time to an extent this year to keep him healthy all year, but that’s just a projection. I also wouldn’t be shocked to see them run him out there for 70-80% of the snaps weekly if his body can hold up. Last year, he ranked 22nd in explosive run rate and 19th in missed tackle rate (per Fantasy Points Data). Jacobs’ touchdown equity in the Green Bay offense has helped him a ton over the last two seasons, as he has averaged 15 total touchdowns per season while ranking ninth and fifth in red zone touches. Jacobs is a top 20 back with RB1 upside in 2026."],
[34,35,"M. Nabers","NYG","WR",15,5,8,4,1,14.2,9.8,0.7,0,"rotational",0,1,"Malik Nabers remains an elite talent, but his 2026 outlook is heavily tied to recovery from a complicated ACL injury that wiped out nearly all of his sophomore season. Before going down, Nabers was producing like a fantasy WR1 in the Giants’ offense. The concern isn’t ability &mdash; it’s availability, especially after requiring a second procedure during rehab. Nabers still offers league-winning upside once fully healthy, but fantasy managers should build in the expectation of missed time and a slower early-season ramp-up."],
[35,30,"Z. Flowers","BAL","WR",16,5,13,4,-5,8.0,9.3,0.2,0,"contested",0,1,"Last year, Zay Flowers posted career-best marks across the board with 86 receptions, 1,211 receiving yards, and a WR12 finish in fantasy points per game. It was amazing to see for a player who also ranked eighth in target share (27.7%), 11th in receiving yards per game (71.2), seventh in yards per route run (2.61), and tenth in first-read share (33.3%, per Fantasy Points Data). While Flowers also saw 19 deep targets last year, the big concern with him is his touchdown upside. Flowers has never had more than five receiving touchdowns in any season, and with only 11 red zone targets last year, it’s tough to project a huge spike in that this season, but there could be hope with the arrival of offensive coordinator Declan Doyle. I’m not projecting that Doyle heads into this season drawing up more usage for Flowers near the goal line, but it can’t possibly get any worse than it has been previously. Flowers is a strong WR2 with WR1 upside again this year."],
[36,25,"D. Smith","PHI","WR",17,5,10,4,-11,9.8,7.3,-1.8,0,"contested",0,1,"DeVonta Smith steps into the clear WR1 chair for the Philly passing attack. Over the last two years, in a VERY small sample, Smith has proven that he can handle it. In three games since 2024, without A.J. Brown on the field, Smith has commanded a 32.9% target share while producing 2.65 yards per route run (per Fantasy Points Data). Yes, I know the sample is tiny, but it is signal that Smith can command WR1-level volume and remain efficient while doing so. Last year, among 109 qualifying receivers, Smith was also 27th in separation and 28th in route win rate. Last year, Smith also drew a 22.7% target share while producing 2.03 yards per route run (22nd) and 0.089 first downs per route run (32nd). I expect all of those marks to improve in 2026 with Smith leading the way for Philly. He’s a WR1/2 with some upside and an extremely high floor."],
[37,37,"J. Williams","DAL","RB",15,5,14,4,0,9.1,13.0,2.2,0,"contingent",0,1,"Last year, Javonte Williams was a massive surprise in fantasy, to everyone, including me. I was very bullish about his 2025 outlook, but I was hoping at best for a volume-driven RB2 residing in an explosive offense. Well, Williams crushed even my expectations as the RB11 in fantasy points per game, finishing with a career high 1,201 rushing yards and 13 total touchdowns. Among 49 qualifying backs, he ranked 16th in explosive run rate and third in yards after contact per attempt (per Fantasy Points Data). His season was also a tale of two halves as he faded some down the back half of the year. In Weeks 1-8, he averaged 18.5 touches, 90.7 total yards, and scored nine total touchdowns as the RB8 in fantasy points per game. In Weeks 9-17, he averaged 17.4 touches, 76.5 total yards, and scored only four total touchdowns as the RB25 in fantasy points per game. Much of his fantasy stock drop was related to the fall in touchdown production, which can be simple variance. His deeper analytics back up that his play didn’t fall off on a per-touch efficency standpoint. In Weeks 1-8, he had a 4.8% explosive run rate with an 11% missed tackle rate and 3.52 yards after contact per attempt. That yards after contact per attempt mark is otherworldly. In Weeks 8-17, he posted a 5.5% explosive run rate with a 13% missed tackle rate and 2.33 yards after contact per attempt. He improved his marks down the stretch in two of those three categories. If Williams can post production as he did over the first half of the 2025 season for an entire year, he is a locked-in top ten back with top-five upside. At his floor, he looks like a low-end RB1 or top 15 fantasy back."],
[38,47,"C. Loveland","CHI","TE",3,5,10,2,9,13.8,6.7,-4.0,0,"starter",0,0,"The 10th overall pick of the 2025 NFL Draft, Colston Loveland put together an impressive rookie season that got better and better as it wore on. Loveland finished TE12 in half-point PPR scoring as a rookie with 58 catches for 713 yards and six touchdowns. From Week 9 on, Loveland was TE2 in fantasy scoring behind only Trey McBride. Over Chicago’s last four games - two in the regular season, two in the playoffs - Bears head coach Ben Johnson fully unleashed Loveland. The rookie tight end had 10 or more targets in each of those games, averaging 12.0 targets, 7.0 catches and 94.5 receiving yards over that stretch, with a pair of TDs. In the Bears’ playoff win over the Packers, Loveland was targeted 15 times and had eight catches for 137 yards. The 6-6, 241-pound Loveland is a matchup nightmare with his size and speed. Loveland is the consensus TE3 for 2026 fantasy drafts behind only Brock Bowers and Trey McBride."],
[39,23,"J. Love","ARI","RB",16,5,14,2,-16,7.6,8.2,-2.6,0,"contingent",0,0,"Well, it happened. Jeremiyah Love went top five in the NFL Draft to the Arizona Cardinals, who already have Tyler Allgeier and James Conner on the depth chart. With that type of draft capital investment, I think Love will be Arizona’s lead back in 2026, but he could have his workload eaten into by Allgeier and/or Conner. Love’s talent isn’t in question. Over the last two years in college, he ranked inside the top 15 backs in each season in yards after contact per attempt, breakaway rate, and elusive rating (per PFF). He’s also a stellar pass catcher, as evidenced by sitting at 17th in yards per route run among FBS backs last year and drawing a 10.9% target share. The Cards look like one of the worst teams in the NFL with concerning quarterback play. The cluttered backfield and worrisome scoring environment could hinder Love in 2026, keeping him as a strong RB2, but locking him out of RB1 status. If he does get the lion’s share of the work, and their grouping of quarterbacks can produce something close to league-average passing production, Love could be a top 12 back."],
