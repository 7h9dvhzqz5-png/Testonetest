[122,123,"J. Higgins","HOU","WR",49,9,8,3,1,12.0,5.2,-2.7,0,"contested",0,1,"We should always be looking to take swings on talented second-year wide receivers for fantasy football, and Jayden Higgins fits the bill as a possible late-round breakout candidate for 2026. Last year, in Weeks 8-18, Higgins had seven finishes as a WR3 or better in weekly scoring. During that stretch, Higgins, among 119 qualifying receivers, also ranked 24th in target per route run rate (24%) and 38th in first downs per route run (per Fantasy Points Data). During those 11 games, among the same group of 119 receivers, Higgins was also 28th in yards per route run and 25th in route win rate as a perimeter receiver. If C.J. Stroud can at least be a league-average passer in 2026, Higgins could be a weekly WR2/3 or flex option. He also has contingent upside if Nico Collins misses any time."],
[123,128,"J. Ferguson","DAL","TE",15,9,14,2,5,13.8,6.2,2.2,0,"starter",0,1,"Jake Ferguson is a competent pass catcher in a prolific offense, but the presence of two star receivers in Dallas could limit Ferguson’s fantasy upside. Ferguson had 82 catches for 600 yards and eight touchdowns in 2025. The reception and TD totals were career highs, but Ferguson averaged just 7.3 yards per catch, a career low. He finished TE8 in half point fantasy scoring but was TE13 in fantasy points per game among TEs who played at least five games. The Cowboys have an explosive passing attack, but WRs CeeDee Lamb and George Pickens are QB Dak Prescott’s principal targets. The Lamb-Pickens duo combined for 250 targets and 168 receptions last season. Ferguson’s 2026 production could be limited as long as Lamb and Pickens are both healthy, so it’s best to consider Ferguson a high-end TE2 in this year’s drafts."],
[124,129,"C. Rodriguez Jr.","JAC","RB",41,9,7,4,5,18.8,6.8,4.8,0,"committee",1,0,"Chris Rodriguez reunited with Liam Coen this offseason as he signed with the Jacksonville Jaguars. Rodriguez and Coen spent time together during Coen’s one-year tenure as Kentucky’s offensive coordinator during the 2021 collegiate season. In that season, Rodriguez ran for 1,379 yards with 6.1 yards per carry and 12 total touchdowns. Rodriguez will look to build upon his brief run as Washington’s starter last season. In Weeks 10-18, he drew six starts while averaging 12.7 touches and 57.7 total yards as the RB31 in fantasy points per game. Rodriguez could be an early down and short yardage option for the Jags this year, as he won’t be contributing much in the passing game. Last season, he had only four targets and 30 receiving yards with Washington. He was quite good as a rusher, though ranking 12th in missed tackle rate and second in yards after contact per attempt (per Fantasy Points Data). We’ll see how much Rodriguez can eat into Bhayshul Tuten’s workload this season, but he’s a nice late-round pick in all formats."],
[125,122,"T. Shough","NO","QB",20,9,8,3,-3,11.5,14.9,0.6,0,"starter",0,1,"Second-round draft pick Tyler Shough was a pleasant surprise for New Orleans as a rookie. He now enters the 2026 season as the Saints’ undisputed starter, with an opportunity to prove that he can be the team’s long-term answer at quarterback. Spencer Rattler started the Saints’ first eight games in 2025, but Shough took over as the starter in Week 9 and guided the team to a 5-4 record down the stretch. Shough was QB12 in fantasy points per game from Week 9 through the end of the regular season, and he produced at least 17.1 fantasy points in each of his last six starts. The 26-year-old Shough completed 67.6% of his throws, averaged 7.3 yards per pass attempt, and had 10 TD passes and six interceptions. He also averaged 16.9 rushing yards per game and had three TD runs. It should be noted that only one of the teams Shough faced in his nine starts last season, the Rams, ranked inside the top 10 in DVOA against the pass. Still, it was an impressive half-season for Shough, and the Saints should have an easy schedule again in 2026. The Saints feathered Shough’s nest in this year’s NFL Draft by drafting WR Jordyn Tyson No. 8 overall. With Tyson and veteran Chris Olave, Shough has more than adequate pass-catching weaponry."],
[126,91,"J. Downs","IND","WR",50,9,13,4,-35,14.3,4.9,-3.0,0,"rotational",0,0,"Josh Downs is good. PFF’s 20th-highest graded WR in 2025. And for the second straight year...the Colts slot WR was hyper-targeted at a 24% clip. That led all Colts WRs and TEs in 2025. And he creates separation. Per Fantasy Points Data...Downs ranked 20th in average separation score. Downs has been limited because of a lack of high-end route participation, but a late-season route bump could suggest more of Downs in a full-time role in 2026....after the team traded Michael Pittman Jr. to the Steelers."],
[127,133,"T. Tracy Jr.","NYG","RB",42,9,8,4,6,13.3,8.3,6.3,0,"contingent",0,1,"Tyrone Tracy slots in as a strong handcuff this season. If Cam Skattebo is fully healthy, I expect him to lead New York’s backfield, but if he can’t stay healthy in 2026 (very possible), Tracy could be a plug-and-play RB2. Last year, Tracy had another nice run as the Giants’ starting back. In Weeks 10-18, he was the RB14 in fantasy points per game, averaging 18.7 touches and 95.5 total yards. Overall, among 49 qualifying backs, he ranked 27th in explosive run rate and 31st in yards after contact per attempt (per Fantasy Points Data). If Skattebo misses any games, you’ll be glad you drafted Tracy."],
[128,143,"W. Marks","HOU","RB",43,9,8,4,15,18.7,7.9,5.9,0,"committee",1,1,"With David Montgomery in Houston now, Woody Marks becomes his immediate backup and handcuff. Marks is a solid option among handcuffs. Last year, during his run as Houston’s starter (Weeks 10-18), he averaged 17.5 touches and 63.2 total yards per game as the RB32 in fantasy points per game. Last year, overall, he was solid but not spectacular on a per-touch basis, ranking 34th in explosive run rate, 48th in missed tackle rate, and 40th in rushing success rate (per Fantasy Points Data). Marks is a decent late-round handcuff option to draft, but you’ll likely be able to get him off the waiver wire in season if Montgomery misses any time."],
[129,158,"Z. Charbonnet","SEA","RB",44,9,11,4,29,21.4,10.1,8.1,0,"committee",1,0,"Zach Charbonnet enters 2026 with an unknown timetable for when he’ll be available for Seattle or when he’ll be 100% after he tore his ACL in last year’s playoffs. With Jadarian Price, Emanuel Wilson, and George Holani on the depth chart, I doubt that Seattle rushes him back into duty and tasks him with a hefty workload before he’s ready. This unknown/moving timeline has me shying away from Charbonnet for 2026. Last year, he was the RB27 in fantasy points per game, while ranking seventh in missed tackle rate and yards after contact per attempt (per Fantasy Points Data). Take those numbers with a grain of salt for this season, with Charbonnet’s health likely not 100% for most of the season. Charbonnet could be a decent flex play this season at some point."],
[130,117,"R. Doubs","NE","WR",51,9,11,2,-13,16.6,6.9,-1.0,0,"rotational",0,1,"Romeo Doubs lands with the New England Patriots and should be Drake Maye’s clear WR2 behind A.J. Brown. He should see a volume bump with the Pats, simply moving from an offense that was 30th in neutral passing rate last year (Green Bay) to one that was ninth in neutral passing rate. I wouldn’t be surprised if the Pats increase their neutral passing rate this season, either with the arrival of Brown and Doubs and Drake Maye having another year in Josh McDaniels’ offensive system. Also add in Green Bay’s love of rotating receivers and Doubs 72.8% route share last year, and it’s not difficult to see Doubs being a late-round value. Last year, Doubs was the WR43 in fantasy points per game with five weeks in weekly scoring as a top 25 fantasy wideout. Last year, among 109 qualifying wide receivers, Doubs was 36th in target per route run rate, 31st in yards per route run, 18th in first downs per route run, and 27th in fantasy points per route run (per Fantasy Points Data). Also among those 109 receivers, Doubs was 23rd in separation and fifth in route win rate. He’s primed to explode this season with WR2/3 upside if everything goes right."],
[131,161,"T. Allgeier","ARI","RB",45,9,14,2,30,25.0,6.4,4.4,0,"committee",1,0,""],
[132,132,"M. Willis","MIA","QB",21,9,6,3,0,30.9,12.8,-1.5,0,"starter",1,1,"Cast aside by the Titans and rejuvenated by a stint as a backup with the Packers, Malik Willis now gets a chance to prove himself as a starter for the Dolphins, who signed him to a three-year, $67 million contract in March. Willis is an electric runner. In six career starts, Willis has averaged 44.8 rushing yards per game and has run for four touchdowns. And Willis seems to have made considerable strides as a passer. Over 11 appearances and three starts in Green Bay in 2024 and 2025, Willis completed 78.7% of his throws and averaged 10.9 yards per pass attempt, with six TD passes and zero interceptions. Willis will be hard-pressed to match that sort of passing efficiency with the Dolphins, who might have the worst collection of pass catchers in the league. But Willis’ running ability should make him fantasy-viable even if his passing numbers are mediocre."],
[133,102,"J. Brooks","CAR","RB",46,9,5,1,-31,43.7,2,0,0,"contingent",1,1,"Jonathon Brooks is a wonderful wild card pick for 2026 with big-time upside if he is 100% and ready to rock. Brooks has had enough time recuperating from his second torn ACL that he should enter camp this season and Week 1 fully healthy. Chuba Hubbard lost his starting job to Rico Dowdle last season, and Carolina let him walk in the offseason. Outside of Brooks and Hubbard, Carolina has only Trevor Etienne and A.J. Dillon on the roster, so Carolina is heavily betting on Brooks to return to his collegiate form. Brooks could pull an Uncle Rico from last year and steal Hubbard’s starting job in 2026. Just to remind everyone about the talent that Brooks has, in 2024 (his final collegiate season), he ranked 21st in yards after contact per attempt, ninth in elusive rating, and 21st in yards per route run (per PFF). I’ll be drafting Brooks a ton this season."],
[134,126,"K. Shakir","BUF","WR",52,9,7,4,-8,11.6,5.9,-2.0,0,"contested",0,1,"Khalil Shakir once again provided stability without much ceiling, finishing as a WR3/4 despite operating as one of Josh Allen’s most trusted targets. His short-area role created a reliable weekly floor, but limited downfield and red-zone usage continued to cap his fantasy upside. The addition of DJ Moore adds even more competition for targets, making it difficult to project meaningful volume growth in 2026. Shakir still profiles as Buffalo’s safest receiver from a consistency standpoint, but fantasy managers should view him more as a floor-based depth option than a breakout candidate."],
[135,119,"KC Concepcion","CLE","WR",53,9,11,3,-16,35.2,2,-5.9,0,"rotational",1,0,"KC Concepcion lands in an intriguing spot after the Browns selected him 24th overall to help reshape their passing attack under new HC Todd Monken. The former Texas A&M Aggie boasts an elite production profile, dynamic YAC ability, and a versatile skill set that has drawn comparisons to Zay Flowers. With uncertainty surrounding Cleveland’s WR hierarchy, Concepcion has a realistic path to emerging as a featured option sooner rather than later. The Browns quarterback situation creates volatility, but his ability to create offense on his own makes him one of the more intriguing rookie sleeper receivers in fantasy football considered he has first-round draft capital."],
[136,130,"J. Coker","CAR","WR",54,9,5,2,-6,19.3,5.2,-2.7,0,"rotational",1,1,"Jalen Coker continued proving he belongs after entering the league as an undrafted free agent, flashing whenever he was healthy enough to stay on the field. The Panthers slot receiver finished the year strong, highlighted by a huge playoff performance and a stretch of consistent production that hinted at a larger role. Coker’s strong hands and reliability helped him emerge as one of Bryce Young’s trusted options, and he enters 2026 as the favorite for Carolina’s No. 2 WR job behind Tetairoa McMillan. If he can finally stay healthy for a full season, Coker has sneaky value in deeper formats. In Coker’s last nine games played, he was averaging 10.1 PPG in half-PPR scoring — worth even more in our full-PPR format."],
[137,139,"C.J. Stroud","HOU","QB",22,9,8,4,2,17.6,15.5,1.2,0,"starter",0,0,"Over the last two years, CJ Stroud has been unable to match the splendor of his 2023 rookie season. Shoddy offensive line play was undoubtedly part of the problem in 2024. The Texans’ O-line outperformed expectations in 2025, but Stroud was a league-average starter at best. As a rookie, Stroud threw for 4,108 yards and 23 touchdowns, with only five interceptions. He averaged 273.2 passing yards per game and 8.2 yards per pass attempt. In 31 starts over the last two seasons, Stroud has averaged 218.3 passing yards per game and 7.1 yards per attempt. His yearly finishes in fantasy points per game among QBs with at least nine starts: QB7, QB26, QB20. The Texans have worked on upgrading Stroud’s offensive line, and Houston has a solid set of pass catchers led by WR Nico Collins. But with Houston having one of the NFL’s top defenses, Stroud probably won’t be presented with a lot of pass-happy game scripts. Consider Stroud a low-end QB in 2026 fantasy drafts."],
[138,148,"I. Pacheco","DET","RB",47,9,6,5,10,9.1,5.3,3.3,0,"contingent",0,1,"Isiah Pacheco lands with the Lions as the change-of-pace back/handcuff for Jahmyr Gibbs. Pacheco’s health has been an issue for the last three years. In a complementary/goal-line role, he could pay dividends for Detroit. If he can recapture any resemblance to the player that posted a 5.4% explosive run rate and 2.77 yards after contact per attempt in 2023 in Detroit, he should pay off for the Lions in 2026 (per Fantasy Points Data). If Gibbs were to miss any time, Pacheco would likely be an RB2 option for fantasy gamers."],
[139,111,"M. Golden","GB","WR",55,9,11,5,-28,29.0,2.9,-5.0,0,"rotational",1,1,"Matthew Golden’s rookie season was mostly quiet from a fantasy perspective, but the underlying context suggests better days are ahead. Green Bay has significant vacated targets entering 2026, and Golden’s lack of production was driven more by inconsistent playing time than poor efficiency. The former first-round pick flashed his upside late in the year and remains an intriguing fit alongside Jordan Love thanks to his speed and big-play ability. If his route participation climbs in Year 2, Golden has clear breakout potential in an evolving Packers offense."],
[140,141,"S. Darnold","SEA","QB",23,9,11,4,1,15.7,14.7,0.4,0,"starter",0,0,"It took Sam Darnold seven seasons to finally get his footing as an NFL starter, but he’s now put together two splendid seasons, culminating in a Super Bowl victory with the Seahawks. Darnold began his career with three nightmarish seasons as a Jet, fared little better in two seasons as a Panther, and spent one season as a backup with the 49ers before finally breaking through with the Vikings in 2024. He signed with the Seahawks in 2025 and guided the team to a 14-3 regular-season record and a 3-0 run through the playoffs. Over the last two regular seasons, Darnold has completed 66.9% of his throws and averaged 8.2 yards per pass attempt, with 60 TD passes, 26 interceptions, and a passer rating of 100.9. He’s finished QB9 and QB13 in fantasy scoring the last two years. Darnold averaged only 28.1 pass attempts per game last season, as the Seahawks ran the ball at the third-highest rate in the league. Darnold must adjust to a new offensive coordinator, Brian Fleury, now that former Seahawks OC Klint Kubiak has taken the Raiders’ head-coaching job. But it’s possible Seattle throws at a higher rate this year, which could potentially boost Darnold’s passing numbers."],
[141,150,"H. Henry","NE","TE",16,9,11,4,9,17.3,7.0,3.0,0,"starter",0,0,"With 60 catches for 768 yards and seven touchdowns last season, Hunter Henry finished TE7 in half-point PPR fantasy scoring and TE12 in fantasy points per game among TEs who played at least five games. That was a career high in yardage for Henry, and his 8.8 yards per target represented his best mark in that category since 2017. Henry seems to have good rapport with young Patriots QB Drake Maye, and the 31-year-old tight end hasn’t shown signs of slowing down. But New England’s potential addition of WR A.J. Brown could put at least a slight dent in Henry’s target share."],
[142,146,"O. Gadsden II","LAC","TE",17,9,7,4,4,33.2,5.5,1.5,0,"starter",1,1,"Oronde Gadsden had an exciting four-game run last year as a rookie with 24 catches for 377 yards and 2 TDs from Week 6 to Week 9. He was TE1 in fantasy scoring over that stretch. Despite some dazzling flashes, Gadsden’s 2026 fantasy outlook is murky. The Chargers signed blocking TE Charlie Kolar in free agency and picked up former Browns TE David Njoku in May. The Chargers have also added fullback Alec Ingold, who was with new offensive coordinator Mike McDaniel in Miami. With 49 catches for 664 yards and three touchdowns in 15 games as a rookie, Gadsden offers intriguing fantasy upside. But with two other quality tight ends on the roster, Gadsden should be no more than a later-round dart throw in 2026 drafts."],
[143,135,"R. Shaheed","SEA","WR",56,9,11,3,-8,25.4,5.4,-2.5,0,"contested",1,1,"Rashid Shaheed’s 2025 season was derailed after a midyear trade from New Orleans to Seattle, but his early-season showed he is capable of thriving as a fantasy-relevant No. 2 receiver. Before the trade, Shaheed ranked top-15 in WR targets and consistently produced alongside Chris Olave in the Saints offense. Seattle never fully incorporated him after the move, though the Seahawks clearly believe in his upside after handing him a three-year deal this offseason. Shaheed should enter 2026 as Seattle’s clear WR2 behind Jaxon Smith-Njigba, although target competition and the team’s run-heavy tendencies could make him more boom-or-bust week to week."],
[144,155,"J. Johnson","NO","TE",18,9,8,2,11,22.1,6.1,2.1,0,"starter",1,0,"Juwan Johnson quietly put together the best season of his career in 2025, finishing with 77 catches, 889 yards and three touchdowns. That added up to a TE10 finish in half-point PPR scoring despite the relatively low TD count. The arrival of rookie WR Jordan Tyson, the eighth overall pick in this year’s draft, could cut into Johnson’s target total. But Tyson had injury problems in college, and veteran Saints WR Chris Olave has had health issues as well. An injury to either would likely boost Johnson’s target totals. The fast pace favored by Saints head coach and playcaller Kellen Moore is another thing working in Johnson’s favor."],
[145,151,"B. Strange","JAC","TE",19,9,7,3,6,23.3,6.0,2.0,0,"starter",1,0,"Brenton Strange hit career highs in receptions (46), receiving yards (540) and TD catches (3) last season despite playing only 12 games. The 25-year-old Strange, a second-round draft pick in 2023, averaged an impressive 9.0 yards per target and a solid 1.58 yards per route run in an ascendant Jacksonville offense. Still, his fantasy impact was modest. Strange finished TE18 in half-point PPR fantasy points per game among TEs who played at least five games. Although his 2025 performance hints at greater fantasy potential, Strange may have to share snaps with other tight ends in Jacksonville. The Jaguars selected Nate Boerkircher in the second round and Tanner Koziol in the fifth round of this year’s draft. That suggests the Jaguars will use more multiple-TE sets this season, which wouldn’t necessarily be bad for Strange, but it somewhat clouds his fantasy outlook for 2026."],
[146,181,"A. Kamara","NO","RB",48,9,8,3,35,24.9,6.2,4.2,0,"committee",1,0,""],
[147,138,"C. Ward","TEN","QB",24,9,9,3,-9,17.3,11.4,-2.9,0,"starter",0,1,"Cam Ward struggled mightily for most of his rookie year but showed improvement late in the season, creating optimism for 2026. The No. 1 pick in last year’s NFL Draft averaged just 10.2 fantasy points per game over his first 12 starts. He averaged a paltry 5.7 yards per pass attempt over that span, with seven TD passes and six interceptions. Ward didn’t have more than one TD pass in a game until Week 14, but then he had three consecutive games with two TD passes. Over Ward’s last four starts of 2026 (not including a brief cameo appearance in Week 18), he averaged 15.5 fantasy points per game. A shortage of pass-catching weaponry was a major problem for Ward as a rookie. The Titans addressed that issue by signing WR Wan’Dale Robinson in free agency and drafting Ohio State WR Carnell Tate No. 4 overall. Hopefully Ward will get better protection from his offensive line in 2026 after taking a league-high 55 sacks last year. Ward is probably only a consideration in superflex leagues or extremely deep redraft leagues for 2026, but the talented youngster could come on quickly."],
[148,168,"B. Robinson Jr.","ATL","RB",49,9,11,2,20,22.2,3.2,1.2,0,"committee",1,1,"Brian Robinson Jr. is quietly one of the best handcuffs in football. If Bijan Robinson were to miss any time, he’d be the team’s every-down back with only Tyler Goodson and Nathan Carter behind him on the depth chart. I doubt he has much standalone value this season, so if you’re drafting him, it’s for his handcuff upside only. Last year, when he was on the field for the 49ers, he posted a solid 4.3% explosive run rate and 2.46 yards after contact per attempt (per Fantasy Points Data). If Bijan Robinson were knocked out of the lineup, Brian Robinson Jr. would be a top 24 back immediately with RB1 upside in any week."],
[149,172,"D. Sampson","CLE","RB",50,9,11,3,23,18.1,3.6,1.6,0,"committee",1,0,"Dylan Sampson finished 2nd in yards per route run and first in target rate per route run (28%) among qualifying RBs last season."],
[150,137,"K. Mitchell","LAC","RB",51,9,7,3,-13,29.2,3.6,1.6,0,"committee",1,1,"Keaton Mitchell landed with the Chargers this offseason and should be solid competition for Kimani Vidal for the RB2 role. Mitchell flashed with the same big-play ability that he has been known for in his short career with the Ravens last season. Last season, he had only 68 touches, but he had a 10.2% explosive run rate and a respectable 1.37 yards per route run (per Fantasy Points Data). I don’t know if he’ll have a ton of bankable standalone value week-to-week with the Bolts, but he will offer some flashy big plays for Mike McDaniel’s offense when called upon in 2026. I wouldn’t be surprised if he works his way into an ancillary role as the season moves along that offers some flex value, but we’ll have to wait and see if that comes to fruition."],
[151,157,"T. Spears","TEN","RB",52,9,9,3,6,19.9,5.1,3.1,0,"committee",1,0,""],
[152,165,"T. Bigsby","PHI","RB",53,9,10,4,13,28.7,3.2,1.2,0,"contingent",1,1,"Tank Bigsby is one of the best handcuffs in the NFL, and he won’t get mentioned at the top of the conversation many times. Last year, among 65 qualifying backs, he ranked fourth in explosive run rate, second in missed tackle rate, and first in yards after contact per attempt (per Fantasy Points Data). In the one game that he played more than 40% of the snaps (Week 18), we got to see what his fantasy value could be if Saquon Barkley missed any time. He logged 17 touches with 106 total yards as the RB9 for the week in PPR scoring. If you’re looking for handcuffs to stash, Bigsby is one of the best."],
[153,153,"J. Coleman","DEN","RB",54,10,10,2,0,22.0,2,-1.2,0,"contingent",1,0,"Jonah Coleman walks into the Denver depth chart as the RB3 with the ability to climb the depth chart. If J.K. Dobbins is unable to stay healthy this year, Coleman could assume the early down duties opposite R.J. Harvey. If Harvey can’t continue to grow and improve after his rookie season, it wouldn’t be shocking to see Coleman hop Harvey on the depth chart and become the passing-down option for Denver. Over his last three collegiate seasons, Coleman ranked 54th, 13th, and 1st in yards after contact per attempt and 61st, sixth, and fourth in elusive rating (per PFF). In two of those three seasons, he was also top 24 in yards per route run. Coleman is a wonderful late-round dart to toss in fantasy drafts in 2026."],
[154,149,"J. Jennings","MIN","WR",57,10,6,5,-5,30.3,7.9,3.0,0,"contested",1,1,"Jauan Jennings revived his career over the last two seasons, finishing as a fantasy WR3 in 2025 while emerging as one of the NFL’s most heavily targeted red-zone receivers. However, his move to Minnesota likely pushes him into a depth role behind Justin Jefferson and Jordan Addison. Vikings HC Kevin O’Connell values Jennings’ versatility and physicality, but consistent fantasy relevance could be difficult to achieve without injuries ahead of him on the depth chart. Jennings still offers some touchdown appeal in deeper formats, though his weekly ceiling projects much lower in Minnesota than it was in San Francisco."],
[155,155,"HOU DST","HOU","DST",1,10,8,2,0,4.2,3.2,1.7,0,"starter",0,0,"No. 1-highest scoring projected DST after finishing as the DST2 in 2025. Third-fewest PPG allowed. The Texans have been a top-5 fantasy unit for two straight seasons. They do draw two tougher matchups to start the year, versus Buffalo and Cincinnati."],
[156,202,"B. Allen","NYJ","RB",55,10,13,3,46,31.1,3.3,0.1,0,"committee",1,0,""],
[157,178,"J. Jeudy","CLE","WR",58,10,11,3,21,16.4,4.2,-0.7,0,"contested",0,0,"Jerry Jeudy’s last year in Cleveland was disappointing both from an efficiency and fantasy standpoint, and the outlook for 2026 isn’t much brighter. Despite a respectable target volume, Jeudy struggled badly on a per-route basis (8th worst in YPPR) while the Browns aggressively added more pass-catching competition this offseason. Cleveland can talk up Jeudy’s role all it wants, but drafting multiple receivers early suggests the organization isn’t fully committed to him as the long-term WR1. At his current price, Jeudy feels more like a player fantasy managers should avoid than target."],
[158,156,"B. Young","CAR","QB",25,10,5,2,-2,27.6,14.3,-2.5,0,"starter",1,1,"Although the Panthers have picked up the fifth-year option on Bryce Young, this still seems like a crossroads season for the former No. 1 overall draft pick. Young has taken small steps forward in his three seasons as the Panthers’ starter, but perhaps not enough to secure his status as Carolina’s long-term starter. He hit career highs last season in passing yards (3,011), TD passes (23) and completion percentage (63.6%), while reaching a career low in sack rate (5.4%). But Young averaged just 188.2 passing yards per game and 6.3 yards per pass attempt last season. It sometimes seemed as if Panthers head coach Dave Canales was trying to hide his quarterback, with Young attempting 25 or fewer passes in half of his 16 starts. Young’s finishes in fantasy points per game (nine games minimum) in his three years with the Panthers: QB29, QB23, QB24. It’s hard to see Young as anything but a backup in superflex leagues or extremely deep 1QB leagues."],
[159,140,"O. Cooper Jr.","NYJ","WR",59,10,13,4,-19,31.4,2,-2.9,0,"rotational",1,0,"2026 first-rounder Omar Cooper Jr. enters a Jets offense that lacks an established No. 2 option, but the rookie’s versatility and run-after-catch ability could help him carve out an immediate role. The former Indiana standout was one of the best YAC receivers in the class and offers inside-outside flexibility that complements Jets WR1 Garrett Wilson well. Opportunity may be limited early with multiple young pass-catchers already in place, but Cooper has a realistic path to earning the No. 2 WR role over time. His fantasy appeal likely hinges more on efficiency and manufactured touches."],
[160,145,"D. Jones","IND","QB",26,10,13,4,-15,32.9,18.0,1.2,0,"starter",1,1,"Although he tore his Achilles in early December, Daniels Jones says he expects to be 100% ready for Week 1 of 2026. Through the first 10 weeks of the 2025 season, Jones looked like an MVP candidate while guiding the Colts to an 8-2 start. He completed 69.9% of his passes over those first 10 games, averaged 8.3 yards per pass attempt, threw 15 TD passes and seven interceptions, and added five rushing touchdowns. Jones was QB5 in fantasy scoring over that stretch. But then Jones fractured his fibula, costing him some mobility and limiting his effectiveness as a passer, before the late-season Achilles tear. It’s encouraging that Jones is upbeat about his recovery, but mobility is a big part of his game (both in real life and fantasy), and it’s fair to wonder whether Jones will have anything close to his usual mobility. Jones has also been notoriously turnover-prone during his career. Monitor Jones’ recovery closely in the run-up to the 2026 season."],
[161,154,"D. Boston","CLE","WR",60,10,11,3,-7,31.8,2,-2.9,0,"rotational",1,0,"Denzel Boston lands in Cleveland with intriguing draft capital and a skill set that fills a clear need in the Browns offense. The 6-foot-4 receiver brings size, physicality, and contested-catch ability to a WR room lacking true boundary presence. However, Boston faces an uphill battle for immediate fantasy relevance while competing with first-round pick KC Concepcion and tight end Harold Fannin Jr. for targets in an offense with lingering quarterback concerns. His profile suggests more boom-or-bust production early in his career, relying heavily on downfield plays and red-zone opportunities."],
[162,144,"J. McMillan","TB","WR",61,10,10,4,-18,31.2,4.5,-0.4,0,"rotational",1,1,"Jalen McMillan’s 2025 season was essentially wiped out by injury, but the flashes he showed in limited action &mdash; and previously as a rookie &mdash; remain intriguing. The former Washington product continued to post strong efficiency metrics when healthy, highlighted by a huge Week 17 performance and over 2.0 yards per route run in a small sample. The issue has never really been talent; it has been availability. McMillan remains an upside stash in deeper formats, but fantasy managers need to factor in the growing injury concerns entering Year 3."],
[163,163,"DEN DST","DEN","DST",2,10,10,4,0,5.2,2.8,1.3,0,"starter",0,0,"The Broncos had one of the softest schedules to start the 2025 season. 2026 is drastically different. In the first six weeks, it’s tough, according to Warren Sharp (although drawing the Chiefs twice early on could be an advantage if Patrick Mahomes is less than 100%). First 8 games: Chiefs, Jaguars, Rams, 49ers, Chargers, Seahawks, Cardinals, and Chiefs. Third-toughest schedule over that stretch. If the Broncos don’t have the same injury luck on defense two years in a row, it’s possible they don’t return elite DST status."],
[164,142,"C. Okonkwo","WAS","TE",20,10,7,1,-22,39.7,4.0,0.8,0,"starter",1,0,"The glass-half-full take on Chig Okonkwo’s 2026 fantasy outlook is that a move from Tennessee to Washington could lead to a career-best fantasy performance. Okonkwo has dealt with some pretty shoddy quarterbacking over his four NFL seasons, and now he’ll be playing with QB Jayden Daniels in a Commanders offense that lacks proven pass-catching talent beyond WR Terry McLaurin. The glass-half-empty take is that if Okonkwo were going to pop as a potentially impactful fantasy TE, we would have seen more signs of an impending breakout by now. Even with the Titans thin on WR talent last season, Okonkwo could muster only a 14.9% target share, and his numbers weren’t substantially better than those of fourth-round rookie TE Gunnar Helm. Okonkwo has had 54, 52 and 56 receptions over the last three years, and he had a career-high 560 receiving yards in 2025, but he’s never scored more than three TDs in a season. Okonkwo is an intriguing sleeper at tight end, but it would be reckless to count on him as a fantasy starter."],
[165,173,"A. Mitchell","NYJ","WR",62,10,13,4,8,32.2,3.4,-1.5,0,"rotational",1,0,""],
[166,166,"T. Hunter","JAC","WR",63,10,7,4,0,36.7,5.1,0.2,0,"rotational",1,1,"Travis Hunter remains one of fantasy football’s most fascinating wild cards as Jacksonville continues to balance his two-way responsibilities. Early indications suggest the Jaguars want him playing more cornerback in 2026, although that may not necessarily come at the expense of his WR role. Before his injury last season, Hunter was heavily involved as a schemed-touch weapon, leading the Jaguars in catches while flashing explosive upside from the slot. His fantasy value ultimately hinges on offensive snap volume, making him more of a high-upside stash unless injuries or dedicated role expansion push him into a full-time receiving role."],
[167,214,"K. Boutte","NE","WR",64,10,11,2,47,27.5,6.5,1.6,0,"rotational",1,0,""],
[168,253,"E. Wilson","SEA","RB",56,10,11,4,85,30.3,4.7,1.5,0,"committee",1,0,""],
[169,169,"SEA DST","SEA","DST",3,10,11,2,0,2.9,3.4,1.9,0,"starter",0,0,"Seattle took home the crown of the highest-scoring DST in 2025 by allowing the fewest PPG in the NFL (17.2). They will host the Patriots in the season opener, followed by a road game versus the Cardinals. They have been a top-5 fantasy unit in back-to-back seasons under Mike Macdonald. Expect more of the same in 2026."],
[170,170,"LAR DST","LAR","DST",4,10,11,2,0,6.1,2.6,1.1,0,"starter",0,0,"The Rams were fourth in pressure rate last season (26%) and just added last year’s reigning sack record-breaker in EDGE rusher Myles Garrett. Jared Verse had no problems generating pressures last season, but he didn’t always finish with the sack. That won’t be an issue with Garrett entrenched as the Rams’ top pass rusher. Add that the Rams led the NFL in dropped interceptions (10) and revamped their secondary with the additions of CBs Jaylen Watson/Trent McDuffie - LA is knocking on the door of DST No. 1 status in pursuit of a Lombardi trophy."],
[171,171,"PHI DST","PHI","DST",5,10,10,0,0,5.2,2.6,1.1,0,"starter",0,0,"No team has a more difficult DST schedule than the Eagles in 2026. But they start the year off in a decent spot - at home versus the Commanders and on the road versus the Titans. The Eagles have finished as fantasy DST7 in back-to-back seasons with extremely strong personnel on that side of the ball. They have been in the top 6 in turnover margin since 2024, and saw an increase in pass rush productivity last season."],
[172,152,"T. Tucker","LV","WR",65,10,13,2,-20,31.1,6.2,1.3,0,"rotational",1,0,"Tre Tucker quietly put together a solid 2025 season and enters 2026 with a legitimate chance to emerge as the Raiders’ top wide receiver, even if Brock Bowers remains the centerpiece of the passing game. The former third-round pick has improved each season, logged nearly every snap last year, and continues to command meaningful downfield volume. New coaches have already praised Tucker’s leadership and work ethic, suggesting he will remain heavily involved in the offense."],
[173,134,"S. Diggs","FA","WR",66,10,0,0,-39,46.2,7.4,2.5,0,"rotational",1,0,"I know that at the time of writing this, Stefon Diggs is a free agent, but I want to draft him anyway. Diggs had a strong 2025 season that proved that he has plenty left in the tank to post a strong fantasy season in 2026. Last year, he was the WR23 in fantasy points per game with only a 65.4% route share (62nd out of 109 qualifying receivers). Among 109 qualifying receivers, he was stellar on a per-route basis, ranking 22nd in target per route run rate (25%), 20th in receiving yards per game (59.6), and eighth in yards per route run (2.53) and first downs per route run (0.127, per Fantasy Points Data). Diggs could be a WR2/3 again this season depending upon his landing spot."],
[174,159,"K. Sadiq","NYJ","TE",21,10,13,4,-15,32.2,2.5,-0.7,0,"starter",1,0,"The 16th overall pick of this year’s NFL Draft, Kenyon Sadiq offers an athletic profile that few if any tight ends can match. Sadiq ran a 4.39 at the combine and had a 431/2-inch vertical jump. Sadiq’s college production profile at Oregon wasn’t quite as dazzling. He topped out at 51 catches, 560 receiving yards and eight touchdowns last year as a junior, averaging an uninspiring 1.62 yards per route run, according to PFF. The Jets aren’t expected to have a very good passing attack this year with Geno Smith as the starting quarterback. Sadiq will have to compete for targets with Garrett Wilson, fellow rookie Omar Cooper Jr. and fellow TE Mason Taylor. It’s possible Sadiq’s athleticism helps him become impactful right away, but more likely he’s a play for the future. Profiling as a low-end TE2 or high-end TE3, Sadiq will be undraftable in most redraft leagues."],
[175,196,"M. Washington Jr.","LV","RB",57,10,13,2,21,32.8,2,-1.2,0,"contingent",1,0,"Mike Washington Jr. could help Ashton Jeanty with the early down lifting in 2026 and slot in as one of the best handcuffs in the NFL. Washington Jr. tested like an alien during the predraft process, leading to his fourth-round draft capital. During his final collegiate season, Washington Jr. broke out, ranking 33rd in yards after contact per attempt and 17th in breakaway rate (per PFF). Washington Jr. has blistering 4.3 speed and the size (6’1”, 223 lbs) to be a three-down back if called upon. Stash him as a wonderful handcuff in 2026, where you can."],
[176,163,"T. Harris","LAC","WR",67,10,7,2,-13,32.1,2.3,-2.6,0,"rotational",1,1,"Tre Harris has to be one of the best WR sleepers to take in 2026. The second-year WR is being grouped into the “elite” Chargers WR conversation alongside Ladd McConkey and Quentin Johnston by HC John Harbaugh. And even though his rookie year didn’t feature a ton of highlight-reel plays or counting stats, his playing time increased because of his contributions as a run-blocker. That suggests he could see much more playing time (and targets) than his bottom-dwelling ADP would indicate in 2026. Harris can create big plays and is versatile enough to line up all over the formation. He also averaged 5.5 targets in the last two games that QJ missed in the second half of the season. If the Chargers lean into the run game more with their new OC, Mike McDaniel, Harris could be a major benefactor in terms of snaps/routes based on how well he does the dirty work."],
[177,239,"J. Conner","ARI","RB",58,10,14,2,62,47.8,6.3,3.1,0,"committee",1,0,""],
[178,174,"AJ Barner","SEA","TE",22,10,11,3,-4,19.6,5.6,2.4,0,"starter",1,1,"A.J. Barner got significantly more involved in the Seattle offense in his second NFL season after a quiet rookie year. Barner’s snap share increased from 45% in 2024 to 72% in 2025. He had 52 catches for 519 yards and six touchdowns last season after putting up 30-245-4 as a rookie. Barner also had 10 rushing attempts for 14 yards and a touchdown last year, and he had four catches for 54 yards and a touchdown in the Super Bowl. Barner had a 14.9% target share last season for a Seattle offense that had the fourth-fewest pass attempts in the league. The Seahawks didn’t add any pass catchers of note in the offseason, so if they either throw more frequently in 2026 or Barner carves out a bigger target share, Barner could take another step forward. Jaxon Smith-Njigba had an absurd 35.8% target share for the Seahawks last year, so it’s entirely possible that Barner’s target share could rise while JSN’s comes down. Consider Barner a midrange to low-end TE2 for 2026 fantasy drafts."],
[179,179,"PIT DST","PIT","DST",6,10,9,5,0,6.7,2.5,1.0,0,"starter",0,0,"Week 1? Home versus the Atlanta Falcons. That in itself justifies selecting the Steelers DST. They also come in at No. 4 in the projections - but this unit has seen a fall-off over the last 2 seasons (4 to 9). The Steelers’ secondary was shredded at times last season, allowing the fourth-most passing yards per game and ranking third in total missed tackles. FA acquisitions Jaquan Brisker and Jamel Dean should help bolster the back-end, but this defense STILL projects as one of the oldest in the league. But the third-easiest schedule through the first eight games suggests they start the year strongly."],
[180,180,"JAC DST","JAC","DST",7,10,7,3,0,5.3,2.8,1.3,0,"starter",0,0,"Week 1? Home versus the Cleveland Browns. The Jags finished second in interceptions in 2025 (22) after posting the third-lowest INT rate in 2024. They made a sneaky leap last year by leading the NFL in passes defended. As one of the league’s premier “pass-funnels,” the Jags DST has boom potential with a salivating Week 1 matchup. But be warned that they might be extremely feast or famine as the 21st-ranked defense in the 2026 projections. Jacksonville’s defensive interior ranked second-lowest in pass-rush productivity across the NFL in 2025 - resulting in an underwhelming sack total (27th)."],
[181,228,"K. Vidal","LAC","RB",59,10,7,3,47,33.6,7.8,4.6,0,"committee",1,0,""],
[182,184,"C. Ridley","TEN","WR",68,10,9,3,2,33.5,4.3,-0.6,0,"rotational",1,0,""],
[183,166,"D. Schultz","HOU","TE",23,10,8,4,-17,30.2,5.6,2.4,0,"starter",1,0,"Dalton Schultz had 82 catches for 777 yards and three touchdowns in 2025 to finish TE11 in half-point PPR fantasy scoring. The modest TD total limited his fantasy impact, but Schultz finished tied with Jake Ferguson for third among tight ends in receptions behind only Trey McBride and Kyle Pitts. Schultz finished sixth among TEs in receiving yards. The Texans have an established star at wide receiver with Nico Collins, and Jayden Higgins, Jaylin Noel and (if healthy) Tank Dell round out a pretty good WR corps. With robust target competition, Schultz might be hard-pressed to match the career-high 106 targets he saw last season. And since Houston has one of the best defenses in the league, the Texans aren’t likely to be a pass-heavy team in 2026. It’s best to consider Schultz a midrange TE2 for fantasy, even though he was more than that last season."],
[184,188,"E. Johnson","KC","RB",60,10,5,3,4,35.3,2,-1.2,0,"committee",1,0,"The Chiefs selected Emmett Johnson in the fifth round of the NFL Draft. He arrives in Kansas City after a final season in college, where he ranked sixth in missed tackles forced and 52nd in yards per route run and elusive rating (per PFF). Johnson has three-down ability in the NFL after lining up in the slot or out wide with 18% of his snaps in 2025. He’s a strong handcuff who should earn the RB2 role for the team behind Kenneth Walker, in short order."],
[185,185,"MIN DST","MIN","DST",8,10,6,1,0,9.3,2.6,1.1,0,"starter",0,0,"2025’s fifth-highest scoring DST opens the schedule at home against the Packers at home, followed by two road matchups versus the Bears/Buccaneers. However, the defense projects to suffer more injuries after being the 4th-healthiest unit last season. They also had the fourth-fewest passes defensed despite ranking in the top 5 in pressure rate/sacks. Brian Flores’ blitz-happy defense lends itself to boom-or-bust DST performances (25th in turnover margin in 2025)."],
[186,186,"NE DST","NE","DST",9,10,11,3,0,10.0,2.4,0.9,0,"starter",0,0,"The Pats boasted a bottom-10 pass rush last season. They lost their sack leader in free agency and replaced him with Dre’Mont Jones. NE seems like a unit that could regress with a more difficult schedule in 2026 and worse injury luck on defense. Note that despite finishing last year inside the top 5 in fewest points allowed, they were the third-worst red zone defense. Just 23rd overall in defensive DVOA as the 10th-ranked DST. It’s probably not worth reaching on too early based on their tougher opening 4 matchups against the formidable Seahawks, Steelers, Jaguars, and Bills."],
[187,211,"T. Franklin","DEN","WR",69,10,10,2,24,36.1,6.2,1.3,0,"rotational",1,0,""],
[188,188,"B. Aubrey","DAL","K",1,10,14,2,0,1.8,11.0,1.4,0,"starter",0,0,"The gold standard among NFL kickers, Brandon Aubrey has finished first, first and third in kicker fantasy scoring in his first three seasons in the league. Aubrey is 112-of-127 (88.2%) on FG attempts over his first three seasons and 126-of-130 (96.9%) on extra points. The 6-3, 218-pound Aubrey has a powerful leg. He’s made 35-of-44 FG attempts from 50 or more yards over the last three years, and Aubrey already holds the NFL record for most field goals of 60 or more yards with six. Aubrey should be the first kicker off the board in 2026 fantasy drafts."],
[189,189,"K. Fairbairn","HOU","K",2,10,8,2,0,6.4,12.9,3.3,0,"starter",0,1,"Ka’imi Fairbairn led the league in field goals attempted (48) and field goals made (44) last season despite missing two games with a quad injury. Fairbairn led all kickers with 12.9 fantasy points per game in 2025, finishing a full point ahead of runner-up Jason Myers. The dependable nine-year veteran has converted 91.3% of his FG tries and 97.3% of his PATs over the last four years. Fairbairn is accurate from long distance, converting 51-of-69 (73.9%) of his career FG attempts from 50 yards or longer. With one of the top defenses in the league and a flawed offense, Texans head coach DeMeco Ryans isn’t one to turn up his nose at the chance to put three points on the board. The Texans’ 52 team FG attempts ranked first in the league in 2025, and they tied for fourth in that category in 2024 with 42 FG attempts. Fairbairn is a low-risk, high-upside kicker option."],
[190,190,"LAC DST","LAC","DST",10,10,7,3,0,19.4,2.1,0.6,0,"starter",1,0,"The Chargers will take on the Arizona Cardinals and the Las Vegas Raiders to start the year. Best schedule for any DST. Draft them and start the Bolts with confidence through the first two weeks of the 2026 season."],
[191,191,"C. Dicker","LAC","K",3,10,7,2,0,2.9,10.0,0.4,0,"starter",0,0,"Four-year veteran Cameron Dicker is currently the all-time NFL leader in field goal accuracy, having converted at a 93.5% clip. In his three full seasons (he played only 11 games as a rookie), Dicker has finished eighth, third and fourth in fantasy scoring. “Dicker the Kicker” is capable of dialing long-distance, having drilled 59-yard field goals in each of the last two years, and having converted 21-of-27 career attempts from 50 yards or longer. The Chargers have given Dicker ample FG attempts the last two years, tying for fourth in 2024 with 42 and finishing fifth in that category last year with 41. The Chargers’ offense could present Dicker with even more scoring opportunities in 2026 with a healthier and improved offensive line and the arrival of highly regarded offensive coordinator Mike McDaniel."],
[192,160,"R. Flournoy","DAL","WR",70,11,14,2,-32,29.5,4.9,0.7,0,"rotational",1,0,""],
[193,167,"I. TeSlaa","DET","WR",71,11,6,4,-26,27.4,3.5,-0.7,0,"rotational",1,1,"Isaac TeSlaa barely saw the field as a rookie, but he flashed intriguing upside by turning just 16 receptions into six touchdowns. Detroit clearly believes in the former third-round pick after trading up for him in 2025, and Dan Campbell has already hinted at a potential Year 2 leap. With Kalif Raymond gone, TeSlaa has a clear path to the Lions’ No. 3 WR role behind Amon-Ra St. Brown and Jameson Williams. He’s still more dynasty/deep-league upside stash than reliable redraft option, but the athletic traits and red-zone usage are worth monitoring closely."],
[194,194,"C. Little","JAC","K",4,11,7,4,0,8.3,9.6,0.5,0,"starter",0,0,"Cam Little has only been in the league for two years, and he already holds the NFL record for longest field goal and longest *outdoor* field goal. Little blasted a 68-yard field goal against the Raiders last November in the domed Allegiant Stadium in Las Vegas. Two months later, he drilled a 67-yarder in the Jaguars’ regular-season finale at Jacksonville’s outdoor EverBank Stadium. Little, who’s entering his age-23 season, has quickly established himself as one of the NFL’s best kickers. He’s converted 57-of-63 (90.5%) FG tries and 77-of-78 (98.7%) of his extra points since joining the Jags. Little finished fifth in fantasy scoring among kickers this season. With the Jaguars’ offense on the rise under head coach Liam Coen, the strong-legged Little should be considered a top-five fantasy kicker for 2026."],
[195,190,"R. Davis","BUF","RB",61,11,7,2,-5,32.6,3.2,1.2,0,"committee",1,0,""],
[196,196,"J. Myers","SEA","K",5,11,11,4,0,5.2,11.9,2.8,0,"starter",0,0,"Jason Myers finished as the top-scoring fantasy kicker last season with 202.0 points, although he finished second in fantasy points per game (11.9) behind Houston’s Ka’imi Fairbairn. FG volume is part of the appeal with Myers, who has led the NFL in field goal attempts in two of the last three seasons. Myers converted 41-of-48 FG tries last season. His career FG percentage is 85.6%, and while he hasn’t been one of the most accurate kickers in the league, Myers is an attractive fantasy kicker because of his situation. The world-champion Seahawks have an outstanding defense and an efficient, ball-control offense. It’s a formula that should produce ample field goal and extra point attempts. Consider Myers a top-five fantasy kicker for 2026."],
[197,197,"GB DST","GB","DST",11,11,11,2,0,16.0,1.5,-0.8,0,"starter",0,0,"The Packers didn’t win a game after losing edge rusher Micah Parsons last season. Until he returns, it’s hard to be overly bullish on this DST to start the year. 24th in the projections."],
[198,162,"D. Samuel Sr.","FA","WR",72,11,0,0,-36,41.1,7.3,3.1,0,"rotational",1,0,""],
[199,199,"N. Singleton","TEN","RB",62,11,9,3,0,45.2,2,0,0,"committee",1,0,""],
[200,191,"T. Ferguson","LAR","TE",24,11,11,4,-9,33.7,3.2,-2.6,0,"starter",1,1,"Terrance Ferguson, a second-round pick in last year’s NFL Draft, drew only 25 targets as a rookie and caught only 11 of them, but he averaged 21 yards per catch and 9.2 yards per target. Ferguson is an extraordinary physical specimen who ran a 4.63 and had a 39-inch vertical jump at last year’s combine at 6-foot-51/2, 247 pounds. But the Rams are log-jammed at tight end. They rotated four TEs last year - Ferguson, Colby Parkinson, Tyler Higbee and Davis Allen - and Ferguson averaged fewer snaps per game than the other three. The Rams have also added another TE, selecting Max Klare of Ohio State in the second round of this year’s draft. On the bright side, Rams head coach Sean McVay used 13 personnel, with three TEs on the field at once, on 30.5% of the Rams’ offensive snaps last season. No other team used 13 personnel on more than 14% of its plays. Rams tight ends combined for 150 targets, 103 catches, 1,128 yards and 17 touchdowns last season. Role ambiguity makes Ferguson undraftable in all but the deepest fantasy leagues, but his athleticism and the possibility that he earns a bigger role in a TE-friendly offense make him worth monitoring."],
[201,208,"D. Mooney","NYG","WR",73,11,8,4,7,21.9,3.4,-0.8,0,"rotational",1,0,"Darnell Mooney could quietly emerge as an important veteran presence in the Giants’ offense after reuniting with OC Matt Nagy in New York on a one-year deal. Injuries derailed his 2025 season in Atlanta, but Mooney still brings proven downfield ability and prior 1,000-yard production to a WR room searching for stability behind Malik Nabers. His vertical skill set meshes well with Jaxson Dart’s aggressive style of play, and he should compete for meaningful snaps early in the season while Nabers works his way back. Among the Giants’ veteran receivers, Mooney offers the most fantasy intrigue entering 2026."],
[202,176,"S. Tucker","TB","RB",63,11,10,2,-26,33.5,4.9,2.9,0,"committee",1,0,""],
[203,147,"J. Nailor","LV","WR",74,11,13,2,-56,46.7,4.2,0.0,0,"contested",1,1,"It wouldn’t shock me at all if Jalen Nailor steps up as the clear number two option for the Raiders this season behind Brock Bowers through the air. Nailor isn’t facing stiff competition from Tre Tucker, Jack Bech, Dont’e Thornton, and company. Yes, last year Nailor had only a 10.3% target share, 1.19 yards per route run, and a 10.8% first-read share (per Fantasy Points Data). None of those metrics will or should get you excited, but when we dig deeper, his per-route numbers are QUITE INTERESTING. Last year, among 109 qualifying receivers, he was 33rd in separation and 51st in route win rate. As a perimeter receiver among the same sample, his numbers look even better (141 routes) as he was sixth-best in separation and 13th in route win rate. Nailor is the final pick in a draft that could pay dividends and become a weekly WR3 or flex if it all works out."],
[204,204,"BAL DST","BAL","DST",12,11,13,5,0,26.1,1.9,-0.4,0,"starter",1,0,"With new HC Jesse Minter leading a healthier Ravens defense against an easier schedule, I’d project Baltimore to get back into the top-tier DST conversation. The cupcake schedule to open 2026 also benefits them greatly: Colts, Saints, Cowboys, Titans, Falcons and Browns. Draft that Ravens DST has the second-easiest schedule through the first six weeks of the year (top-5 in the FantasyPros SOS overall)."],
[205,205,"E. Pineiro","SF","K",6,11,8,5,0,4.9,10.0,0.9,0,"starter",0,0,"Coming off the finest season of his six-year career, Eddy Pineiro looks like a solid fantasy option for 2026. Pineiro led all kickers in field goal accuracy last season, converting at a 96.6% clip. He was a perfect 21-of-21 from inside 50 yards and was 6-of-7 from 50 yards and beyond. Strangely, Pineiro was less accurate on PATs than on field goals, hitting 89.5% of his 38 extra-point attempts. The 49ers brought in Pineiro in Week 2 after Jake Moody missed a 27-yard FG attempt and had a 36-yard try blocked in San Francisco’s 17-13 Week 1 victory over Seattle. Pineiro averaged 10.0 fantasy points per game last year, tying for fifth in that category among kickers who played at least six games."],
[206,206,"KC DST","KC","DST",13,11,5,3,0,16.6,1.8,-0.5,0,"starter",0,0,"The Chiefs have the third-easiest schedule to start the year (easiest through first four weeks). Gives ample time for Patrick Mahomes to be brought up to speed (also has a bye in Week 5) and for the defense to prove it’s worth. KC added to its defensive line this offseason but lost key secondary pieces, suggesting they face a surplus of pass attempts in 2026. They also finished 30th in opponent fumbles and last in non-offensive TDs (0). Week 1 is at home versus Denver, followed by matchups versus Indy, Miami and Las Vegas."],
[207,209,"J. Noel","HOU","WR",75,11,8,3,2,31.3,2.5,-1.7,0,"rotational",1,0,"Jaylin Noel barely made an impact statistically as a rookie, but Houston always viewed him as more of a long-term option behind its veteran receivers. With Christian Kirk now gone, Noel has a realistic path to a much larger offensive role after flashing whenever he received extended playing time in 2025. He was Pro Football Focus’ (PFF) seventh-highest graded returner on 72 combined kick/punt returns in 2025. He flashed on multiple occasions as a receiver in Year 1. In the games where Noel ran at least 17 routes, he averaged almost four receptions per game.Tank Dell’s eventual return could create some overlap, but Noel is firmly on the radar as a Year 2 breakout candidate in Houston’s offense."],
[208,208,"T. Loop","BAL","K",7,11,13,3,0,9.3,8.5,-0.6,0,"starter",0,0,"The Ravens’ Tyler Loop finished 12th in fantasy scoring last season as a rookie, averaging 8.5 fantasy points a game. Loop hit 30-of-34 field goals last season. He missed only one FG attempt from inside 50 yards but was only 1-of-4 from 50 yards or longer. Loop hit 44-of-46 extra points. The Ravens tied for 14th in FG attempts last year. With better health for star QB Lamar Jackson, who missed four games last season and appeared to be less than 100% in others, the Ravens could present Loop with more scoring opportunities in his second NFL season."],
[209,197,"J. Brissett","ARI","QB",27,11,14,2,-12,44.4,16.8,4.1,0,"starter",1,0,"After Kyler Murray sustained what proved to be a season-ending foot injury early last season, Jacoby Brissett took over as the Cardinals starting quarterback for the final 12 games of the year. While the Cardinals won only one of Brissett’s starts, Brissett pumped life into the Arizona passing game, averaging 288 passing yards per start and throwing 23 TD passes and eight interceptions. Heavy passing volume helped. Brissett averaged 40.3 pass attempts per start, and the Cardinals led the NFL in pass attempts. Brissett is expected to open the 2026 season as the Cardinals’ starter, although Arizona drafted Carson Beck at the top of the third round. The Cardinals have a nice set of pass catchers with TE Trey McBride and WRs Marvin Harrison Jr and Michael Wilson. But with the Cardinals’ passing volume likely to regress, and with the likelihood that Beck gets an audition at some point this season, Brissett is a risky fantasy play for anyone inclined to chase his 2025 numbers."],
[210,164,"T.J. Hockenson","MIN","TE",25,11,6,4,-46,21.8,4.1,-1.7,0,"starter",1,0,"It was only three years ago that TJ Hockenson had 95 catches for 960 yards and five touchdowns. But Hockenson tore the ACL and MCL in his right knee in late December of that 2023 season, and he has yet to regain his old form. Last year, Hockenson had 51 catches for 538 yards and three touchdowns in 15 games. Granted, the Vikings’ quarterbacking was substandard, which might help explain why Hockenson averaged a career-low 8.6 yards per catch. The Vikings could conceivably get a QB upgrade with Kyler Murray this season, and TE Trey McBride was Murray’s favorite target during the QB’s final three years in Arizona. But Hockenson is entering his age-29 season, and he’ll have to share targets with WRs Justin Jefferson and Jordan Addison. Consider him a low-end TE2 or high-end TE3."],
[211,189,"B. Aiyuk","SF","WR",76,11,8,2,-22,43.0,2,-2.2,0,"rotational",1,0,""],
[212,212,"CLE DST","CLE","DST",14,11,11,5,0,27.9,2.6,0.3,0,"starter",1,0,"No Myles Garrett or DC Jim Schwartz? No thanks. 17th in the projections."],
[213,254,"J. Wright","MIA","RB",64,11,6,3,41,27.4,3.9,1.9,0,"committee",1,0,""],

[215,215,"E. McPherson","CIN","K",8,11,6,2,0,12.4,8.0,-1.1,0,"starter",0,0,"After converting only 72.7% of his field goal attempts in 2024, five-year veteran Evan McPherson had a career-best 89.3% FG accuracy rate in 2025, hitting 25-of-28 attempts. McPherson finished 14th among kickers in fantasy scoring last year and hasn’t finished in the top 10 since his 2021 rookie season. But if Bengals QB Joe Burrow, who missed nine games last season, enjoys a season of good health, McPherson should have his fair share of FG and PAT opportunities."],
[216,250,"C. Dike","TEN","WR",77,11,9,3,34,41.0,4.6,0.4,0,"rotational",1,0,""],
[217,217,"C. Santos","CHI","K",9,11,10,0,0,6.7,8.8,-0.3,0,"starter",0,0,"The Bears have an ascendant offense under second-year head coach Ben Johnson, giving Bears kicker Cairo Santos some fantasy appeal for 2026. Santos tied for 15th among kickers in fantasy points per game last season with 8.8. The 34-year-old kicker’s field goal accuracy has waned in recent years. Santos converted 91.1 of his FG attempts over a four-year span from 2020 to 2023, but he’s hit just 83.6% of his field goals over the last two seasons. Fantasy managers should also consider that Santos plays his home games in Chicago’s Soldier Field, where weather often becomes a factor late in the season."],
[218,218,"A. Borregales","NE","K",10,11,11,1,0,14.4,8.8,-0.3,0,"starter",0,0,"Native Venezuelan Andres “Andy” Borregales tied for 15th in fantasy scoring as a rookie, making 27-of-32 field goals and 53-of-55 extra points. The Patriots should once again have a solid offense, with young star QB Drake Maye at quarterback and new arrival AJ Brown upgrading New England’s WR corps. Borregales finished second in extra-point attempts last year behind only Jake Bates. The Patriots will have a tougher schedule in 2026 than they had in 2025 and if Borregales has fewer extra points and more field goals this season, he could crack the top 10 in fantasy scoring at the position."],
[219,171,"A. Williams","WAS","WR",78,11,7,2,-48,41.3,2,-2.2,0,"rotational",1,0,"Antonio Williams is a sneaky Day 2 value who projects into an immediate slot role in Washington’s offense. The former Clemson standout broke out at 19 and has consistently flashed strong efficiency (2.27 YPRR in 2025) despite battling injuries and an underwhelming team environment. With Deebo Samuel gone and the Commanders ranking top-3 in vacated targets, there’s a clear path to volume behind Terry McLaurin. Williams’ slot-heavy usage, versatility on special teams, and strong production profile make him a strong late-round sleeper in PPR formats."],
[220,205,"P. Bryant","DEN","WR",79,11,10,2,-15,22.9,2.9,-1.3,0,"contested",1,1,"Pat Bryant quietly carved out a larger role as his rookie season progressed, giving Denver reason to believe he can contribute more in Year 2. The former third-round pick earned increased playing time late in the season and showed flashes of reliability before an injury cut short his playoff run. The addition of Jaylen Waddle limits Bryant’s path to major target volume, but he still projects as the favorite for the Broncos’ No. 3 WR role entering 2026. In deeper formats, Bryant profiles as more of a depth stash tied to offensive growth rather than standalone volume."],
[221,216,"R. Bateman","BAL","WR",80,11,13,4,-5,28.4,2.8,-1.4,0,"rotational",1,0,""],
[222,169,"D. Stribling","SF","WR",81,11,8,2,-53,37.9,2,-2.2,0,"contested",1,0,"De’Zhaun Stribling received the draft capital boost fantasy managers crave, but his profile still carries more risk than his post-draft hype suggests. The 49ers clearly believe in the former Ole Miss receiver, yet concerns remain about his age, production profile, target-earning ability, and path to immediate volume in a crowded offense. Stribling’s ADP has climbed rapidly because of landing spot and draft capital, but those factors alone do not guarantee fantasy success. He remains a worthwhile swing if he falls in rookie drafts, though expectations should be tempered for immediate production."],
[223,223,"DET DST","DET","DST",15,11,6,5,0,22.5,1.9,-0.4,0,"starter",1,0,"The Lions have the easiest schedule in the NFL (specifically through the first 5 weeks of the season). With them also due to experience positive injury regression on the defensive side of the ball, they are an easy sleeper DST to snag with your last pick. Generated the 4th-most passes defended last year (but just 13 interceptions) and a top-10 defense according to DVOA. Also dropped the second-most interceptions (9)."],
[224,210,"D. Njoku","LAC","TE",26,11,7,4,-14,29.3,4.4,-1.4,0,"starter",1,0,""],
[225,187,"D. Wicks","PHI","WR",82,11,10,4,-38,26.0,3.3,-0.9,0,"rotational",1,0,""],
[226,226,"J. Bates","DET","K",11,11,6,5,0,13.7,8.9,-0.2,0,"starter",0,0,"Lions kicker Jake Bates has one of the strongest legs in the NFL, and he plays for a team that can really pile on the points. Bates has led the NFL in extra points in each of the last two seasons, making 64 of them in 2024 and 54 of them in 2025. Perhaps the worst thing about having Bates as your fantasy kicker is that Lions head coach Dan Campbell is hyper-aggressive about going for it on fourth down, which robs Bates of some FG attempts. But Campbell is also willing to let his kicker try some long-range bombs. Bates was 4-of-9 on FG attempts from 50 yards or longer last season, and two of the misses were from 67 and 65 yards."],
[227,266,"O. Gordon II","MIA","RB",66,11,6,3,39,27.5,2.8,0.8,0,"committee",1,0,""],
[228,228,"BUF DST","BUF","DST",16,11,7,3,0,16.9,2.1,-0.2,0,"starter",0,0,"Through the first five weeks of the season, the Bills have the second-most difficult schedule. Under a new DC and defensive scheme, it might take some time for this unit to gel in 2026."],
[229,180,"G. Helm","TEN","TE",27,11,9,3,-49,23.5,3.0,-2.8,0,"starter",1,0,"Second-year man Gunnar Helm sits atop the Titans’ depth chart at tight end now that veteran Chig Okonkwo has moved on to Washington via free agency. A fourth-round pick out of the University Of Texas, Helm turned in a solid if unspectacular rookie season, catching 44 passes for 357 yards and two touchdown in an offense that struggled for much of the season. Helm caught 80% of his targets and averaged a respectable 1.45 yards per route run. Titans QB Cam Ward had a rough rookie season overall but played much better late in the season. If Ward can continue to make strides, Helm could become a fantasy-viable TE option in 2026."],
[230,267,"E. Ayomanor","TEN","WR",83,11,9,3,37,34.9,4.7,0.5,0,"rotational",1,0,""],
[231,231,"C. McLaughlin","TB","K",12,11,10,3,0,11.1,9.2,0.1,0,"starter",0,0,"The Buccaneers’ Chase McLaughlin ranked seventh in kicker scoring last year after ranking sixth in 2025. McLaughlin made 32-of-38 FG tries last year, an 84.2 conversion rate, but he had converted at 93.5% and 93.8% in 2023 and 2024, respectively. The 30-year-old McLaughlin has hit 119-of-122 extra points over the last three years. Some fantasy managers might appreciate having a warm-weather kicker whose home games are in Florida and whose only potential cold-weather games are Week 9 in Chicago and Week 14 in Baltimore."],
[232,219,"T. Hill","FA","WR",84,11,0,0,-13,51.8,8.1,3.9,0,"rotational",1,0,"The Dolphins released WR Tyreek Hill this offseason. After suffering a devastating knee injury in 2025, he might not be ready to contribute to an NFL roster until mid-way through the 2026 season."],
[233,193,"T. Dell","HOU","WR",85,11,8,3,-40,29.9,2,-2.2,0,"rotational",1,0,""],
[234,192,"P. Freiermuth","PIT","TE",28,11,9,2,-42,23.0,4.3,-1.5,0,"starter",1,0,"Pat Freiermuth was the Steelers’ best pass-catching tight end last season, but that didn’t mean much, as Freiermuth finished with 41 catches for 486 yards and four touchdowns. He finished TE24 in half-point PPR fantasy scoring. The Steelers’ offensive coordinator last season, Arthur Smith, rotated his tight ends, and Freiermuth had a career-low 51% snap share last year. Freiermuth has topped 60 catches in three of his five NFL seasons, and he’s squarely in his prime at age 27. If new Steelers head coach Mike McCathy and new offensive coordinator Brian Angelichio make Freiermuth a bigger part of the Pittsburgh offense than he was under Smith last year, the veteran tight end could surprise."],
[235,186,"M. Washington","MIA","WR",86,12,6,3,-49,38.8,4.2,-0.3,0,"rotational",1,0,""],
[236,206,"M. Lloyd","GB","RB",67,12,11,4,-30,42.8,2,0,0,"committee",1,0,""],
[237,218,"C. Parkinson","LAR","TE",29,12,11,4,-19,27.3,5.8,4.3,0,"starter",1,0,""],
[238,182,"G. Bernard","PIT","WR",87,12,9,3,-56,35.9,2,-2.5,0,"contested",1,0,"Germie Bernard profiles as a better real-life fit than fantasy target entering the NFL, landing behind established veterans DK Metcalf and Michael Pittman Jr. in Pittsburgh. The former Alabama receiver offers versatility, toughness, and strong YAC ability, which should help him earn snaps early, particularly from the slot. However, Year 1 fantasy expectations should remain modest given the crowded depth chart and uncertainty surrounding Pittsburgh’s quarterback situation. The second-round pick feels more like a long-term depth stash than an immediate-impact rookie, although his well-rounded skill set gives him a relatively safe floor."],
[239,239,"H. Mevis","LAR","K",13,12,11,2,0,20.9,9.1,-0.9,0,"starter",1,0,"Harrison Mevis joined the Rams midway through the 2025 season and earned the trust of his team, making 12-of-13 FG attempts and 39-of-39 extra points in the regular season, then going 6-of-6 on field goals and 9-of-9 on extra points in three playoff games. The 6-0, 245-pound Mevis has a beefy build that earned him the nickname “The Thiccer Kicker.” If Mevis continues to be accurate, he should have a chance to rack up a lot of points for the Rams, who currently have the shortest odds to win the Super Bowl. The Rams have a high-powered offense directed by head coach Sean McVay, and the addition of Myles Garrett gives the Rams a fearsome defense. Mevis is a compelling option in 2026 fantasy drafts."],
[240,185,"G. Smith","NYJ","QB",28,12,13,4,-55,31.2,12.7,0.8,0,"starter",1,0,"After a poor season with the Raiders in 2025, Geno Smith is expected to be the Jets’ Week 1 starter in 2026. Smith threw 17 interceptions in 15 starts last season and averaged just 12.7 fantasy points per game. But Smith is only two years removed from a 4,320-yard season with the Seahawks in 2024. And at 35, Smith is old but not ancient. The Jets have a solid offensive line and an interesting collection of pass catchers that includes Garrett Wilson and first-round rookies Kenyon Sadiq and Omar Cooper Jr. It’s unlikely that Smith will have much fantasy relevance this season, but it’s possible he’ll be capable enough to warrant consideration as an injury or bye week fill-in."],
[241,201,"C. Kupp","SEA","WR",88,12,11,3,-40,33.0,4.4,-0.1,0,"rotational",1,0,""],
[242,183,"C. Otton","TB","TE",30,12,10,2,-59,16.7,4.0,2.5,0,"starter",0,0,"Cade Otton has had 59 receptions in each of the last two seasons. He finished with 572 receiving yards and one touchdown last year, leading to a TE25 fantasy finish. Otton has had spurts of serious fantasy value in the past, usually when one or more of the Bucs’ top pass catchers were hurt. When Buccaneers WRs Mike Evans and Chris Godwin both went down with significant injuries in Week 7 of 2024, Otton had 30 catches for 293 yards and three touchdowns over a four game stretch. In Otton’s other 10 games that season, he had 29 catches for 307 yards and one touchdown. With Evans now in San Francisco, perhaps Otton will play a bigger role in the Tampa Bay offense this year. But Otton profiles as no more than a high-end TE3 and isn’t draftable in most fantasy leagues."],
[243,243,"C. Boswell","PIT","K",14,12,9,4,0,15.5,8.9,-1.1,0,"starter",0,0,"Chris Boswell finished ninth in kicker fantasy scoring last year, even though he wasn’t quite as accurate on field goals as usual. Boswell has posted a field goal conversion rate of better than 90% in five of the last seven years, but he was only at 84.4% last year, making 27-of-34 FG tries. Pittsburgh’s Acrisure Stadium, formerly known as Heinz Field, has long been regarded as a tough place to kick, but Boswell has been reliable enough to stick with the Steelers for 11 seasons. The Pittsburgh offense might not be especially potent this season with 42-year-old Aaron Rodgers at quarterback, but new Steelers head coach Mike McCarthy has been accused in the past of being too willing to settle for field goals - potentially good news for Boswell stakeholders."],
[244,175,"A. Rodgers","PIT","QB",29,12,9,2,-69,41.8,14.6,2.7,0,"starter",1,1,"Aaron Rodgers is coming back for what he says will be his final NFL season. But the 42-year-old Rodgers appears to be little more than a depth option in superflex leagues and deep 1QB leagues. Rodgers averaged 14.6 fantasy points per game last season. He threw for 3,322 yards and 23 touchdowns - not bad numbers - but he averaged only 6.7 yards per pass attempt, and his average depth of throw was just 6.0 yards. This senior version of Rodgers is something of a check-down machine, and that’s not a great profile for fantasy. Rodgers appears anxious to get the ball out quickly to avoid hits, so he probably isn’t going to have many deep completions this season. The future Hall-of-Famer is little more than a fantasy depth option at this point."],
[245,245,"H. Butker","KC","K",15,12,5,5,0,23.9,8.8,-1.2,0,"starter",1,1,"Harrison Butker has become a less dependable fantasy kicker in recent years. It’s not because Butker has been substantially less accurate. It’s because the Kansas City offense has been scoring fewer touchdowns in recent years, giving Butker fewer freebie extra points. In Butker’s first five seasons, from 2017 to 2021, he averaged 3.0 extra points per game. In 2022 and 2023, Butker averaged 2.5 extra points per game. In 2024 and 2025, Butker averaged 2.0 extra points a game. Butker’s yearly finished in fantasy points per game among kickers: second, sixth, second, 13th, ninth, 20th, 10th, 26th, 15th. The Chiefs offense might not be among the NFL’s most explosive in 2026 with Patrick Mahomes coming off a major knee injury. Consider Butker a second-tier kicker option."],
[246,195,"T. Hurst III","TB","WR",89,12,10,4,-51,36.0,2,-2.5,0,"rotational",1,1,"Ted Hurst is one of the more intriguing Day 2 receivers from the 2026 class after dominating at multiple collegiate stops and testing like a true NFL athlete. The Buccaneers landed a size-speed prospect with legitimate downfield chops, as Hurst led the FBS in deep-ball production while showcasing strong contested-catch ability and red-zone upside. Tampa Bay offers a realistic path to early playing time with Mike Evans gone, giving Hurst an opportunity to compete for outside snaps immediately. He may be somewhat raw entering the league, but the athletic profile, target-earning ability, and landing spot make Hurst an appealing upside bet for both dynasty and deeper redraft formats."],
[247,194,"J. Blue","DAL","RB",68,12,14,4,-53,30.2,3.9,1.9,0,"committee",1,0,""],
[248,217,"K. Coleman","BUF","WR",90,12,7,4,-31,28.5,5.0,0.5,0,"rotational",1,0,""],
[249,177,"Z. Branch","ATL","WR",91,12,11,3,-72,29.5,2,-2.5,0,"rotational",1,1,"Zachariah Branch enters Atlanta with a clear opportunity to carve out an immediate role behind Drake London in a thin Falcons WR room. The explosive rookie thrives with the ball in his hands, leading the nation in screen targets while showcasing elite open-field ability and dynamic YAC skills. His fit alongside Tua Tagovailoa makes plenty of sense stylistically, especially in an offense that could manufacture touches for him early. Although his smaller frame may cap his ceiling, Branch has intriguing upside if he can quickly secure the Falcons’ No. 2 WR role."],
[250,203,"E. Sarratt","BAL","WR",92,12,13,4,-47,29.7,2,-2.5,0,"contested",1,0,"2026 4th-rounder Elijah Sarratt may have been overshadowed by Baltimore’s earlier selection of Ja’Kobi Lane, but the former Indiana receiver offers an intriguing pathway to Year 1 relevance. Sarratt enters a crowded, run-heavy offense, yet his strong production profile, early breakout age, and red-zone skill set could help him carve out a role quickly if Mark Andrews continues declining. The Ravens already have their No.1 WR in Zay Flowers, so expectations should remain tempered, but Sarratt’s ability to win contested catches and earn targets gives him sleeper appeal. Among Baltimore’s rookie receivers, he might be the better value bet relative to cost."],
[251,270,"M. Davis","DAL","RB",69,12,14,4,19,27.2,3.9,1.9,0,"committee",1,0,""],
[252,223,"J. Hill","BAL","RB",70,12,13,3,-29,42.3,4.4,2.4,0,"committee",1,0,""],
[253,220,"D. Claiborne","MIN","RB",71,12,6,4,-33,33.2,2,0,0,"committee",1,0,""],
[254,224,"T. Horton","SEA","WR",93,12,11,3,-30,31.0,6.5,2.0,0,"rotational",1,0,""],
[255,257,"Ty Johnson","BUF","RB",72,12,7,2,2,33.6,4.5,2.5,0,"committee",1,0,""],
[256,170,"F. Mendoza","LV","QB",30,12,13,1,-86,37.0,8.9,-3.0,0,"starter",1,1,"The No. 1 pick in this year’s NFL Draft, Fernando Mendoza might sit behind veteran Kirk Cousins early in the season, but it shouldn’t be long before the 2025 Heisman Trophy winner takes over as the Raiders’ starter. Mendoza completed 72.0% of his passes last season, averaged 9.3 yards per pass attempt, and threw for 41 touchdowns in 16 games while leading Indiana to an undefeated season and the National Championship. Mendoza has an NFL-caliber arm and terrific ball placement. A student of the game, Mendoza is cool under fire. His functional mobility probably won’t translate to much rushing value at the NFL level, although Mendoza could score a few rushing touchdowns every year. Matt Ryan seems like a reasonable comp for Mendoza based on their tools and style of play. We might not see much of a fantasy impact from the rookie in Year 1, particularly when the Raiders are so short on pass-catching firepower beyond TE Brock Bowers, but we can’t rule out a fantasy-relevant rookie season for Mendoza."],
[257,325,"D. Neal","NO","RB",73,12,8,3,68,37.2,4.8,2.8,0,"committee",1,0,""],
[258,225,"E. Engram","DEN","TE",31,12,10,4,-33,15.8,3.3,1.8,0,"starter",0,0,""],
[259,248,"T. Johnson","NYG","TE",32,12,8,3,-11,28.2,5.5,4.0,0,"starter",1,0,""],
[260,227,"C. Bell","MIA","WR",94,12,6,3,-33,37.6,2,-2.5,0,"contested",1,1,"Chris Bell’s rookie season outlook is tied heavily to his recovery timeline after suffering an ACL injury late in 2025, but Miami offers a strong long-term landing spot given the lack of pass-catching depth. The former Louisville standout brings legitimate alpha traits and was one of college football’s premier target earners before getting hurt. Miami can afford to be patient, potentially setting Bell up for a larger role once healthy in an offense lacking long-term answers at receiver. He’s a better dynasty investment than immediate redraft target, though his upside remains appealing if he returns to full strength quickly."],
[261,198,"E. Stowers","PHI","TE",33,12,10,4,-63,33.4,1.5,0.0,0,"starter",1,0,"The Eagles took Eli Stowers in the second round of this year’s NFL Draft, 54th overall. Stowers won the John Mackey Award last year as the best tight end in college football, finishing his senior year at Vanderbilt with 62 catches for 769 yards and four touchdowns. Stowers had a 27% target rate last year and averaged an impressive 2.55 yards per route run. And like fellow rookie TE Kenyon Sadiq, Stowers is an athletic marvel. Stowers ran a 4.51 at the combine, and the former Texas state high school high-jump champion had a vertical jump of 451/2 inches. The 6-4, 239-pound Stowers might not be heavy enough to play as an in-line tight end, which could potentially limit his snaps. It’s hard to project big things for Stowers in his rookie year when his usage and role are uncertain, but his athleticism and college production suggest he’s capable of big things sooner or later."],
[262,295,"K. Johnson","PIT","RB",74,12,9,2,33,42.7,0.8,-1.2,0,"committee",1,0,""],
[263,274,"C. Brooks","GB","RB",75,12,11,4,11,30.2,1.2,-0.8,0,"committee",1,0,""],
